<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ôn thi trắc nghiệm của những chú khỉ </title>
<style>
  :root{
    --bg:#0f172a;
    --card:#ffffff;
    --ink:#1e293b;
    --muted:#64748b;
    --border:#e2e8f0;
    --primary:#4f46e5;
    --primary-dark:#4338ca;
    --green:#16a34a;
    --green-bg:#dcfce7;
    --red:#dc2626;
    --red-bg:#fee2e2;
    --amber:#d97706;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:linear-gradient(180deg,#0f172a 0%,#1e293b 260px,#f1f5f9 260px, #f1f5f9 100%);
    color:var(--ink);
    min-height:100vh;
    padding-bottom:60px;
  }
  .wrap{max-width:820px;margin:0 auto;padding:24px 16px;}
  header.top{
    text-align:center;
    color:#fff;
    padding:28px 16px 10px;
  }
  header.top h1{margin:0 0 6px;font-size:1.5rem;}
  header.top p{margin:0;color:#cbd5e1;font-size:.9rem;}

  /* nav shared style */
  .nav{max-width:820px;margin:14px auto 0;padding:12px 16px;display:flex;align-items:center;justify-content:space-between;gap:12px}
  .nav b{color:#fff;font-weight:700}
  .nav ul{list-style:none;margin:0;padding:0;display:flex;gap:10px}
  .nav a{display:inline-block;padding:8px 12px;border-radius:8px;text-decoration:none;font-weight:700;color:var(--primary);background:#fff}

  .card{
    background:var(--card);
    border-radius:16px;
    box-shadow:0 10px 30px rgba(0,0,0,.08);
    padding:24px;
    margin-top:20px;
  }

  /* --- Start screen --- */
  #start-screen .stats{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:12px;
    margin:20px 0;
  }
  .stat-box{
    background:#f8fafc;
    border:1px solid var(--border);
    border-radius:12px;
    padding:14px 10px;
    text-align:center;
  }
  .stat-box .num{font-size:1.4rem;font-weight:700;color:var(--primary);}
  .stat-box .lbl{font-size:.75rem;color:var(--muted);margin-top:2px;}

  .btn{
    display:inline-block;
    background:var(--primary);
    color:#fff;
    border:none;
    padding:14px 28px;
    border-radius:10px;
    font-size:1rem;
    font-weight:600;
    cursor:pointer;
    transition:background .15s ease, transform .1s ease;
  }
  .btn:hover{background:var(--primary-dark);}
  .btn:active{transform:scale(.98);}
  .btn.secondary{
    background:#fff;
    color:var(--primary);
    border:1.5px solid var(--primary);
  }
  .btn.secondary:hover{background:#eef2ff;}
  .btn.full{width:100%;}
  .btn:disabled{opacity:.5;cursor:not-allowed;}

  .opt-row{display:flex;gap:10px;margin:14px 0 6px;flex-wrap:wrap;}
  .chip{
    padding:8px 14px;
    border-radius:999px;
    border:1.5px solid var(--border);
    background:#fff;
    cursor:pointer;
    font-size:.85rem;
    font-weight:600;
    color:var(--muted);
  }
  .chip.active{
    border-color:var(--primary);
    color:var(--primary);
    background:#eef2ff;
  }

  /* --- Quiz screen --- */
  #quiz-screen{display:none;}
  .progress-bar-outer{
    background:#e2e8f0;
    border-radius:999px;
    height:8px;
    overflow:hidden;
    margin:14px 0 4px;
  }
  .progress-bar-inner{
    background:var(--primary);
    height:100%;
    width:0%;
    transition:width .2s ease;
  }
  .progress-label{font-size:.8rem;color:var(--muted);display:flex;justify-content:space-between;}

  .q-card{
    border:1px solid var(--border);
    border-radius:14px;
    padding:18px 18px 14px;
    margin-bottom:16px;
    background:#fff;
  }
  .q-card .q-head{
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    gap:10px;
    margin-bottom:8px;
  }
  .q-num{
    background:var(--primary);
    color:#fff;
    font-weight:700;
    font-size:.75rem;
    border-radius:999px;
    padding:3px 10px;
    white-space:nowrap;
  }
  .q-tag{
    font-size:.7rem;
    color:var(--muted);
    background:#f1f5f9;
    padding:3px 8px;
    border-radius:999px;
    white-space:nowrap;
  }
  .q-text{font-size:1rem;line-height:1.5;font-weight:600;margin:6px 0 12px;}
  .option{
    display:flex;
    align-items:flex-start;
    gap:10px;
    border:1.5px solid var(--border);
    border-radius:10px;
    padding:10px 12px;
    margin-bottom:8px;
    cursor:pointer;
    font-size:.92rem;
    line-height:1.4;
    transition:border-color .1s ease, background .1s ease;
  }
  .option:hover{border-color:#a5b4fc;background:#f8fafc;}
  .option.selected{border-color:var(--primary);background:#eef2ff;}
  .option .letter{
    flex-shrink:0;
    width:24px;height:24px;
    border-radius:50%;
    border:1.5px solid var(--border);
    display:flex;align-items:center;justify-content:center;
    font-size:.75rem;font-weight:700;color:var(--muted);
  }
  .option.selected .letter{background:var(--primary);border-color:var(--primary);color:#fff;}

  /* graded state */
  .option.correct{border-color:var(--green);background:var(--green-bg);}
  .option.correct .letter{background:var(--green);border-color:var(--green);color:#fff;}
  .option.wrong{border-color:var(--red);background:var(--red-bg);}
  .option.wrong .letter{background:var(--red);border-color:var(--red);color:#fff;}
  .option.disabled{cursor:default;}

  #submit-bar{
    position:sticky;
    bottom:12px;
    display:flex;
    justify-content:center;
    margin-top:20px;
  }
  #submit-bar .btn{box-shadow:0 8px 20px rgba(79,70,229,.35);}

  /* --- Result screen --- */
  #result-screen{display:none;text-align:center;}
  .score-circle{
    width:150px;height:150px;
    border-radius:50%;
    margin:10px auto 16px;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    border:10px solid #e2e8f0;
    position:relative;
  }
  .score-circle .big{font-size:2.2rem;font-weight:800;}
  .score-circle .small{font-size:.8rem;color:var(--muted);}
  .result-msg{font-size:1.1rem;font-weight:700;margin:8px 0 4px;}
  .result-sub{color:var(--muted);font-size:.9rem;margin-bottom:16px;}
  .breakdown{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:10px;
    text-align:left;
    margin:18px 0;
  }
  .breakdown .row{
    display:flex;justify-content:space-between;
    background:#f8fafc;border-radius:10px;padding:10px 14px;
    font-size:.85rem;
  }
  .breakdown .row b{color:var(--ink);}
  .result-actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:10px;}

  .review-toggle{margin-top:24px;text-align:left;}
  .review-item{
    border:1px solid var(--border);border-radius:12px;padding:14px 16px;margin-bottom:10px;
  }
  .review-item.wrong-item{border-left:4px solid var(--red);}
  .review-item.right-item{border-left:4px solid var(--green);}
  .review-item .rq{font-weight:600;margin-bottom:6px;font-size:.92rem;}
  .review-item .ra{font-size:.85rem;margin:2px 0;}
  .review-item .ra.correct-ans{color:var(--green);font-weight:600;}
  .review-item .ra.wrong-ans{color:var(--red);font-weight:600;}

  footer.credit{
    text-align:center;color:#94a3b8;font-size:.75rem;margin-top:30px;
  }
</style>
</head>
<body>

<div class="wrap">
  <header class="top">
    <h1>Ôn thi trắc nghiệm Của Các Chú Khí</h1>
    <p>Random câu hỏi</p>
  </header>

  <!-- START SCREEN -->
  <div class="card" id="start-screen">
    <div class="stats" id="stats-boxes"></div>

    <div style="margin-top:8px;">
      <label style="font-size:.85rem;font-weight:600;color:var(--muted);">Số câu mỗi lượt làm bài</label>
      <div class="opt-row" id="count-options"></div>
    </div>

    <div style="margin-top:14px;">
      <label style="font-size:.85rem;font-weight:600;color:var(--muted);">Chọn phạm vi đề (tuỳ chọn)</label>
      <div class="opt-row" id="de-options"></div>
    </div>

    <div style="margin-top:22px;">
      <button class="btn full" onclick="startQuiz()"> Bắt đầu làm bài</button>
    </div>
  </div>

  <!-- QUIZ SCREEN -->
  <div id="quiz-screen">
    <div class="card" style="margin-top:0;">
      <div class="progress-label">
        <span id="progress-text">Đã trả lời 0/50</span>
        <span id="progress-pct">0%</span>
      </div>
      <div class="progress-bar-outer"><div class="progress-bar-inner" id="progress-bar"></div></div>
    </div>

    <div id="questions-container"></div>

    <div id="submit-bar">
      <button class="btn" id="submit-btn" onclick="submitQuiz()"> Nộp bài & Chấm điểm</button>
    </div>
  </div>

  <!-- RESULT SCREEN -->
  <div class="card" id="result-screen">
    <div class="score-circle" id="score-circle">
      <div class="big" id="score-big">0/50</div>
      <div class="small">điểm</div>
    </div>
    <div class="result-msg" id="result-msg"></div>
    <div class="result-sub" id="result-sub"></div>

    <div class="breakdown" id="breakdown"></div>

    <div class="result-actions">
      <button class="btn" onclick="location.reload()">🔄 Làm bộ đề mới</button>
      <button class="btn secondary" onclick="toggleReview()">📋 Xem lại chi tiết</button>
    </div>

    <div class="review-toggle" id="review-section" style="display:none;"></div>
  </div>

  <footer class="credit">Tự động random từ ngân hàng câu hỏi · Không lưu dữ liệu, chấm điểm hoàn toàn cục bộ trên trình duyệt.</footer>
</div>

<script>const QUIZ_DATA = [{"id": 1, "de": "1", "q": "Theo quan điểm của Chủ nghĩa Mác - Lênin, cách thức tiến hành sản xuất vật chất trong một giai đoạn lịch sử nhất định được gọi là?", "options": {"A": "Lực lượng sản xuất", "B": "Quan hệ sản xuất", "C": "Phương thức sản xuất", "D": "Cơ sở hạ tầng"}, "answer": "C"}, {"id": 2, "de": "1", "q": "Khoảng giới hạn mà trong đó sự biến đổi về lượng chưa làm thay đổi về chất của sự vật, hiện tượng được gọi là gì?", "options": {"A": "Chất", "B": "Lượng", "C": "Độ", "D": "Điểm nút"}, "answer": "C"}, {"id": 3, "de": "1", "q": "Một bộ phận của giá trị mới dôi ra ngoài giá trị sức lao động do công nhân làm thuê tạo ra và bị nhà tư bản chiếm không được gọi là?", "options": {"A": "Giá trị của hàng hóa", "B": "Giá trị thặng dư", "C": "Giá trị sử dụng của hàng hóa", "D": "Giá cả của hàng hóa"}, "answer": "B"}, {"id": 4, "de": "1", "q": "Theo quan điểm của Chủ nghĩa Mác - Lênin, cơ sở hạ tầng là:", "options": {"A": "Toàn bộ những quan hệ sản xuất hợp thành cơ cấu kinh tế của một hình thái kinh tế - xã hội nhất định.", "B": "Cách thức tiến hành sản xuất vật chất trong một giai đoạn nhất định của lịch sử", "C": "Mối quan hệ giữa người với người trong quá trình sàn xuất", "D": "Mối quan hệ giữa con người với tự nhiên trong quá trình sản xuất"}, "answer": "A"}, {"id": 5, "de": "1", "q": "\"Toàn bộ những quan điểm tư tưởng chính trị, pháp quyền, đạo đức, nghệ thuật, tôn giáo... và những thiết chế tương ứng như nhà nước, đảng phái, giáo hội..., đươc hình thành trên cơ sở hạ tầng nhất định và phản ánh cơ sở hạ tầng đó\", được gọi là gì?", "options": {"A": "Kiến trúc thượng tầng", "B": "Lực lượng sản xuất", "C": "Quan hệ sản xuất", "D": "Phương thức sản xuất"}, "answer": "A"}, {"id": 6, "de": "1", "q": "Câu tục ngữ: \" Có công mài sắt có ngày nên kim\" thể hiện hiện nội dung quy luật nào trong các quy luật cơ bản của Triết học Mác - Lênin?", "options": {"A": "Quy luật thống nhất và đấu tranh giữa các mặt đối lập.", "B": "Quy luật phủ định của phủ định.", "C": "Quy luật chuyển hóa từ những thay đổi về lượng thành những sự thay đổi về chất và ngược lại.", "D": "Tất cả các đáp án đều sai."}, "answer": "C"}, {"id": 7, "de": "1", "q": "Câu tục ngữ: \" Tre già măng mọc\" thể hiện hiện nội dung quy luật nào trong các quy luật cơ bản của Triết học Mác - Lênin?", "options": {"A": "Quy luật thống nhất và đấu tranh giữa các mặt đối lập.", "B": "Quy luật phủ định của phủ định.", "C": "Quy luật chuyển hóa từ những thay đổi về lượng thành những sự thay đổi về chất và ngược lại.", "D": "Quy luật tự nhiên"}, "answer": "B"}, {"id": 8, "de": "1", "q": "\"Từ trực quan sinh động đến tư duy trừu tượng và từ tư duy trừu tượng đến thực tiễn - đó là con đường biện chứng của sự nhận thức chân lý, của sự nhận thức thực tại khách quan\" Quan điểm trên của ai?", "options": {"A": "V.L. Lênin", "B": "Hồ Chí Minh", "D": "Mác", "E": "Ph. Ăngghen"}, "answer": "A"}, {"id": 9, "de": "1", "q": "Theo chủ nghĩa duy vật biện chứng: \" ...... là một phương thức tồn tại của vật chất, bao gồm tất cả mọi sự thay đổi và mọi quá trình diễn ra trong vũ trụ kể từ sự thay đổi vị trí đơn giản cho đến tư duy\"", "options": {"A": "Liên hệ", "B": "Đứng im", "C": "Phát triển", "D": "Vận động"}, "answer": "D"}, {"id": 10, "de": "1", "q": "Theo quan điểm của chủ nghĩa Mác- Lênin: Quan hệ sản xuất bao gồm:", "options": {"A": "Quan hệ sở hữu của người lao động đối với tư liệu sản xuất", "B": "Quan hệ của họ trong quá trình tổ chức, quản lý và phân công lao động.", "C": "Quan hệ của họ trong phân phối sản phẩm lao động", "D": "Tất cả các đáp án đều đúng"}, "answer": "D"}, {"id": 11, "de": "1", "q": "Theo quan điểm của chủ nghĩa Mác- Lênin, giai cấp công nhân có tính tiên tiến vì:", "options": {"A": "Giai cấp công nhân là giai cấp tiên tiến.", "B": "Giai cấp công nhân có tinh thần quốc tế vô sản", "C": "Giai cấp công nhân lao động trong dây chuyền hiện đại có tính nghiêm ngặt về kỷ luật lao động", "D": "Đại biểu cho lực lượng sản xuất hiện đại, gắn với khoa học công nghệ tiên tiến"}, "answer": "D"}, {"id": 12, "de": "1", "q": "Hoạt động nào của con người được coi là cơ bản nhất và là cơ sở của đời sống xã hội?", "options": {"A": "Hoạt động chính trị.", "B": "Hoạt động khoa học chất.", "C": "Hoạt động sản xuất của cải vật chất.", "D": "Hoạt động nghệ thuật, thể thao."}, "answer": "C"}, {"id": 13, "de": "1", "q": "Trong tư liệu sản xuất, bộ phận nào quyết định đến năng suất lao động của con người trong quá trình sản xuất:", "options": {"A": "Công cụ lao động", "B": "Nguyên vật liệu cho quá trình sản xuất", "C": "Kết cấu hạ tầng của sản xuất", "D": "Các vật dụng chứa đựng, bảo quản hàng hóa"}, "answer": "A"}, {"id": 14, "de": "1", "q": "\" Những thời đại kinh tế khác nhau không phải ở chỗ chúng sản xuất ra cái gì, mà ở chỗ chúng sản xuất bằng cách nào, với những tư liệu lao động nào\". Câu nói trên của ai?", "options": {"A": "Smith", "B": "Ricardo", "C": "Mác", "D": "Ăngghen"}, "answer": "C"}, {"id": 15, "de": "1", "q": "Bộ phận của Chủ nghĩa Mác-Lênin nghiên cứu về bản chất của Chủ nghĩa tư bản là", "options": {"A": "Triết học Mác-Lênin", "B": "Kinh tế chính trị Mác-Lênin", "C": "Chủ nghĩa xã hội khoa học", "D": "Tuyên ngôn Đảng cộng sản"}, "answer": "B"}, {"id": 16, "de": "1", "q": "Chủ nghĩa Mác-Lênin là hệ thống lý luận khoa học về sự nghiệp giải phóng ?", "options": {"A": "Giai cấp vô sản", "B": "Nhân dân lao động", "C": "Con người", "D": "giải phóng giai cấp vô sản, giải phóng nhân dân lao động, tiến tới giải phóng con người"}, "answer": "D"}, {"id": 17, "de": "1", "q": "Vật chất và ý thức, mối quan hệ biện chứng giữa vật chất và ý thức và nội dung nghiên cứu của bộ phận nào của Chủ nghĩa Mác-Lênin ?", "options": {"A": "Triết học Mác-Lênin", "B": "Kinh tế chính trị Mác-Lênin", "C": "Chủ nghĩa xã hội khoa học", "D": "Tuyên ngôn Đảng cộng sản"}, "answer": "A"}, {"id": 18, "de": "1", "q": "Theo quan điểm của chủ nghĩa Mác-Lênin phạm trù nào là sự phản ánh thế giới khách quan vào trong bộ não người một cách năng động, sáng tạo.", "options": {"A": "Vật chất", "B": "Không gian", "C": "Thế giới khách quan", "D": "Ý thức"}, "answer": "D"}, {"id": 19, "de": "1", "q": "Theo chủ nghĩa Mác, thời kỳ có sự cải biến cách mạng sâu sắc, toàn diện từ chủ nghĩa tư bản lên chủ nghĩa cộng sản là thời kỳ nào ?", "options": {"A": "thời kỳ quá độ", "B": "thời kỳ khủng hoảng", "C": "thời kỳ cách mạng", "D": "thời kỳ đấu tranh giải phóng"}, "answer": "A"}, {"id": 20, "de": "1", "q": "Có chế độ công hữu về tư liệu sản xuất; không còn chế độ người bóc lột người. Cách tổ chức lao động và kỷ luật lao động trên tinh thần tự giác, tự nguyện. Đây là một trong những đặc trưng của xã hội nào ?", "options": {"A": "Về xã hội xã hội chủ nghĩa", "B": "Xã hội tư bản chủ nghĩa", "C": "Xã hội phát triển", "D": "Xã hội phong kiến"}, "answer": "A"}, {"id": 21, "de": "1", "q": "Điền vào chỗ trống để có nội dung đúng: Giá trị của hàng hóa là ….…. của người sản xuất hàng hóa kết tinh trong hàng hóa.", "options": {"A": "tiền đầu tư", "B": "lao động xã hội cần thiết", "C": "máy móc, nhà xưởng", "D": "lao động"}, "answer": "B"}, {"id": 22, "de": "1", "q": "Giai cấp nào là giai cấp không có tư liệu sản xuất, họ phải bán sức lao động cho nhà tư bản, trở thành người làm thuê và bị bóc lột giá trị thặng dư", "options": {"A": "Tư sản", "B": "Công nhân", "C": "Địa chủ", "D": "Nông dân"}, "answer": "B"}, {"id": 23, "de": "1", "q": "Chủ nghĩa Mác - Lênin chỉ rõ nguyên nhân và động lực của sự phát triển xã hội chính là do yếu tố nào ?", "options": {"A": "sự phát triển của con người", "B": "sự phát triển của giai cấp công nhân", "C": "sự phát triển của sản xuất vật chất", "D": "sự phát triển của xã hội loài người"}, "answer": "C"}, {"id": 24, "de": "1", "q": "Phạm trù nào là mối quan hệ giữa con người với giới tự nhiên, là trình độ chinh phục tự nhiên của con người, là mặt tự nhiên của phương thức sản xuất.", "options": {"A": "Nhà máy,xí nghiệp, doanh nghiệp", "B": "Lực lượng sản xuất", "C": "Quan hệ sản xuất", "D": "Phương thức sản xuất"}, "answer": "B"}, {"id": 25, "de": "1", "q": "Theo quan điểm của chủ nghĩa duy vật lịch sử, khi phương thức sản xuất cũ mất đi, phương thức sản xuất mới ra đời thì sẽ dẫn đến sự ra đời của ?", "options": {"A": "Hệ thống các doanh nghiệp mới", "B": "Hệ thống công cụ, máy móc sản xuất mới", "C": "Ra đời công nghệ mới", "D": "Chế độ xã hội mới"}, "answer": "D"}, {"id": 26, "de": "1", "q": "Phạm trù nào là toàn bộ những quan hệ sản xuất hợp thành cơ cấu kinh tế của một hình thái kinh tế - xã hội nhất định ?", "options": {"A": "Cơ sở hạ tầng", "B": "Lực lượng sản xuất", "C": "Quan hệ sản xuất", "D": "Kiến trúc thượng tầng"}, "answer": "A"}, {"id": 27, "de": "1", "q": "Trong quá trình lao động, sức lao động tạo ra một lượng giá trị mới lớn hơn giá trị của bản thân nó, phần giá trị dôi ra so với giá trị sức lao động là giá trị thặng dư, đây là thuộc tính nào của hàng hóa sức lao động ?", "options": {"A": "Giá trị", "B": "Giá trị sử dụng", "C": "Thời gian lao động xã hội cần thiết", "D": "Giá trị trao đổi"}, "answer": "B"}, {"id": 28, "de": "1", "q": "Theo quan điểm của chủ nghĩa Mác-Lênin, giai cấp nào đại biểu cho phương thức sản xuất hiện đại nhất, gắn với khoa học và công nghệ tiên tiến - xu hướng của xã hội tương lai.", "options": {"A": "Giai cấp trí thức", "B": "Giai cấp tư sản", "C": "Giai cấp công nhân", "D": "Giai cấp địa chủ"}, "answer": "C"}, {"id": 29, "de": "1", "q": "Điền cụm từ đúng nhất vào chỗ trống: Nguồn gốc tự nhiên của ý thức đó là …… và thế giới khách quan", "options": {"A": "Tư tưởng con người", "B": "Suy nghĩ con người.", "C": "Bộ óc con người.", "D": "Tất cả các đáp án trên đều sai."}, "answer": "C"}, {"id": 30, "de": "1", "q": "Chủ nghĩa Mác - Lênin được cấu thành từ mấy bộ phận cơ bản?", "options": {"A": "1 bộ phận", "B": "2 bộ phận", "C": "3 bộ phận", "D": "4 bộ phận"}, "answer": "C"}, {"id": 31, "de": "1", "q": "Một trong những nguồn gốc cơ bản, trực tiếp và quan trọng nhất quyết định sự ra đời và phát triển của ý thức đó là:", "options": {"A": "Lao động.", "B": "Khoa học", "C": "Lý luận", "D": "Nhận thức"}, "answer": "A"}, {"id": 32, "de": "1", "q": "Chọn đáp án đúng nhất điền vào chỗ trống: Triết học Mác - Lênin là trường phái triết học duy vật biện chứng, ra đời vào những năm ……. của thế kỷ XIX.", "options": {"A": "40", "B": "50", "C": "60", "D": "70"}, "answer": "A"}, {"id": 33, "de": "1", "q": "Điền cụm từ đúng nhất vào chỗ trống: Vật chất là một trù triết học dùng để chỉ thực tại khách quan được đem lại cho con người trong cảm giác, được cảm giác của con người ………….. và nó tồn tại không lệ thuộc vào cảm giác.", "options": {"A": "Chép lại", "B": "Chụp lại", "C": "Phản ánh", "D": "Chép lại, chụp lại, phản ánh"}, "answer": "D"}, {"id": 34, "de": "1", "q": "Ph. Ăngghen đã chia vận động thành mấy hình thức cơ bản?", "options": {"A": "3 hình thức", "B": "4 hình thức", "C": "5 hình thức", "D": "6 hình thức"}, "answer": "C"}, {"id": 35, "de": "1", "q": "Trong hai thuộc tính của hàng hóa sức lao động, thì thuộc tính nào được xem như là chìa khóa để giải quyết mâu thuẫn công thức chung của tư bản?", "options": {"A": "Giá trị hàng hóa", "B": "Giá trị sử dụng của hàng hóa", "C": "Giá trị hàng hóa sức lao động", "D": "Giá trị sử dụng của hàng hóa sức lao động"}, "answer": "D"}, {"id": 36, "de": "1", "q": "Triết học Mác Lênin là trường phái triết học…...", "options": {"A": "Duy tâm", "B": "Duy vật biện chứng", "C": "Duy vật siêu hình", "D": "Duy vật chất phác"}, "answer": "B"}, {"id": 37, "de": "1", "q": "Theo Ăngghen phương thức tồn tại của vật chất là:", "options": {"A": "Vận động", "B": "Thụ động", "C": "Chuyển hóa", "D": "Chuyển biến"}, "answer": "A"}, {"id": 38, "de": "1", "q": "Theo quan điểm của triết học Mác Lênin: bản chất của thế giới là:", "options": {"A": "Ý thức", "B": "Tinh thần", "C": "Vật thể", "D": "Vật chất"}, "answer": "D"}, {"id": 39, "de": "1", "q": "Theo quan điểm của triết học Mác Lênin: sự phát triển của các sự vật hiện tượng diễn ra theo đường:", "options": {"A": "Elip", "B": "Vòng tròn", "C": "Thẳng đứng", "D": "Xoáy ốc"}, "answer": "D"}, {"id": 40, "de": "1", "q": "Theo triết học Mác Lênin: nhận thức là quá trình phản ánh mang tính...", "options": {"A": "Tích cực", "B": "Tự giác", "C": "Sáng tạo", "D": "Tất cả các câu đều đúng"}, "answer": "D"}, {"id": 41, "de": "1", "q": "Theo quan điểm của triết học Mác Lênin: \"Sản xuất và trao đổi hàng hóa phải dựa trên cơ sở hao phí sức lao động xã hội cần thiết\" là nội dung quy luật nào?", "options": {"A": "Gíá trị", "B": "Sản xuất", "C": "Kinh tế", "D": "Mua bán"}, "answer": "A"}, {"id": 42, "de": "1", "q": "Điền vào chỗ trống cho đúng với quan điểm của chủ nghĩa Mác Lênin: bản chất của chủ nghĩa tư bản chính là quan hệ…... của tư bản đối với công nhân làm thuê nhằm chiếm đoạt giá trị thặng dư:", "options": {"A": "Thống trị", "B": "Bóc lột", "C": "Tước đoạt", "D": "Chiếm giữ"}, "answer": "B"}, {"id": 43, "de": "1", "q": "Điền vào chỗ trống cho đúng với quan điểm của chủ nghĩa Mác Lênin: Sứ mệnh lịch sử của giai cấp công nhân là giành lấy chính quyền, xóa bỏ chế độ tư hữu tư bản chủ nghĩa, tổ chức xây dựng chế độ xã hội mới với chế độ…... xã hội chủ nghĩa về tư liệu sản xuất :", "options": {"A": "Sở hữu", "B": "Chiếm hữu", "C": "Công hữu", "D": "Tư hữu"}, "answer": "C"}, {"id": 44, "de": "1", "q": "Sứ mệnh lịch sử của giai cấp công nhân là lãnh đạo nhân dân lao động đấu tranh:", "options": {"A": "Xóa bỏ chế độ tư bản chủ nghĩa", "B": "Xóa bỏ mọi chế độ áp bức bóc lột", "C": "Xây dựng xã hội mới - xã hội Xã hội chủ nghĩa", "D": "Tất cả các câu đều đúng"}, "answer": "D"}, {"id": 45, "de": "1", "q": "Theo quan điểm của triết học Mác Lênin: Thực tiễn là tiêu chuẩn của :", "options": {"A": "Nhận thức", "B": "Tri thức", "C": "Lý luận", "D": "Chân lý"}, "answer": "D"}, {"id": 46, "de": "1", "q": "Ý thức có thể tác động trở lại vật chất thông qua hoạt động nào của con người ?", "options": {"A": "Có ý thức", "B": "Học tập", "C": "Nghiên cứu.", "D": "Thực tiễn"}, "answer": "D"}, {"id": 47, "de": "1", "q": "Những ngu  nghiệp ....................., giải phóng nhân dân lao động khỏi chế độ áp bức, bóc lột, tiến tới giải phóng con người.", "options": {"A": "Giải phóng giai cấp vô sản", "B": "Giải phóng giai cấp công nhân", "C": "Giải phóng con người", "D": "Giải phóng nô lệ"}, "answer": "C"}, {"id": 53, "de": "1", "q": "Triết học Mác – Lênin gồm những nội dung cơ bản nào?", "options": {"A": "Chủ nghĩa duy vật biện chứng", "B": "Phép biện chứng duy vật", "C": "Chủ nghĩa duy vật lịch sử:", "D": "Tất cả các đáp án của câu này đều đúng"}, "answer": "D"}, {"id": 54, "de": "1", "q": "Vì sao hàng hóa có hai thuộc tính là giá trị và giá trị sử dụng?", "options": {"A": "Vì lao động sản xuất hàng hóa có tính chất hai mặt", "B": "Vì có hai loại lao động là lao động trừu tượng và lao động cụ thể\nc. Vì hàng hóa được trao đổi trên thị trường", "C": "Vì hàng hóa là sản phẩm lao động của con người"}, "answer": "A"}, {"id": 55, "de": "1", "q": "Chọn đáp án đúng cho phần còn thiếu: \"Giai cấp công nhân Việt Nam là một lực lượng xã hội to lớn, đang phát triển, bao gồm những người ............, làm công hưởng lương trong các loại hình sản xuất kinh doanh và dịch vụ công nghiệp, hoặc sản xuất kinh doanh và dịch vụ có tính chất công nghiệp\". Chọn đáp án đúng cho phần còn thiếu trên.", "options": {"A": "Lao động chân tay và trí thức,", "B": "Lao động chân tay và trí óc,", "C": "Lao động phổ thông và trí óc,", "D": "Lao động phổ thông và lao động có tay nghề,"}, "answer": "B"}, {"id": 56, "de": "1", "q": "Nguyên tắc thực hiện phân phối trong xã hội cộng sản chủ nghĩa là gì?", "options": {"A": "Làm theo năng lực, hưởng theo nhu cầu", "B": "Làm theo năng lực, hưởng theo hiểu quả công việc", "C": "Làm theo năng lực, hưởng theo lao động", "D": "Tất cả các đáp án của câu này đều đúng"}, "answer": "A"}, {"id": 57, "de": "1", "q": "Học thuyết nào của C. Mác đã vạch rõ bản chất bóc lột của xã hội tư bản?", "options": {"A": "Học thuyết chủ nghĩa duy vật lịch sử", "B": "Học thuyết giá trị thặng dư", "C": "Học thuyết hình thái kinh tế – xã hội", "D": "Tất cả các đáp án của câu này đều đúng"}, "answer": "B"}, {"id": 58, "de": "1", "q": "\"Giai cấp vô sản là một giai cấp xã hội hoàn toàn chỉ kiếm sống bằng việc bán lao động của mình, chứ không phải kiếm sống bằng lợi nhuận của bất cứ tư bản nào.... Nói tóm lại, giai cấp vô sản hay giai cấp những người vô sản là giai cấp lao động trong thế kỷ XIX\". Nội dung trên được thể hiện trong tác phẩm nào?", "options": {"A": "Nguyên lý của chủ nghĩa cộng sản.", "B": "Tuyên ngôn Đảng cộng sản", "C": "Những nguyên lý của chủ nghĩa cộng sản", "D": "Những nguyên lý của chủ nghĩa xã hội"}, "answer": "B"}, {"id": 59, "de": "1", "q": "Yếu tố nào giữ vai trò quyết định trực tiếp đến việc biến óc vượn thành óc người và tâm lý động vật thành ý thức con người?", "options": {"A": "Lao động", "B": "Ngôn ngữ", "C": "Lao động và ngôn ngữ", "D": "Tất cả các đáp án trên đều sai"}, "answer": "C"}, {"id": 60, "de": "1", "q": "Quy luật giá trị có những tác động tiêu cực nào?", "options": {"A": "Phân hóa giàu - nghèo trong xã hội", "B": "Tiềm ẩn khung hoảng kinh tế", "C": "Ô nhiễm môi trường", "D": "Tất cả các đáp án của câu này đều đúng"}, "answer": "D"}, {"id": 61, "de": "1", "q": "Điền vào chỗ trống để có nội dung đúng: Nguyên lý về sự phát triển chỉ ra rằng: \"Phát triển là ...... của thế giới và nó có tính phổ biến, được thể hiện trong mọi lĩnh vực tự nhiên, xã hội và tư duy\".", "options": {"A": "Khuynh hướng chung", "B": "Xu hướng chung", "C": "Xu thế chung", "D": "Tất yếu"}, "answer": "A"}, {"id": 62, "de": "1", "q": "Trong ba bộ phận cấu thành chủ nghĩa Mác – Lênin, bộ phận nào nghiên cứu những quy luật chính trị- xã hội của quá trình phát sinh, hình thành và phát triển của hình thái kinh tế- xã hội cộng sản chủ nghĩa mà giai đoạn thấp là chủ nghĩa xã hội?", "options": {"A": "Triết học Mác – Lê nin", "B": "Kinh tế chính trị Mác – Lê nin", "C": "Chủ nghĩa xã hội khoa học", "D": "Tất cả các đáp án của câu này đều đúng"}, "answer": "C"}, {"id": 63, "de": "1", "q": "Quy luật nào vạch ra nguồn gốc của sự vận động, phát triển của sự vật, hiện tượng?", "options": {"A": "Quy luật thống nhất và đấu tranh của các mặt đối lập", "B": "Quy luật chuyển hóa từ sự thay đổi về lượng dẫn đến sự thay đổi về chất và ngược lại", "C": "Quy luật phủ định của phủ định", "D": "Quy luật về sự phù hợp của quan hệ sản xuất với tính chất và trình độ của lực lượng sản xuất"}, "answer": "A"}, {"id": 64, "de": "1", "q": "Chủ nghĩa Mác - Lênin là hệ thống quan điểm lý luận và học thuyết do ai sáng lập", "options": {"A": "Mác, Ph. Ăngghen và Hêghen", "B": "Mác, Ph. Ăngghen", "C": "Mác, Ph. Ăngghen và V.I. Lênin", "D": "Mác và Ănggen"}, "answer": "B"}, {"id": 65, "de": "1", "q": "Hãy tìm ra đáp án sai về đặc trưng xã hội Cộng sản chủ nghĩa:", "options": {"A": "Thực hiện nguyên tắc phân phối theo lao động và phân phối theo phúc lợi xã hội ngày càng tăng", "B": "Làm theo năng lực, hưởng theo nhu cầu", "C": "Con người có đầy đủ các điều kiện phát triển năng lực toàn diện", "D": "Những thiết chế chính trị và pháp luật sẽ hoàn toàn mất đi, nhà nước trở thành không cần thiết, nó tự tiêu vong."}, "answer": "A"}, {"id": 66, "de": "1", "q": "Câu tục ngữ: \"Kiến tha lâu cũng đầy tổ\" thể hiện nội dung quy luật nào trong các quy luật cơ bản của triết học Mác- Lênin?", "options": {"A": "Quy luật lượng- chất", "B": "Quy luật mâu thuẫn", "C": "Quy luật phủ định của phủ định", "D": "Quy luật tự nhiên"}, "answer": "A"}, {"id": 67, "de": "1", "q": "Điền cụm từ đúng nhất vào chỗ trống: ... là tiêu chuẩn để kiểm tra tính đúng đắn của chân lý", "options": {"A": "Vật chất", "B": "Ý thức", "C": "Nhận thức", "D": "Thực tiễn"}, "answer": "D"}, {"id": 68, "de": "1", "q": "Nguyên lý về mối liên hệ phổ biến trong triết học Mác - Lênin chỉ ra rằng: Thế giới có vô vàn các sự vật, hiện tượng nhưng chúng tồn tại trong… trực tiếp hay gián tiếp với nhau.", "options": {"A": "sự chuyển hóa", "B": "quan hệ", "C": "mối liên hệ", "D": "liên hệ"}, "answer": "C"}, {"id": 69, "de": "1", "q": "Theo chủ nghĩa Mác-Lênin: Lao động xã hội cần thiết của người sản xuất hàng hóa kết tinh trong hàng hóa được gọi là?", "options": {"A": "Giá trị của hàng hóa", "B": "Giá trị thặng dư", "C": "Giá trị sử dụng của hàng hóa", "D": "Giá cả của hàng hóa"}, "answer": "A"}, {"id": 70, "de": "1", "q": "Theo chủ nghĩa Mác – Lênin: Giá trị thặng dư là...", "options": {"A": "lao động xã hội cần thiết của người sản xuất hàng hóa kết tinh trong hàng hóa.", "B": "một bộ phận của giá trị mới dôi ra ngoài giá trị sức lao động do công nhân làm thuê tạo ra và bị nhà tư bản chiếm không.", "C": "công dụng của vật phẩm có thể thoả mãn nhu cầu của con người.", "D": "biểu hiện bằng tiền của giá trị hàng hóa"}, "answer": "B"}, {"id": 71, "de": "1", "q": "Tác phẩm \"Tuyên ngôn của Đảng Cộng sản\" do ai viết ?", "options": {"A": "C.Mác- Ph.Ănghen", "B": "V.I.Lênin", "C": "Chủ tịch Hồ Chí Minh", "D": "C.Mác"}, "answer": "A"}, {"id": 72, "de": "1", "q": "Theo quan điểm của Chủ nghĩa Mác - Lênin: Phương thức tồn tại của mọi dạng vật chất là...", "options": {"A": "không gian", "B": "không gian và thời gian", "C": "thời gian", "D": "vận động"}, "answer": "D"}, {"id": 73, "de": "1", "q": "Phạm trù nào thể hiện mối quan hệ giữa con người và tự nhiên trong quá trình sản xuất?", "options": {"A": "Phương thức sản xuất", "B": "Quan hệ sản xuất", "C": "Lực lượng sản xuất", "D": "Tư liệu sản xuất"}, "answer": "C"}, {"id": 74, "de": "1", "q": "Nhân tố quyết định sự tồn tại của xã hội là gì?", "options": {"A": "Sản xuất tinh thần", "B": "Sản xuất ra bản thân con người", "C": "Sản xuất vật chất", "D": "Tái sản xuất vật chất"}, "answer": "C"}, {"id": 75, "de": "1", "q": "Quan hệ sản xuất sẽ thúc đẩy sự phát triển của lực lượng sản xuất khi:", "options": {"A": "Quan hệ sản xuất phù hợp với trình độ phát triển của lực lượng sản xuất", "B": "Quan hệ sản xuất lạc hậu hơn so với lực lượng sản xuất", "C": "Quan hệ sản xuất tiến bộ hơn so với lực lượng sản xuất", "D": "Khi đó là quan hệ sản xuất ưu việt"}, "answer": "A"}, {"id": 76, "de": "1", "q": "Yếu tố nào quyết định sự tồn tại và phát triển của xã hội", "options": {"A": "sản xuất vật chất", "B": "sản xuất tinh thần", "C": "tái sản xuất ra con người", "D": "tái sản xuất vật chất"}, "answer": "A"}, {"id": 77, "de": "1", "q": "Theo quan điểm của chủ nghĩa Mác - Lênin, mọi xung đột trong lịch sử phát triển của xã hội loài người xét đến cùng đều bắt nguồn từ mâu thuẫn nào?", "options": {"A": "Mâu thuẫn về lợi ích giữa những tập đoàn người, giữa các cá nhân", "B": "Mâu thuẫn giữa lực lượng sản xuất và quan hệ sản xuất", "C": "Mâu thuẫn về hệ tư tưởng", "D": "Mâu thuẫn giai cấp"}, "answer": "B"}, {"id": 78, "de": "1", "q": "Theo Ph. Ănghen, có những hình thức vận động cơ bản nào của vật chất?", "options": {"A": "Vận động cơ học và vận động hóa học", "B": "Vận động cơ học, vận động hóa hóa, vận động lý học, vận động sinh học, vận động xã hội", "C": "Vận động xã hội", "D": "Vận động cơ học, vận động hóa hóa, vận động lý học, vận động sinh học"}, "answer": "B"}, {"id": 79, "de": "1", "q": "Theo quan điểm của chủ nghĩa Mác- Lênin, nhận định nào sau đây là đúng?", "options": {"A": "Chủ nghĩa xã hội là giai đoạn cao của Chủ nghĩa cộng sản.", "B": "Chủ nghĩa xã hội là thời kỳ quá độ từ xã hội chủ nghĩa lên chủ nghĩa tư bản.", "C": "Chủ nghĩa xã hội là giai đoạn thấp của Chủ nghĩa cộng sản.", "D": "Tất cả các đáp án của câu này đều sai"}, "answer": "C"}, {"id": 80, "de": "1", "q": "Chọn đáp án đúng nhất?", "options": {"A": "Hàng hóa là sản phẩm của lao động để thỏa mãn nhu cầu của con người", "B": "Hàng hóa là sản phẩm được bán trên thị trường", "C": "Hàng hóa là sản phẩm để trao đổi mua bán với người khác", "D": "Hàng hóa là sản phẩm của lao động, có thể thỏa mãn nhu cầu nào đó của con người thông qua trao đổi, mua bán"}, "answer": "D"}, {"id": 81, "de": "1", "q": "Chọn đáp án đúng điền vào chỗ trống: Người lao động được tự do về thân thể và không có tư liệu sản xuất, phải bán sức lao động và làm thuê cho nhà tư bản là điều kiện để …...", "options": {"A": "Sản xuất hàng hóa ra đời.", "B": "Sức lao động trở thành hàng hóa.", "C": "Sản phẩm trở thành hàng hóa", "D": "Tất cả các đáp án của câu này đều sai"}, "answer": "B"}, {"id": 82, "de": "1", "q": "Chủ nghĩa Mác - Lênin có những bộ phận cấu thành nào?", "options": {"A": "Triết học Mác – Lênin, Kinh tế chính trị Mác – Lênin và Chủ nghĩa xã hội khoa học", "B": "Triết học Mác – Lênin", "C": "Triết học Mác – Lênin và Kinh tế chính trị Mác – Lênin", "D": "Kinh tế chính trị Mác – Lênin và Chủ nghĩa xã hội khoa học."}, "answer": "A"}, {"id": 83, "de": "1", "q": "Quy luật nào vạch ra khuynh hướng vận động, phát triển của sự vật, hiện tượng?", "options": {"A": "Quy luật thống nhất và đấu tranh của các mặt đối lập (quy luật mâu thuẫn).", "B": "Quy luật chuyển hóa từ sự thay đổi về lượng thành những sự thay đổi về chất và ngược lại (quy luật lượng - chất).", "C": "Quy luật phủ định của phủ định.", "D": "Quy luật về sự phù hợp của quan hệ sản xuất với trình độ phát triển của lực lượng sản xuất."}, "answer": "C"}, {"id": 84, "de": "1", "q": "Theo quan điểm của chủ nghĩa Mác - Lênin, động lực chủ yếu của tiến bộ xã hội là:", "options": {"A": "Sự phát triển của hoạt động nghiên cứu khoa học, cải tiến kỹ thuật", "B": "Sự phát triển của lực lượng sản xuất", "C": "Sự phát triển của đời sống người lao động", "D": "Sự phát triển của các quan hệ quốc tế và hợp tác quốc tế"}, "answer": "B"}, {"id": 85, "de": "1", "q": "Sự kiện nào mở ra thời kỳ mới của lịch sử nhân loại, thời kỳ quá độ từ chủ nghĩa tư bản lên chủ nghĩa xã hội trên toàn thế giới, hiện thực hóa lý luận về chủ nghĩa xã hội?", "options": {"A": "Cách mạng tháng 10 Nga 1917", "B": "Cách mạng tháng 8 năm 1945", "C": "Tuyên ngôn đảng cộng sản năm 1848", "D": "Chiến tranh thế giới thứ II kết thúc năm 1945"}, "answer": "A"}, {"id": 86, "de": "1", "q": "Chọn đáp án đúng điền vào chỗ trống: thuộc tính cơ bản nhất, chung nhất của các dạng vật chất là ....., không phụ thuộc vào cảm giác, ý thức của con người. Có thể hiểu mọi thứ ...... đều là vật chất.", "options": {"A": "Vận động.", "B": "Tồn tại khách quan.", "C": "Mối liên hệ", "D": "Phát triển"}, "answer": "B"}, {"id": 87, "de": "1", "q": "Theo chủ nghĩa duy vật biện chứng: \" ...... là một phương thức tồn tại của vật chất, bao gồm tất cả mọi sự thay đổi và mọi quá trình diễn ra trong vũ trụ kể từ sự thay đổi vị trí đơn giản cho đến tư duy\"", "options": {"A": "Liên hệ", "B": "Đứng im", "C": "Phát triển", "D": "Vận động"}, "answer": "D"}, {"id": 88, "de": "1", "q": "Theo quan điểm của chủ nghĩa Mác- Lênin: Quan hệ sản xuất bao gồm:", "options": {"A": "Quan hệ sở hữu của người lao động đối với tư liệu sản xuất", "B": "Quan hệ của họ trong quá trình tổ chức, quản lý và phân công lao động.", "C": "Quan hệ của họ trong phân phối sản phẩm lao động", "D": "Tất cả các đáp án đều đúng"}, "answer": "D"}, {"id": 89, "de": "1", "q": "Theo quan điểm của chủ nghĩa Mác- Lênin, giai cấp công nhân là giai cấp tiên tiến vì:", "options": {"A": "Giai cấp công nhân đại biểu cho phương thức sản xuất hiện đại nhất, gắn với khoa học và công nghệ tiên tiến - xu hướng của xã hội tương lai.", "B": "Giai cấp công nhân có tinh thần cách mạng triệt để", "C": "Giai cấp công nhân có tinh thần quốc tế vô sản", "D": "Giai cấp công nhân lao động trong hệ thống sản xuất có tính chất dây chuyền với yêu cầu nghiêm ngặt về kỷ luật lao động."}, "answer": "A"}, {"id": 90, "de": "1", "q": "Hoạt động nào của con người được coi là cơ bản nhất và là cơ sở của đời sống xã hội?", "options": {"A": "Hoạt động chính trị.", "B": "Hoạt động khoa học chất.", "C": "Hoạt động sản xuất của cải vật chất.", "D": "Hoạt động nghệ thuật, thể thao."}, "answer": "C"}, {"id": 91, "de": "1", "q": "Trong tư liệu sản xuất, bộ phận nào quyết định đến năng suất lao động của con người trong quá trình sản xuất:", "options": {"A": "Công cụ lao động", "B": "Nguyên vật liệu cho quá trình sản xuất", "C": "Kết cấu hạ tầng của sản xuất", "D": "Các vật dụng chứa đựng, bảo quản hàng hóa"}, "answer": "A"}, {"id": 92, "de": "1", "q": "\" Những thời đại kinh tế khác nhau không phải ở chỗ chúng sản xuất ra cái gì, mà ở chỗ chúng sản xuất bằng cách nào, với những tư liệu lao động nào\". Câu nói trên của ai?", "options": {"A": "Smith", "B": "Ricardo", "C": "Mác", "D": "Ăngghen"}, "answer": "C"}, {"id": 93, "de": "2", "q": "Hồ Chí Minh viết Nhật ký trong tù vào thời gian nào?", "options": {"A": "1931-1933", "B": "1940-1941", "C": "1942-1943", "D": "1944-1945"}, "answer": "C"}, {"id": 94, "de": "2", "q": "Mối quan hệ giữa \"đức\" và \"tài\" trong tư tưởng Hồ Chí Minh là:", "options": {"A": "Đạo đức cùng với tài năng đều quan trọng, nhưng đạo đức giữ vai trò là cái gốc của người cách mạng", "B": "Đạo đức cùng với tài năng đều quan trọng, nhưng tài giữ vai trò là cái gốc của người cách mạng", "C": "Đức là nền tảng của tài còn tài là thể hiện của đức", "D": "Đức là điểm chính của tài"}, "answer": "A"}, {"id": 95, "de": "2", "q": "Tư tưởng “hiếu với dân” của Hồ Chí Minh được hiểu là:", "options": {"A": "Thương dân", "B": "Gần dân", "C": "Phục vụ nhân dân hết lòng", "D": "Tất cả đều đúng"}, "answer": "D"}, {"id": 96, "de": "2", "q": "Chọn đáp án đúng nhất: Mục đích của tư tưởng Hồ Chí Minh là:", "options": {"A": "Giải phóng dân tộc", "B": "Giải phóng giai cấp ở các nước thuộc địa", "C": "Giải phóng dân tộc, giải phóng giai cấp và giải phóng con người", "D": "Giải phóng giai cấp và giải phóng con người"}, "answer": "C"}, {"id": 97, "de": "2", "q": "Trong các quan điểm sau về đoàn kết, quan điểm nào không phải là của Chủ tịch Hồ Chí Minh?", "options": {"A": "\"Đoàn kết là sức mạnh, đoàn kết là thắng lợi\"", "B": "\"Đoàn kết là then chốt của thành công\"", "C": "\"Không có giai cấp trong cùng dòng máu đỏ, trong cùng một nước mắt từ mắt\"", "D": "\"Đoàn kết là điểm mẹ, điểm này mà thực hiện tốt đẻ ra con cháu đều tốt\""}, "answer": "C"}, {"id": 98, "de": "2", "q": "Trong các nguồn gốc hình thành tư tưởng Hồ Chí Minh, nguồn gốc nào giữ vai trò quyết định nhất đến việc hình thành và phát triển tư tưởng của Người?", "options": {"A": "Nguồn gốc thực tiễn", "B": "Nhân tố chủ quan Hồ Chí Minh", "C": "Chủ nghĩa Mác- Lênin", "D": "Truyền thống dân tộc"}, "answer": "C"}, {"id": 99, "de": "2", "q": "Trong quá trình hình thành tư tưởng Hồ Chí Minh, thời kỳ nào có tính chất quyết định bước ngoặt trong quá trình tìm đường cứu nước của Người?", "options": {"A": "Thời kỳ 1890 - 1911", "B": "Thời kỳ từ 1911 - 1920", "C": "Thời kỳ từ 1921 - 1930\nB. Thời kỳ 1930 – 1941"}, "answer": "B"}, {"id": 100, "de": "2", "q": "Chủ tịch Hồ Chí Minh sinh ra tại đâu?", "options": {"A": "Làng Kim Liên, xã Kim Liên, huyện Nam Đàn, tỉnh Nghệ An", "B": "Làng Sen, xã Kim Liên, huyện Nam Đàn, tỉnh Nghệ An", "C": "Làng Hoàng Trù, xã Kim Liên, huyện Nam Đàn, tỉnh Nghệ An", "D": "Làng Sen, xã Hoàng Trù, huyện Nam Đàn, tỉnh Nghệ An"}, "answer": "C"}, {"id": 101, "de": "2", "q": "Phong cách tư duy Hồ Chí Minh bao gồm:", "options": {"A": "Phong cách tư duy khoa học, cách mạng và hiện đại", "B": "Phong cách tư duy, độc lập, tự chủ, sáng tạo", "C": "Phong cách tư duy hài hòa, uyển chuyển, có lý có tình", "D": "Tất cả các đáp án của câu này đều đúng"}, "answer": "D"}, {"id": 102, "de": "2", "q": "Theo quan điểm của Hồ Chí Minh, trong quan hệ với quần chúng, cán bộ, đảng viên phải:", "options": {"A": "Theo đuôi quần chúng", "B": "Phục tùng mọi lợi ích chính đáng của nhân dân", "C": "Luôn luôn nghe theo quần chúng", "D": "Tất cả các đáp án của câu này đều sai"}, "answer": "B"}, {"id": 103, "de": "2", "q": ": Điền vào chỗ trống để hoàn chỉnh câu sau: “Dân tộc ta, nhân dân ta, non sông đất nước ta đã sinh ra Hồ Chủ tịch, người ……………….. vĩ đại, và chính Người đã làm rạng rỡ dân tộc ta, nhân dân ta và non sông đất nước ta.”", "options": {"A": "Thầy", "B": "Anh hùng dân tộc", "C": "Danh nhân văn hoá thế giới", "D": "Lãnh tụ"}, "answer": "B"}, {"id": 104, "de": "2", "q": "Theo Hồ Chí Minh, học chủ nghĩa Mác - Lênin để làm gì?", "options": {"A": "Để sống với nhau có tình, có nghĩa.", "B": "Để chứng tỏ trình độ lý luận.", "C": "Học thuộc các luận điểm lý luận.", "D": "Tất cả các đáp án của câu này đều sai"}, "answer": "A"}, {"id": 105, "de": "2", "q": "Theo Hồ Chí Minh, tinh thần quốc tế trong sáng là phẩm chất bắt nguồn từ bản chất của giai cấp nào?", "options": {"A": "Công nhân", "B": "Nông dân", "C": "Địa chủ", "D": "Tư sản"}, "answer": "A"}, {"id": 106, "de": "2", "q": "Tại sao phải học tập và làm theo tư tưởng, đạo đức, phong cách Hồ Chí Minh?", "options": {"A": "Xuất phát từ vai trò quan trọng và to lớn của đạo đức", "B": "Thực trạng đạo đức hiện nay đòi hỏi “nhân cái đẹp, dẹp cái xấu”", "C": "Hồ Chí Minh là tấm gương đạo đức mẫu mực, sáng người, tiêu biểu nhất cho truyền thống đạo đức của dân tộc Việt Nam", "D": "Tất cả các đáp án đều đúng"}, "answer": "D"}, {"id": 107, "de": "2", "q": "Trong các nguồn gốc hình thành tư tưởng Hồ Chí Minh, nguồn gốc nào giữ vai trò quyết định đến bản chất tư tưởng Hồ Chí Minh?", "options": {"A": "Tinh hoa văn hóa nhân loại", "B": "Chủ nghĩa Mác- Lênin", "C": "Giá trị truyền thống dân tộc", "D": "Tất cả các đáp án đều đúng"}, "answer": "B"}, {"id": 108, "de": "2", "q": "“Tự do cho đồng bào tôi, độc lập cho Tổ quốc tôi, đấy là tất cả những điều tôi muốn\". Câu nói trên của ai?", "options": {"A": "Võ Nguyên Giáp", "B": "Hồ Chí Minh", "C": "Phạm Văn Đồng", "D": "Trần Phú"}, "answer": "B"}, {"id": 109, "de": "2", "q": "Theo tư tưởng Hồ Chí Minh, khát vọng lớn nhất của các dân tộc thuộc địa là gì?", "options": {"A": "Độc lập dân tộc", "B": "Dân tự do", "C": "Dân làm chủ", "D": "Đi lên Chủ nghĩa xã hội"}, "answer": "A"}, {"id": 110, "de": "2", "q": "Luận điểm “Đạo đức cách mạng không phải ở trên trời sa xuống. Nó do đấu tranh, rèn luyện bền bỉ hàng ngày mà phát triển và củng cố, cũng như ngọc càng mài càng sáng, vàng càng luyện càng trong” là của ai?", "options": {"A": "Lê Duẩn", "B": "Võ Nguyên Giáp", "C": "Hồ Chí Minh", "D": "V.L.Lênin"}, "answer": "C"}, {"id": 111, "de": "2", "q": "Chọn cụm từ điền vào chỗ trống đúng với tư tưởng Hồ Chí Minh: Bồi dưỡng thế hệ cách mạng cho đời sau là một việc …... và rất cần thiết.", "options": {"A": "Không thể thiếu", "B": "Quan trọng", "C": "Rất quan trọng", "D": "Nên làm"}, "answer": "C"}, {"id": 112, "de": "2", "q": "Trong các thời kỳ hình thành tư tưởng Hồ Chí Minh, thời kỳ nào tư tưởng Hồ Chí Minh phát triển hoàn thiện về những vấn đề cơ bản của cách mạng Việt Nam?", "options": {"A": "1911 – 1920", "B": "1921 - 1930", "C": "1930 – 1945", "D": "1941-1969"}, "answer": "D"}, {"id": 113, "de": "2", "q": "Chọn đáp án đúng điền vào chỗ trống. Độc lập dân tộc gắn liền với chủ nghĩa xã hội là nội dung ……... toàn bộ tư tưởng Hồ Chí Minh.", "options": {"A": "Cốt lõi", "B": "Xuyên suốt", "C": "Quan trọng và xuyên suốt", "D": "Cốt lõi xuyên suốt"}, "answer": "B"}, {"id": 114, "de": "2", "q": "Chọn đáp án đúng vào chổ trống. Theo quan điểm của Hồ Chí Minh: Đoàn kết là mục tiêu là nhiệm vụ hàng đầu của cách mạng và của dân tộc, là vấn đề có tính ……..", "options": {"A": "Lâu dài", "B": "Quan trọng", "C": "Chiến lược", "D": "Sách lược"}, "answer": "C"}, {"id": 115, "de": "2", "q": "Theo tư tưởng Hồ Chí Minh thì người cách mạng cần phải có đủ các chuẩn mực đạo đức nào?", "options": {"A": "Trung với nước, hiếu với dân. Yêu thương con người", "B": "Cần, kiệm, liêm, chính, chí công vô tư", "C": "Tinh thần quốc tế trong sáng", "D": "Trung với nước, hiếu với dân. Cần, kiệm, liêm, chính, chí công vô tư. Yêu thương con người. Tinh thần quốc tế trong sáng"}, "answer": "D"}, {"id": 116, "de": "2", "q": "Chủ tịch Hồ Chí Minh đã nêu ra những nguyên tắc cơ bản nào để rèn luyện đạo đức của mỗi người cách mạng?", "options": {"A": "Nói đi đôi với làm, phải nêu gương về đạo đức", "B": "Xây đi đôi với chống", "C": "Phải tu dưỡng đạo đức suốt đời", "D": "Tất cả đáp án đều đúng"}, "answer": "D"}, {"id": 117, "de": "2", "q": "Theo Hồ Chí Minh, cách mạng giải phóng dân tộc là sự nghiệp đoàn kết của:", "options": {"A": "Giai cấp công nhân với giai cấp nông dân", "B": "Giai cấp nông dân với tầng lớp trí thức", "C": "Giai cấp công nhân với tầng lớp trí thức", "D": "Toàn dân trên cơ sở liên minh của giai cấp công nhân với giai cấp nông dân và trí thức"}, "answer": "D"}, {"id": 118, "de": "2", "q": "Tập thơ\" Nhật ký trong tù\" của Hồ Chí Minh được dịch ra tiếng việt vào năm nào?", "options": {"A": "Năm 1960", "B": "Năm 1962", "C": "Năm 1964", "D": "Năm 1965"}, "answer": "A"}, {"id": 119, "de": "2", "q": "Nội dung cốt lõi xuyên suốt toàn bộ trong tư tưởng Hồ Chí Minh là:", "options": {"A": "Đại đoàn kết dân tộc và đoàn kết quốc tế", "B": "Tư tưởng về nhà nước của dân, do dân, vì dân", "C": "Độc lập dân tộc gắn liền với chủ nghĩa xã hội", "D": "Chủ nghĩa yêu nước"}, "answer": "C"}, {"id": 120, "de": "2", "q": "Chọn cụm từ thích hợp diền vào chỗ trống: \"Độc lập dân tộc gắn liền với...... là nội dung cốt lõi xuyên suốt toàn bộ tư tưởng Hồ Chí Minh, được thống nhất trong cả hoạt động lý luận và thực tiễn, phản ảnh chính xác mục đích, lý tưởng, khát vọng của Người\"", "options": {"A": "Con đường cách mạng", "B": "Chủ nghĩa xã hội", "C": "Ấm no hạnh phúc", "D": "Đoàn kết yêu thương"}, "answer": "B"}, {"id": 121, "de": "2", "q": "Chủ tịch Hồ Chí Minh suốt đời phấn đấu cho độc lập dân tộc và hạnh phúc của nhân dân. Chính vì vậy, Người đề cao việc phải lấy phát triển kinh tế và văn hóa, từ đó nâng cao......", "options": {"A": "Ý thức trong nhân dân", "B": "Đời sống văn hóa của dân", "C": "Tinh thần của nhân dân", "D": "Đời sống vật chất và tinh thần của nhân dân"}, "answer": "D"}, {"id": 122, "de": "2", "q": "Tổ chức Chính trị, xã hội nào vừa là thành viên vừa là lực lượng lãnh đạo Mặt trận dân tộc thống nhất ở nước ta?", "options": {"A": "Nhà nước", "B": "Mặt Trận Tổ quốc Việt Nam", "C": "Đoàn Thanh niên", "D": "Đảng cộng sản Việt Nam"}, "answer": "D"}, {"id": 123, "de": "2", "q": "Theo Hồ Chí Minh, trong nội dung chuẩn mực đạo đức của người cách mạng có nhiều phẩm chất khác nhau. Em hãy xác định phẩm chất nào sau đây bắt nguồn từ bản chất của giai cấp công nhân?", "options": {"A": "Trung với nước, hiếu với dân", "B": "Cần, kiệm, liêm, chính, chí công vô tư", "C": "Yêu thương con người", "D": "Tinh thần quốc tế trong sáng"}, "answer": "D"}, {"id": 124, "de": "2", "q": "Theo Hồ Chí Minh: Xây dựng và phát triển văn hóa là sự nghiệp của ai?", "options": {"A": "Toàn Đảng", "B": "Toàn dân", "C": "Toàn quốc", "D": "Toàn nhân loại"}, "answer": "B"}, {"id": 125, "de": "2", "q": "Trong thời gian ở nước ngoài, Nguyễn Tất Thành đã làm những công việc gì?", "options": {"A": "Phụ bếp, cào tuyết", "B": "Đốt lò, bán báo", "C": "Thợ ảnh, làm bánh", "D": "Tất cả các đáp án đều đúng"}, "answer": "D"}, {"id": 126, "de": "2", "q": "Theo Hồ Chí Minh học để làm gì?", "options": {"A": "Làm việc", "B": "Làm người.", "C": "Làm cán bộ", "D": "Làm việc, làm người và làm cán bộ"}, "answer": "D"}, {"id": 127, "de": "2", "q": "Chọn cụm từ đúng điền vào chỗ trống cho đúng với quan điểm của Chủ tịch Hồ Chí Minh: \" Đảng cần phải có….thật tốt để phát triển kinh tế và văn hóa, không ngừng nâng cao đời sống vật chất và tinh thần của nhân dân\". Chọn cụm từ đúng điền vào chỗ trống", "options": {"A": "Chiến lược", "B": "Con người", "C": "Kế hoạch", "D": "Đường lối"}, "answer": "C"}, {"id": 128, "de": "2", "q": "Bài thơ \"Người đi tìm hình của nước\" viết về Hồ Chí Minh là của tác giả nào?", "options": {"A": "Huy Cận", "B": "Nguyễn Đình Thi", "C": "Chế Lan Viên", "D": "Tố Hữu"}, "answer": "C"}, {"id": 129, "de": "2", "q": "điền vào chỗ trống để hoàn thiện câu sau cho đúng với quan điểm của Chủ tịch Hồ Chí Minh : \"Cách mạng Việt Nam muốn thành công phải có...\"", "options": {"A": "Dân hạnh phúc", "B": "Dân tự do", "C": "Đảng cách mệnh", "D": "Sự phát triển toàn diện"}, "answer": "C"}, {"id": 130, "de": "2", "q": "Trong quan điểm của mình Hồ Chí Minh xem yếu tố nào là sức mạnh vô địch và vô tận làm nên mọi thắng lợi của cách mạng Việt Nam, tạo ra sức mạnh to lớn để có thể thắng được mọi kẻ thù hung ác nhất ?", "options": {"A": "Liên minh công nông, trí thức", "B": "Đoàn kết rộng rãi lực lượng toàn dân tộc dưới sự lãnh đạo của Đảng", "C": "Lực lượng vũ trang hiện đại", "D": "Sự ủng hộ của nhân dân thế giới"}, "answer": "B"}, {"id": 131, "de": "2", "q": "Tư tưởng nào được Đảng ta được xem là tài sản tinh thần vô cùng to lớn và quý giá của Đảng và dân tộc ta, mãi mãi soi đường cho sự nghiệp cách mạng của nhân dân ta giành thắng lợi.", "options": {"A": "Tư tưởng Hồ Chí Minh", "B": "Chủ nghĩa Mác-Lênin", "C": "Kinh nghiệm chống giặc ngoại xâm của cha ông ta", "D": "Cương lĩnh chính trị đầu tiên của Đảng ta"}, "answer": "A"}, {"id": 132, "de": "2", "q": "Theo Tư tưởng Hồ Chí Minh độc lập dân tộc phải gắn liền với ?", "options": {"A": "Chủ nghĩa xã hội", "B": "Hòa bình và phát triển", "C": "Đấu tranh chống giặc ngoại xâm", "D": "Tự cường của dân tộc"}, "answer": "A"}, {"id": 133, "de": "2", "q": "Điền vào chỗ trống để có nội dung đúng theo Di chúc của Chủ tịch Hồ Chí Minh: “Đảng cần phải có kế hoạch thật tốt để phát triển…….., nhằm không ngừng nâng cao đời sống của nhân dân ”", "options": {"A": "Kinh tế và chính trị", "B": "Kinh tế", "C": "Văn hóa", "D": "Kinh tế và văn hóa"}, "answer": "D"}, {"id": 134, "de": "2", "q": "Hồ Chí Minh quan niệm yếu tố nào là gốc của người cách mạng ?", "options": {"A": "Tài năng", "B": "Đạo đức", "C": "Học vấn", "D": "Chức vụ"}, "answer": "B"}, {"id": 135, "de": "2", "q": "Suốt đời đấu tranh cho cách mạng, ra sức làm việc, giữ vững kỉ luật thực hiện tốt đường lối chính sách của Đảng, tuyệt đối trung thành với sự nghiệp dựng nước và giữ nước, trung thành với con đường đi lên của đất nước. Đây là nội dung của chuẩn mực đạo đức nào trong tư tưởng Hồ Chí Minh ?", "options": {"A": "Trung với nước", "B": "Cần, kiệm, liêm, chính", "C": "Tinh thần quốc tế", "D": "ý chí kiên cường"}, "answer": "A"}, {"id": 136, "de": "2", "q": "Có tinh thần lao động sáng tạo, giữ kỷ luật, năng suất cao, có trách nhiệm và luôn tự lực cánh sinh là nội dung của chuẩn mực đạo đức nào trong tư tưởng Hồ Chí Minh ?", "options": {"A": "Chăm làm", "B": "Sáng tạo", "C": "Năng động", "D": "Cần"}, "answer": "D"}, {"id": 137, "de": "2", "q": "Một trong những nguyên tắc cơ bản để rèn luyện đạo đức của mỗi người theo Tư tưởng Hồ Chí Minh đó là ?", "options": {"A": "Phải có ý thức", "B": "Nói đi đôi với làm", "C": "Rèn kết hợp với luyện", "D": "Thường xuyên"}, "answer": "B"}, {"id": 138, "de": "2", "q": "Điền vào chỗ trống để có nội dung đúng với Tư tưởng Hồ Chí Minh: …….là người chủ tương lai của nước nhà, nước nhà thịnh hay suy, yếu hay mạnh một phần lớn là do…….", "options": {"A": "Nhân dân", "B": "Toàn dân", "C": "Thanh niên", "D": "Giai cấp công nhân"}, "answer": "C"}, {"id": 139, "de": "2", "q": "Nghị quyết Đại hội Đảng toàn quốc lần thứ XII chỉ ra rằng: Đây là việc làm tất yếu và cần thiết đối với mỗi tổ chức đảng, cơ quan, đơn vị, cán bộ, đảng viên, quần chúng, việc làm đó là việc gì ?", "options": {"A": "Toàn dân đoàn kết xây dựng đời sống văn hóa", "B": "Tiếp tục đẩy mạnh học tập và làm theo tư tưởng, đạo đức, phong cách Hồ Chí Minh", "C": "Kỷ niệm 90 năm Ngày thành lập Đảng Cộng sản Việt Nam", "D": "Phát động phong trào thi đua yêu nước năm 2020"}, "answer": "B"}, {"id": 140, "de": "2", "q": "\"Toàn Đảng, toàn dân ta đoàn kết, phấn đấu xây dựng một nước Việt Nam hòa bình, thống nhất, độc lập, dân chủ và giàu mạnh\". Đây là nội dung được Bác viết trong văn kiện nào?", "options": {"A": "Tuyên ngôn độc lập", "B": "Bài thơ chúc tết", "C": "Di chúc", "D": "Nhật ký trong tù"}, "answer": "C"}, {"id": 141, "de": "2", "q": "“Nước ta là nước dân chủ, bao nhiêu lợi ích đều vì dân; bao nhiêu quyền hạn đều của dân; công việc đổi mới, xây dựng là trách nhiệm của dân; sự nghiệp kháng chiến, kiến quốc là công việc của dân; chính quyền từ xã đến Chính phủ Trung ương do dân cử ra; đoàn thể từ Trung ương đến xã do dân tổ chức nên… \" câu nói này là của ai ?", "options": {"A": "Tổng bí thư Trường Chinh", "B": "Chủ tịch Hồ Chí Minh", "C": "Thủ tướng Phạm Văn Đồng", "D": "Chủ tịch Tôn Đức Thắng"}, "answer": "B"}, {"id": 142, "de": "2", "q": "Về cơ cấu kinh tế trong quá trình công nghiệp hóa, Chủ tịch Hồ Chí Minh chủ trương phát triển cả công nghiệp và nông nghiệp như thế nào?", "options": {"A": "Công nghiệp và nông nghiệp là như hai chân của nền kinh tế nước nhà. Chân phải thật vững thật khỏe, thì kinh tế mới tiến bộ thuận lợi và nhanh chóng”", "B": "Đảng cần phải có kế hoạch thật tốt để phát triển kinh tế và văn hóa, nhằm không ngừng nâng cao đời sống của nhân dân", "C": "Nền kinh tế XHCN phải tạo lập trên cơ sở chế độ sở hữu công cộng về tư liệu sản xuất", "D": "nhiệm vụ quan trọng nhất đó là phải phát triển kinh tế, xây dựng nền tảng vật chất, kỹ thuật của chủ nghĩa xã hội"}, "answer": "A"}, {"id": 143, "de": "2", "q": "“Tất cả các dân tộc trên thế giới đều sinh ra bình đẳng, dân tộc nào cũng có quyền sống, quyền sung sướng và quyền tự do”. Câu trên của ai?", "options": {"A": "Cụ Tôn Đức Thắng", "B": "Chủ tịch Hồ Chí Minh", "C": "Đai tướng Võ Nguyên Giáp", "D": "Thủ tướng Phạm Văn Đồng"}, "answer": "B"}, {"id": 144, "de": "2", "q": "“Tất cả các dân tộc trên thế giới đều sinh ra bình đẳng, dân tộc nào cũng có quyền sống, quyền sung sướng và quyền tự do”. Câu trên Hồ Chí Minh nói trong tác phẩm nào?", "options": {"A": "Tuyên Ngôn độc lập (1945)", "B": "Nhật ký trong tù (1942 -1943)", "C": "Bản yêu sách của dân tộc Việt Nam gửi đến Hội nghị Versailles” (1919)", "D": "Lời kêu gọi toàn quốc kháng chiến (1946)"}, "answer": "A"}, {"id": 145, "de": "2", "q": "Trong các chuẩn mực đạo đức của người cách mạng, chuẩn mực nào được Người xem là phẩm chất đạo đức cao đẹp nhất?", "options": {"A": "Trung với nước, hiếu với dân", "B": "Cần, kiệm, liêm, chính, chí công vô tư", "C": "Tinh thần quốc tế trong sáng", "D": "Yêu thương con người"}, "answer": "A"}, {"id": 146, "de": "2", "q": "“Đảng cần phải có kế hoạch thật tốt để phát triển kinh tế và văn hóa, nhằm không ngừng nâng cao đời sống của nhân dân ”. Câu nói trên của ai?", "options": {"A": "Tổng bí thư Nguyễn Phú Trọng", "B": "Chủ tịch Hồ Chí Minh", "C": "Đai tướng Võ Nguyên Giáp", "D": "Thủ tướng Phạm Văn Đồng"}, "answer": "B"}, {"id": 147, "de": "2", "q": "Chủ tịch Hồ Chí Minh quan niệm về vai trò của đạo đức là:", "options": {"A": "Cái gốc của người cách mạng", "B": "Nguồn nuôi dưỡng và phát triển con người", "C": "Nền tảng và là sức mạnh của người cách mạng", "D": "Tất cả các đáp án đều đúng"}, "answer": "D"}, {"id": 148, "de": "2", "q": "Điền vào chỗ trống cho đúng với câu nói của Chủ tịch Hồ Chí Minh “............... không phải trên trời sa xuống. Nó do đấu tranh, ............ hằng ngày mà phát triển và củng cố. Cũng như ngọc càng mài càng sáng, vàng càng luyện càng trong”.", "options": {"A": "Đạo đức, rèn luyện", "B": "Đạo đức cách mạng- rèn luyện bền bỉ", "C": "Đạo đức cách mạng - rèn luyện", "D": "Đạo đức người cán bộ - rèn luyện bền bỉ"}, "answer": "B"}, {"id": 149, "de": "2", "q": "Điền vào chỗ trống cho đúng với câu nói của Chủ tịch Hồ Chí Minh: “Tự do cho Đồng bào tôi, độc lập cho Tổ quốc tôi, đấy là tất cả những điều” .", "options": {"A": "tôi mong", "B": "tôi muốn", "C": "tôi nghĩ", "D": "tất cả đều đúng"}, "answer": "B"}, {"id": 150, "de": "2", "q": "Quan điểm nào sau đây của Chủ tịch Hồ Chí Minh thể hiện tư tưởng kiên định đường lối độc lập, tự chủ và tích cực, chủ động hội nhập quốc tế ?", "options": {"A": "“Nước ta là nước dân chủ. Bao nhiêu lợi ích đều vì dân.Bao nhiều quyền hạn đều của dân”", "B": "“Toàn Đảng, toàn dân ta đoàn kết, phấn đấu xây dựng một nước Việt Nam hòa bình, thống nhất, độc lập, dân chủ và giàu mạnh”", "C": "“Độc lập nghĩa là chúng tôi điều khiển lấy mọi công việc của chúng tôi, không có sự can thiệp ở ngoài vào”", "D": "“Mọi công việc đều vì lợi ích của dân mà làm\""}, "answer": "C"}, {"id": 151, "de": "2", "q": "Quan điểm nào sau đây về dân chủ được Chủ tịch Hồ Chí Minh phát triển trong thời đại mới?", "options": {"A": "“Nước ta là nước dân chủ. Bao nhiêu lợi ích đều vì dân.Bao nhiều quyền hạn đều của dân”", "B": "“Toàn Đảng, toàn dân ta đoàn kết, phấn đấu xây dựng một nước Việt Nam hòa bình, thống nhất, độc lập, dân chủ và giàu mạnh”", "C": "“Độc lập nghĩa là chúng tôi điều khiển lấy mọi công việc của chúng tôi, không có sự can thiệp ở ngoài vào”", "D": "“Mọi công việc đều vì lợi ích của dân mà làm\""}, "answer": "A"}, {"id": 152, "de": "2", "q": "Nguyễn Ái Quốc đọc “Sơ thảo lần thứ nhất Luận cương về vấn đề dân tộc và vấn đề thuộc địa” của ai? Vào thời gian nào?", "options": {"A": "Mác, 7/1920", "B": "Lênin, 7/1920", "C": "Ăngghen, 7/1920", "D": "Tất cả câu trả lời đều đúng"}, "answer": "B"}, {"id": 153, "de": "2", "q": "Trong các thời kỳ hình thành tư tưởng Hồ Chí Minh, thời kỳ nào hình thành tư tưởng yêu nước và chí hướng cứu nước của Hồ Chí Minh?", "options": {"A": "Thời kỳ trước năm 1911", "B": "Thời kỳ từ 1911 - 1920", "C": "Thời kỳ từ 1921 - 1930", "D": "Thời kỳ 1930 – 1945"}, "answer": "A"}, {"id": 154, "de": "2", "q": "Chỉ thị số 05- CT/TW về “Đẩy mạnh học tập và làm theo tư tưởng, đạo đức, phong\ncách Hồ Chí Minh” được Đảng ta ban hành vào ngày, tháng, năm nào?", "options": {"A": "Ngày 15- 5- 2014", "B": "Ngày 15- 5- 2015", "C": "Ngày 15- 5- 2016", "D": "Ngày 15- 5- 2017"}, "answer": "C"}, {"id": 155, "de": "2", "q": "Theo Hồ Chí Minh, vốn quý nhất, nhân tố quyết định sự thành công của sự nghiệp cách mạng:", "options": {"A": "chính trị", "B": "Khoa học kỹ thuật", "C": "Con người", "D": "Sự giúp đỡ, ủng hộ quốc tế"}, "answer": "C"}, {"id": 156, "de": "2", "q": "Tư tưởng HCM có vai trò như thế nào trong hệ thống tư tưởng ĐCSVN?", "options": {"A": "Là bộ phận nền tảng, kim chỉ nam cho hành động của Đảng", "B": "Là bộ phận rất quan trọng trong hệ thống tư tưởng của Đảng", "C": "Là bộ phận trong hệ thống tư tưởng của Đảng", "D": "Là bộ phận quan trọng trong hệ thống tư tưởng của Đảng"}, "answer": "A"}, {"id": 157, "de": "2", "q": "Theo tư tưởng Hồ Chí Minh, yếu tố nào của chủ nghĩa xã hội có sức hấp dẫn đặc biệt?", "options": {"A": "Đời sống vật chất ổn định", "B": "Đời sống văn hóa phong phú", "C": "Những giá trị đạo đức cao đẹp", "D": "Lý tưởng tự do, dân chủ"}, "answer": "C"}, {"id": 158, "de": "2", "q": "“Chiến tranh có thể kéo dài 5 năm, 10 năm hoặc lâu hơn nữa … Song nhân dân Việt Nam quyết không sợ. Không có gì quý hơn độc lập, tự do. Đến ngày thắng lợi, nhân dân ta sẽ xây dựng đất nước ta đàng hoàng hơn, to đẹp hơn”. Câu trên được trích từ tác phẩm nào của chủ tịch Hồ Chí Minh?", "options": {"A": "Lời kêu gọi ngày 19-12-1946", "B": "Lời kêu gọi ngày 17-7-1966", "C": "Thơ chúc Tết năm 1966", "D": "Di chúc 1969"}, "answer": "B"}, {"id": 159, "de": "2", "q": "Theo tư tưởng Hồ Chí Minh, lực lượng giải phóng dân tộc gồm:", "options": {"A": "Công nhân, nông dân", "B": "Công nhân, nông dân, trí thức", "C": "Toàn dân tộc", "D": "Công nhân, tiểu tư sản"}, "answer": "C"}, {"id": 160, "de": "2", "q": "Theo tư tưởng Hồ Chí Minh, nhiệm vụ của thế hệ trẻ là:", "options": {"A": "Tự phấn đấu học tập và rèn luyện để có tri thức", "B": "Có ý trí, nghị lực và tinh thần cách mạng", "C": "Noi gương những người đi trước", "D": "Tất cả các đáp án đều đúng"}, "answer": "D"}, {"id": 161, "de": "2", "q": "Theo quan điểm của Hồ Chí Minh, đạo đức phải luôn đặt cạnh yếu tố nào?", "options": {"A": "Tài năng", "B": "Ý chí", "C": "Bản lĩnh", "D": "Tất cả các đáp án của câu này đều đúng."}, "answer": "A"}, {"id": 162, "de": "2", "q": "Câu nói:“Mốn cứu nước và giải phóng dân tộc, không có con đường nào khác ngoài con đường cách mạng vô sản” là của ai?", "options": {"A": "V.I Lênin", "B": "Ph. Ănghen", "D": "Mác", "E": "Nguyễn Ái Quốc"}, "answer": "E"}, {"id": 163, "de": "2", "q": "Theo quan điểm của Hồ Chí Minh, đạo đức giữ vai trò như thế nào đối với người cách mạng?", "options": {"A": "Cái gốc", "B": "Cái ngọn", "C": "Then chốt", "D": "Hạt nhân"}, "answer": "A"}, {"id": 164, "de": "2", "q": "Quan điểm: \"Độc lập dân tộc gắn liền với chủ nghĩa xã hội\" là nội dung cốt lõi xuyên suốt toàn bộ tư tưởng của ai?", "options": {"A": "V.I. Lênin", "B": "Hồ Chí Minh", "C": "Đặng Tiểu Bình", "D": "Phạm Văn Đồng"}, "answer": "B"}, {"id": 165, "de": "2", "q": "Câu nói: “Tất cả các dân tộc trên thế giới đều sinh ra bình đẳng, dân tộc nào cũng có quyền sống, quyền sung sướng và quyền tự do”. được Hồ Chí Minh viết trong tác phẩm nào?", "options": {"A": "Tuyên ngôn độc lập năm 1945", "B": "Đường cách mạng năm 1927", "C": "Bản án chế độ thực dân Pháp năm 1925", "D": "Lời kêu gọi toàn quốc kháng chiến năm 1946"}, "answer": "A"}, {"id": 166, "de": "2", "q": "“Yêu tổ quốc, yêu nhân dân phải gắn liền với yêu………………., vì có tiến lên………thì dân mình mới mỗi ngày một ấm no thêm, Tổ quốc mới ngày một giàu mạnh thêm.” Điền vào chỗ trống để hoàn chỉnh câu nói của Bác.", "options": {"A": "Chủ nghĩa xã hội", "B": "Thương yêu con người", "C": "Lao động", "D": "Độc lập, tự do của đất nước."}, "answer": "A"}, {"id": 167, "de": "2", "q": "Điền vào chỗ trống: ……. mở ra con đường giải phóng dân tộc và cả loài người, mở đầu một thời đại mới trong lịch sử", "options": {"A": "Cách mạng tháng Mười", "B": "Cách mạng Tân hợi", "C": "Cách mạng tháng Tám", "D": "Cách mạng tư sản Pháp"}, "answer": "A"}, {"id": 168, "de": "2", "q": "Câu nói sau của ai: “Các vua Hùng đã có công dựng nước, Bác cháu ta phải cùng nhau giữ lấy nước", "options": {"A": "Hồ Chí Minh", "B": "Võ Nguyên Giáp", "C": "Phạm Văn Đồng", "D": "Lê nin"}, "answer": "A"}, {"id": 169, "de": "2", "q": "Điền từ vào chỗ trống: “Chủ trương làm tư sản dân quyền cách mạng và thổ địa cách mạng để đi tới………..”", "options": {"A": "Chủ nghĩa tư bản", "B": "xã hội cộng sản", "C": "Chủ nghĩa xã hội", "D": "Quá độ lên CNXH"}, "answer": "B"}, {"id": 170, "de": "2", "q": "Những tiền đề tư tưởng – lý luận hình thành tư tưởng HCM", "options": {"A": "Truyền thống gia đình", "B": "Tinh hoa văn hóa nhân loại", "C": "Chủ nghĩa Mác – Lê nin", "D": "Tất cả đều đúng"}, "answer": "D"}, {"id": 171, "de": "2", "q": "Để thay thế chế độ thực dân phong kiến tàn bạo, phản nhân tính, Hồ Chí Minh đã lựa chọn ra một kiểu nhà nước mới cho Việt Nam, đó là .........................., một nhà nước đại biểu quyền lợi “cho số đông người”, thể hiện tính chất nhân dân, một nhà nước do nhân dân lao động làm chủ, nhà nước của dân, do dân, vì dân.", "options": {"A": "Nhà nước dân chủ cộng hòa", "B": "Nhà nước dân chủ", "C": "Nhà nước độc lập", "D": "Nhà nước VN"}, "answer": "A"}, {"id": 172, "de": "2", "q": "nhà nước ta mang bản chất của giai cấp nào?", "options": {"A": "Công nhân", "B": "Nông dân", "C": "Tư sản", "D": "Địa chủ"}, "answer": "A"}, {"id": 173, "de": "2", "q": "Đoàn kết là sức mạnh, là ......của thành công", "options": {"A": "Then chốt", "B": "Cội nguồn", "C": "Cốt lõi", "D": "Tất cả đều đúng"}, "answer": "A"}, {"id": 174, "de": "2", "q": "Phát triển kinh tế là .............., là cơ sở cho sự phát triển văn hóa, xóa bỏ nghèo nàn và lác hậu", "options": {"A": "Nguồn lực", "B": "Mục tiêu", "C": "Tiền đề", "D": "Nguồn gốc"}, "answer": "C"}, {"id": 175, "de": "2", "q": "Đoàn kết toàn dân phải dựa trên cơ sở nào:", "options": {"A": "Tương đồng về lợi ích", "B": "Đề cao tinh thần dân tọc", "C": "Khoan dung", "D": "Tin vào nhân dân"}, "answer": "A"}, {"id": 176, "de": "2", "q": "Văn hóa nghệ thuật cũng là một ……………. Anh chị em là chiến sĩ trên mặt trận ấy”", "options": {"A": "mặt trận", "B": "Sự nghiệp", "C": "Chiến trường", "D": "Động lực"}, "answer": "A"}, {"id": 177, "de": "2", "q": "Theo HCM, đã là người thì ai cũng có", "options": {"A": "Chỗ tốt, chỗ xấu", "B": "Chỗ hay, chỗ dở", "C": "Thiện, ác", "D": "Tất cả đều đúng"}, "answer": "D"}, {"id": 178, "de": "2", "q": "dân chủ đích thực bao giờ cũng đi liền với:", "options": {"A": "Quyền con người", "B": "Thực thi Hiến pháp và pháp luật", "C": "Quyền công dân", "D": "Tất cả đều đúng"}, "answer": "B"}, {"id": 179, "de": "2", "q": "Điền vào chỗ trống cho đúng với câu nói của Chủ tịch Hồ Chí Minh: “Tự do cho ……………….., độc lập cho Tổ quốc tôi, đấy là tất cả những điều tôi muốn” .", "options": {"A": "Đồng bào tôi", "B": "Nhân dân tôi", "C": "Đất nước tôi", "D": "Dân tộc tôi"}, "answer": "A"}, {"id": 180, "de": "2", "q": "Học thuyết về nhà nước pháp quyền được các nhà tư sản nâng lên thành học thuyết vào thời gian nào", "options": {"A": "Thế kỷ 15", "B": "Thế kỷ 16", "C": "Thế kỷ 17", "D": "Thế kỷ 18"}, "answer": "D"}, {"id": 181, "de": "3", "q": "Điền vào chỗ trống: Chủ nghĩa Mác – Lênin khẳng định, đại đoàn kết dân tộc là nội dung, là nhiệm vụ chiến lược của.....", "options": {"A": "nhân dân", "B": "cách mạng", "C": "toàn dân", "D": "Đảng"}, "answer": "B"}, {"id": 182, "de": "3", "q": "Văn kiện Đại hội lần thứ XIII của Đảng (1-2021) đã chỉ ra mấy phương hướng lớn để phát huy sức mạnh toàn dân tộc?", "options": {"A": "5", "B": "6", "C": "7", "D": "8"}, "answer": "B"}, {"id": 183, "de": "3", "q": "Tư tưởng Hồ Chí Minh về đại đoàn kết dân tộc trong sự nghiệp cách mạng gồm các nội dung chủ yếu nào?", "options": {"A": "Vị trí, vai trò đoàn kết dân tộc", "B": "Nội dung, hình thức đoàn kết dân tộc", "C": "Nguyên tắc, phương pháp đoàn kết dân tộc", "D": "Tất cả các đáp án của câu này đều đúng"}, "answer": "D"}, {"id": 184, "de": "3", "q": "Tại Văn kiện Đại hội mấy của Đảng, lần đầu tiên tư tưởng về đại đoàn kết dân tộc được đưa vào làm thành tố của chủ đề Đại hội : “Tăng cường xây dựng Đảng trong sạch, vững mạnh; phát huy sức mạnh toàn dân tộc, dân chủ xã hội chủ nghĩa…” ?", "options": {"A": "Văn kiện đại hội VI", "B": "Văn kiện đại hội X", "C": "Văn kiện đại hội XI", "D": "Văn kiện đại hội XII"}, "answer": "D"}, {"id": 185, "de": "3", "q": "Câu nói: \"Vô sản toàn thế giới và các dân tộc bị áp bức đoàn kết lại” là của ai?", "options": {"A": "Các Mác", "B": "Lênin", "C": "Ăngghen", "D": "Hồ Chí Minh"}, "answer": "B"}, {"id": 186, "de": "3", "q": "Điền vào chỗ trống: Trong quá trình cách mạng, Đảng Cộng sản Việt Nam…......đưa cách mạng Việt Nam giành những thăng lợi vô cùng to lớn.", "options": {"A": "kế thừa truyền thống quý báu của dân tộc", "B": "vận dụng sáng tạo Chủ nghĩa Mác - Lênin", "C": "đã phát huy sức mạnh đại đoàn kết dân tộc", "D": "Tất cả các đáp án của câu này đều đúng"}, "answer": "D"}, {"id": 187, "de": "3", "q": "Kệ sách \" Khoan thư sức dân để làm kế sâu rễ bền gốc là thượng sách giữ nước\" được các vua thời nào thi hành?", "options": {"A": "Nhà Trần", "B": "Nhà Nguyễn", "C": "Nhà Lý", "D": "Nhà Lê"}, "answer": "A"}, {"id": 188, "de": "3", "q": "Đường lối, chính sách đại đoàn kết toàn dân tộc trong xây dựng và bảo vệ Tổ quốc của Đảng ta được hình thành trên cơ sở nào?", "options": {"A": "Chủ nghĩa Mác- Lênin", "B": "Tư tưởng Hồ Chí Minh", "C": "Thực tiễn của đường lối, chính sách đại đoàn kết toàn dân tộc trong xây dựng và bảo vệ Tổ quốc", "D": "Tất cả các đáp án của câu này đều đúng"}, "answer": "D"}, {"id": 189, "de": "3", "q": "Điền vào chỗ trống cho đúng với Văn kiện Đại hội lần thứ XIII của Đảng (1-2021): đại đoàn kết toàn dân tộc trên nền tảng liên minh giai cấp công nhân với giai cấp nông dân và đội ngũ trí thức dưới sự lãnh đạo của Đảng là ... của cách mạng Việt Nam", "options": {"A": "đường lối chiến lược", "B": "chiến lược", "C": "sách lược", "D": "nhân tố quan trọng"}, "answer": "A"}, {"id": 190, "de": "3", "q": ": Theo chủ nghĩa Mác - Lênin, cơ sở của đoàn kết dân tộc, đoàn kết tôn giáo từ sự thống nhất về lợi ích căn bản giữa các thành phần nào trong xã hội?", "options": {"A": "Dân tộc", "B": "Giai cấp", "C": "Tầng lớp", "D": "Tất cả các đáp án của câu này đều đúng"}, "answer": "B"}, {"id": 191, "de": "3", "q": ": \" Cách mạng là sự nghiệp của quần chúng\". Quan điểm này của….", "options": {"A": "Chủ nghĩa Mác – Lênin", "B": "Hồ Chí Minh", "C": "Nguyễn Trãi", "D": "Tất cả các đáp án của câu này đều sai"}, "answer": "A"}, {"id": 192, "de": "3", "q": "Đại hội XIII của Đảng ta chỉ rõ, mục tiêu của đại đoàn kết toàn dân tộc là gì?", "options": {"A": "giữ vững độc lập", "B": "thống nhất của Tổ quốc", "C": "dân giàu, nước mạnh, xã hội công bằng, dân chủ, văn minh", "D": "Tất cả các đáp án của câu này đều đúng"}, "answer": "D"}, {"id": 193, "de": "3", "q": "\" Trong bầu trời không gì quý bằng nhân dân. Trong thế giới, không gì mạnh bằng lực lượng đoàn kết của nhân dân\". Quan điểm trên của ai?", "options": {"A": "Các Mác", "B": "Hồ Chí Minh", "C": "Ăngghen", "D": "Lênin"}, "answer": "B"}, {"id": 194, "de": "3", "q": "Chọn cụm từ điền vào chỗ trống để đúng với quan điểm của Đảng về đại đoàn kết toàn dân tộc trong xây dựng và bảo vệ Tổ quốc: Đại đoàn kết dân tộc trên nền tảng liên minh giai cấp công nhân với giai cấp nông dân và đội ngũ trí thức dưới sự lãnh đạo của Đảng là đường lối... của cách mạng Việt Nam.", "options": {"A": "quan trọng", "B": "chiến lược", "C": "cần thiết", "D": "không thể thiếu"}, "answer": "B"}, {"id": 195, "de": "3", "q": "Các chủ trương của Đảng và chính sách, pháp luật của Nhà nước có ý nghĩa như thế nào đối với sự nghiệp đại đoàn kết của toàn dân tộc, của cả hệ thống chính trị?", "options": {"A": "Quan trọng hàng đầu", "B": "Chiến lược", "C": "Cần thiết", "D": "Quyết định"}, "answer": "A"}, {"id": 196, "de": "3", "q": "Theo quan điểm của Đảng ta, vấn đề nào đang trở thành một vấn đề quốc tế mang tính thời sự sâu sắc?", "options": {"A": "biến đổi khí hậu", "B": "an ninh lương thực", "C": "tôn giáo, tín ngưỡng", "D": "dân tộc"}, "answer": "D"}, {"id": 197, "de": "3", "q": "Theo quan điểm của chủ nghĩa Mác - Lênin, cơ sở của đoàn kết dân tộc, đoàn kết tôn giáo là gì?", "options": {"A": "Từ sự thống nhất về lợi ích căn bản giữa các dân tộc, giai cấp, tầng lớp trong xã hội", "B": "Bảo đảm lợi ích tối cao của dân tộc và quyền lợi cơ bản của các tầng lớp nhân dân", "C": "Phải hoạt động theo nguyên tắc hiệp thương dân chủ, bảo đảm đoàn kết ngày càng rộng rãi, bền vững", "D": "Phải có lòng khoan dung, độ lượng, tin vào nhân dân, tin vào con người"}, "answer": "A"}, {"id": 198, "de": "3", "q": "Theo quan điểm của Đảng ta, nhiệm vụ trọng tâm của đổi mới hệ thống chính trị là?", "options": {"A": "Tiếp tục xây dựng và hoàn thiện Nhà nước pháp quyền xã hội chủ nghĩa của nhân dân, do nhân dân và vì nhân nhân do Đảng lãnh đạo", "B": "Tăng cường sự lãnh đạo của Đảng đối với nhà nước", "C": "Phát huy vai trò trách nhiệm của Mặt trận Tổ quốc", "D": "Phát huy vai trò của các tổ chức đoàn thể, các tổ chức xã hội"}, "answer": "A"}, {"id": 199, "de": "3", "q": "\"Đại đoàn kết tức là trước hết phải đoàn kết đại đa số nhân dân, mà đại đa số nhân dân là công nhân, nông dân và các tầng lớp nhân dân lao động khác. Đó là nền gốc của đại đoàn kết. Nó cũng như cái nền của nhà, cái gốc của cây. Nhưng đã có nền vững, gốc tốt, còn phải đoàn kết các tầng lớp nhân dân khác\". Quan điểm trên của ai?", "options": {"A": "Các Mác", "B": "Hồ Chí Minh", "C": "Ăngghen", "D": "Lênin"}, "answer": "B"}, {"id": 200, "de": "3", "q": "Tư tưởng Hồ Chí Minh về vấn đề dân tộc là hệ thống quan điểm đúng đắn, sâu sắc thể hiện sự kết hợp nhuần nhuyễn của những yếu tố nào?", "options": {"A": "Dân tộc với giai cấp", "B": "Độc lập dân tộc và chủ nghĩa xã hội", "C": "Chủ nghĩa yêu nước với chủ nghĩa quốc tế", "D": "Tất cả các đáp án đều đúng"}, "answer": "A"}, {"id": 201, "de": "3", "q": "Nhân tố nào có ý nghĩa quyết định đảm bảo thắng lợi bền vững sự nghiệp xây dựng và bảo vệ Tổ quốc ở nước ta?", "options": {"A": "Đại đoàn kết toàn dân tộc trên nền tảng liên minh công nhân, nông dân và đội ngũ trí thức dưới sự lãnh đạo của Đảng cộng sản Việt Nam", "B": "Có nền kinh tế phát triển mạnh mẽ.", "C": "Có nền kinh tế phát triển mạnh mẽ và nền văn hóa tiên tiến đậm đà bản sắc dân tộc.", "D": "Có đường lối đối ngoại độc lập, tự chủ, hòa bình, hợp tác, phát triển, đa dạng hóa, đa phương hóa các quan hệ đối ngoại."}, "answer": "A"}, {"id": 202, "de": "3", "q": "Tổ chức nào ở nước ta được đánh giá có vai trò rất quan trọng trong việc tập hợp, vận động, đoàn kết rộng rãi các tầng lớp nhân dân?", "options": {"A": "Mặt trận Tổ quốc và các đoàn thể nhân dân.", "B": "Đảng cộng sản Việt Nam.", "C": "Đoàn thanh niên cộng sản Hồ Chí Minh.", "D": "Liên đoàn lao động Việt Nam"}, "answer": "A"}, {"id": 203, "de": "3", "q": "Theo quan điểm của Đảng ta, đại đoàn kết toàn dân tộc dựa trên nền tảng nào?", "options": {"A": "Các dân tộc hoàn toàn bình đẳng, các dân tộc được quyền tự quyết.", "B": "Các dân tộc đoàn kết, bình đẳng và liên hiệp công nhân tất cả các dân tộc lại.", "C": "Liên minh giai cấp công nhân với giai cấp nông dân và đội ngũ trí thức, dưới sự lãnh đạo của Đảng.", "D": "Giữ vững độc lập, thống nhất của Tổ quốc, vì mục tiêu dân giàu, nước mạnh, dân chủ, công bằng văn minh."}, "answer": "C"}, {"id": 204, "de": "3", "q": "Điền từ còn thiếu vào nhận định sau đây: \"Tư tưởng Hồ Chí Minh về đại đoàn kết dân tộc chính là sự phát triển ............, độc đáo truyền thống đoàn kết của dân tộc Việt Nam, lý luận của chủ nghĩa Mác - Lênin và tinh hoa văn hóa của nhân loại\".", "options": {"A": "có kế thừa", "B": "sáng tạo", "C": "đột phá", "D": "vượt bậc"}, "answer": "B"}, {"id": 205, "de": "3", "q": "Văn kiện Đại hội Đại biểu toàn quốc lần thứ XIII của Đảng chỉ rõ: \"Mọi hoạt động của hệ thống chính trị, của cán bộ đảng viên, công chức, viên chức phải phục vụ lợi ích của.....\"\nĐiền từ còn thiếu vào chỗ trống:", "options": {"A": "giai cấp công nhân", "B": "giai cấp công nhân", "C": "nhân dân", "D": "toàn dân tộc"}, "answer": "C"}, {"id": 206, "de": "3", "q": "Đường lối chiến lược đại đoàn kết dân tộc của Đảng Cộng sản Việt Nam hiện nay được hình thành trên những những cơ sở lý luận nào?", "options": {"A": "Quan điểm của chủ nghĩa Mác - Lênin", "B": "Tư tưởng Hồ Chí Minh về dân tộc và đại đoàn kết dân dân", "C": "Truyền thống đoàn kết của dân tộc Việt Nam", "D": "Tất cả các đáp án đều đúng"}, "answer": "D"}, {"id": 207, "de": "3", "q": "Chủ nghĩa Mác - Lênin khẳng định cách mạng là sự nghiệp của ai?", "options": {"A": "Nông dân", "B": "Công nhân", "C": "Quần chúng", "D": "Trí tthức"}, "answer": "C"}, {"id": 208, "de": "3", "q": "Nghị quyết của Hội nghị lần thứ bảy Ban chấp hành Trung ương Đảng khóa IX (3-2003) về phát huy sức mạnh đại đoàn kết toàn dân tộc xác định: Đại đoàn kết là sự nghiệp của toàn dân tộc, của cả hệ thống chính trị mà hạt nhân lãnh đạo là:", "options": {"A": "Nhà nước", "B": "Các tổ chức Đảng", "C": "Chính phủ", "D": "Mặt trận Tổ quốc Việt Nam"}, "answer": "B"}, {"id": 209, "de": "3", "q": "Cương lĩnh xây dựng đất nước trong thời kỳ quá độ lên chủ nghĩa xã hội (bổ sung, phát triển 2011) đã xác định: Các chính sách kinh tế - xã hội phải phù hợp với đặc thù của các vùng và các dân tộc, nhất là:", "options": {"A": "Giai cấp nông dân", "B": "Giai cấp công nhân", "C": "Các dân tộc thiểu số", "D": "Tầng lớp trí thức"}, "answer": "C"}, {"id": 210, "de": "3", "q": "Đại đoàn kết toàn dân tộc trên nền tảng liên minh giai cấp công nhân với giai cấp nông dân và đội ngũ trí thức dưới sự lãnh đạo của Đảng là đường lối như thế nào của cách mạng Việt Nam theo nghị quyết của Hội nghị lần thứ bảy Ban Chấp hành Trung ương Đảng khóa IX (3-2003) về phát huy sức mạnh đại đoàn kết toàn dân tộc?", "options": {"A": "Chiến lược", "B": "Quan trọng", "C": "Sách lược", "D": "Chủ yếu"}, "answer": "A"}, {"id": 211, "de": "3", "q": "Theo tư tưởng Hồ Chí Minh, đại đoàn kết dân tộc là mục tiêu, nhiệm vụ hàng đầu của Đảng, phải được quán triệt trong lĩnh vực nào?", "options": {"A": "Kinh tế", "B": "Chính trị", "C": "Văn hóa", "D": "Tất cả các lĩnh vực, từ đường lối, chính sách đến hoạt động thực tiễn"}, "answer": "D"}, {"id": 212, "de": "3", "q": "Theo quan điểm của Đảng ta về phương hướng phát huy sức mạnh toàn dân tộc, đại đoàn kết toàn dân tộc phải dựa trên cơ sở giải quyết hài hòa mối quan hệ nào?", "options": {"A": "giải quyết hài hòa Quan hệ lợi ích giữa các giai tầng trong xã hội", "B": "Quan hệ giữa giai cấp công nhân với giai cấp nông dân", "C": "Quan hệ giữa giai cấp công nhân với tầng lớp trí thức", "D": "Quan hệ giữa giai cấp nông nhân với tầng lớp trí thức"}, "answer": "A"}, {"id": 213, "de": "3", "q": "Hãy điền vào chỗ trống: Về phương pháp thực hiện đại đoàn kết, Hồ Chí Minh rất coi trọng việc tuyên truyền, giáo dục, vận động quần chúng. Nội dung tuyên truyền, giáo dục phù hợp với tâm lý, nguyện vọng chung nhất và những quyền lợi chủ yếu nhất của quần chúng, của…....", "options": {"A": "các tầng lớp xã hội", "B": "của nhân dân lao động", "C": "của toàn thể dân tộc", "D": "của quần chúng nhân dân"}, "answer": "D"}, {"id": 214, "de": "3", "q": "Chọn cụm từ thích hợp điền vào chỗ trống: Hồ Chí Minh khẳng định: Đại đoàn kết dân tộc là một ….. cơ bản, nhất quán, lâu dài, là nguồn sức mạnh vô địch, là động lực chủ yếu, quyết định thành công của cách mạng Việt Nam.", "options": {"A": "sách lược", "B": "Chiến lược", "C": "yếu tố quan trọng", "D": "yếu tố vô cùng quan trọng"}, "answer": "B"}, {"id": 215, "de": "3", "q": "Trong lời kết thúc buổi ra mắt của Đảng Lao Động Việt Nam ngày 03/03/1951, Hồ Chí Minh đã thay mặt Đảng tuyên bố trước toàn thể dân tộc: \"Mục đích của Đảng Lao động Việt Nam có thể gồm trong 8 chữ là:…………..\"", "options": {"A": "Đoàn kết toàn dân, cả nước thống nhất", "B": "Đoàn kết toàn dân, phụng sự tổ quốc", "C": "Đoàn kết toàn dân, nhất định thắng lợi", "D": "Đoàn kết toàn dân, phụng sự đất nước"}, "answer": "C"}, {"id": 216, "de": "3", "q": "Tại buổi lễ kỷ niệm 90 năm Ngày truyền thống của Mặt trận Tổ quốc Việt Nam, ai đã chỉ rõ: \" Đại đoàn kết dân tộc là chủ trương chiến lược, có ý nghĩa sống còn, quyết định sự thành bại của cách mạng, là sợi chỉ đỏ xuyên suốt trong đường lối cách mạng của Đảng ta. Là biểu trưng sinh động của tư tưởng đoàn kết thống nhất toàn dân tộc”", "options": {"A": "Phạm Văn Đồng", "B": "Nguyễn Phú Trọng", "C": "Trường Chinh", "D": "Nguyễn Chí Thanh"}, "answer": "B"}, {"id": 217, "de": "3", "q": "Câu nói này của ai:“Đoàn kết là một chính sách dân tộc, không phải là một thủ đoạn chính trị”?", "options": {"A": "Võ Nguyên Giáp", "B": "Trường Chinh", "C": "Hồ Chí Minh", "D": "Phạm Văn Đồng"}, "answer": "C"}, {"id": 218, "de": "3", "q": "\" Đoàn kết, đoàn kết, đại đoàn kết. Thành công, thành công, đại thành công\". Được Chủ tịch Hồ Chí Minh nói vào năm nào?", "options": {"A": "Năm 1960"
