, "B": "Năm 1961", "C": "Năm 1962", "D": "Năm 1963"}, "answer": "B"}, {"id": 219, "de": "3", "q": "Văn kiện Đại hội lần thứ XIII của Đảng đã chỉ ra một trong những phương hướng cơ bản nhằm phát huy sức mạnh đại đoàn kết dân tộc trong xây dựng và bảo vệ Tổ quốc là:", "options": {"A": "Quán triệt sâu sắc thực hiện đồng bộ các quan điểm, đường lối của Đảng", "B": "Thi đua yêu nước để tập hợp, động viên nhân dân các dân tộc tham gia các phong trào", "C": "Nâng cao đời sống nhân dân, phát triển kinh tế văn hóa", "D": "Nghiêm trị mọi âm mưu, hành động chia rẽ, phá hoại khối đại đoàn kết toàn dân tộc, cản trở sự phát triển của đất nước"}, "answer": "A"}, {"id": 220, "de": "3", "q": "Quần chúng nhân dân có vai trò như thế nào đối với sự phát triển của xã hội loài người?", "options": {"A": "Là người sáng tạo ra mọi của cải vật chất và tinh thần", "B": "Là chủ thể của sự phát triển xã hội", "C": "Là người sáng tạo ra lịch sử", "D": "Tất cả các đáp án trên đều đúng"}, "answer": "D"}, {"id": 221, "de": "3", "q": "Truyền thống quý báu nào đã làm nên sức mạnh để dân tộc Việt Nam đánh thắng nhiều kẻ thù mạnh hơn mình ?", "options": {"A": "Truyền thống đoàn kết", "B": "Truyền thống cần cù, tiết kiệm", "C": "Truyền thống tôn sư, trọng đạo", "D": "Truyền thống ăn quả nhớ kẻ trồng cây"}, "answer": "A"}, {"id": 222, "de": "3", "q": "Theo quan điểm của Đảng ta, Xây dựng khối đại đoàn kết toàn dân tộc chính là phát huy yếu tố nào của dân tộc ?", "options": {"A": "Phát huy ưu điểm của dân tộc", "B": "phát huy tinh hoa của dân tộc", "C": "phát huy nội lực dân tộc", "D": "Phát huy thế mạnh của dân tộc"}, "answer": "C"}, {"id": 223, "de": "3", "q": "Khẩu hiệu \"Vô sản toàn thế giới, đoàn kết lại!\" là của ai ?", "options": {"A": "Tôn Đức Thắng", "B": "C. Mác và Ph.Ăngghen", "C": "V.I. Lênin", "D": "Hồ Chí Minh"}, "answer": "B"}, {"id": 224, "de": "3", "q": "Vận động, đoàn kết các tổ chức chức sắc tôn giáo, chức sắc, tín đồ tôn giáo sống", "options": {"A": "Đúng phát luật", "B": "Đúng hiến pháp", "C": "Tốt đời đẹp đạo", "D": "Tích cực"}, "answer": "C"}, {"id": 225, "de": "3", "q": "Hồ Chí Minh quan điểm vấn đề nào là vấn đề chiến lược, có ý nghĩa quyết định thắng lợi của cách mạng Việt Nam ?", "options": {"A": "Vấn đề truyền bá chủ nghĩa Mác-Lênin", "B": "Vấn đề kháng chiến chống đế quốc", "C": "Vấn đề đoàn kết quốc tế", "D": "Vấn đề đoàn kết dân tộc"}, "answer": "D"}, {"id": 226, "de": "3", "q": "Đại hội XI chỉ ra rằng, Đại đoàn kết toàn dân tộc phải dựa trên cơ sở giải quyết như thế nào quan hệ lợi ích giữa các thành viên trong xã hội ?", "options": {"A": "Giải quyết hài hoà", "B": "Giải quyết được", "C": "Giải quyết ngay", "D": "Giải quyết thỏa đáng"}, "answer": "A"}, {"id": 227, "de": "3", "q": "Đảng ta quan điểm điều gì là hạt nhân, là cơ sở vững chắc để xây dựng khối đại đoàn kết toàn dân tộc ?", "options": {"A": "Truyền thống dân tộc", "B": "Sự ủng hộ của nhân dân", "C": "Lòng tin của nhân dân", "D": "Đoàn kết trong Đảng"}, "answer": "C"}, {"id": 228, "de": "3", "q": "Tổ chức nào ở nước ta là cơ sở chính trị của chính quyền nhân dân; đại diện, bảo vệ quyền và lợi ích hợp pháp, chính đáng của Nhân dân; tập hợp, phát huy sức mạnh đại đoàn kết toàn dân tộc, thực hiện dân chủ, tăng cường đồng thuận xã hội; giám sát, phản biện xã hội; tham gia xây dựng Đảng, Nhà nước, hoạt động đối ngoại nhân dân góp phần xây dựng và bảo vệ Tổ quốc.", "options": {"A": "Mặt trận Tổ quốc Việt Nam", "B": "Hội cựu chiến binh Việt Nam", "C": "Công đoàn Việt Nam", "D": "Nhà nước cộng hòa xã hội chủ nghĩa Việt Nam"}, "answer": "A"}, {"id": 229, "de": "3", "q": "Các thủ đoạn mà các thế lực thù địch thường sử dụng để phá hoại khối đại đoàn kết toàn dân tộc Việt Nam ?", "options": {"A": "“diễn biến hòa bình”", "B": "Kích động tư tưởng cực đoan, li khai trong đồng bào dân tộc thiểu số.", "C": "Xuyên tạc, đả kích chính sách dân tộc của Đảng và Nhà nước.", "D": "Tất cả các thủ đoạn đã nêu ở trên"}, "answer": "D"}, {"id": 230, "de": "3", "q": "Đâu là một trong những lực lượng của khối đại đoàn kết toàn dân tộc Việt Nam ?", "options": {"A": "Người nước ngoài", "B": "Đồng bào ta cư trú ở nước ngoài", "C": "Người nước ngoài và đồng bào ta cư trú ở nước ngoài", "D": "Các dân tộc yêu chuộng hòa bình trên thế giới"}, "answer": "C"}, {"id": 231, "de": "3", "q": "Hãy điền vào chỗ trống để hoàn thiện quan điểm của Hồ Chí Minh: \"Toàn quốc đồng bào hãy đứng dậy…... mà tự giải phóng cho ta\"", "options": {"A": "Dựa vào sự giúp đở quốc tế", "B": "Đem sức ta", "C": "Dựa vào sự đoàn kết toàn dân", "D": "Dưới sự lãnh đạo của Đảng"}, "answer": "B"}, {"id": 232, "de": "3", "q": "Sức mạnh dân tộc bao gồm những yếu tố chủ yếu nào?", "options": {"A": "Chủ nghĩa yêu nước", "B": "Tinh thần đoàn kết", "C": "Ý thức tự lực, tự cường", "D": "Tất cả các đáp án này đều đúng."}, "answer": "D"}, {"id": 233, "de": "3", "q": "Sức mạnh thời đại bao gồm những yếu tố nào?", "options": {"A": "Sức mạnh của khoa học- kỹ thuật", "B": "Sự đoàn kết của giai cấp công nhân quốc tế", "C": "Sự đoàn kết của các dân tộc bị áp bức và các lực lượng tiến bộ thế giới", "D": "Tất cả các đáp án này đều đúng."}, "answer": "D"}, {"id": 234, "de": "3", "q": "Luận điểm \"Đoàn kết, đoàn kết, đại đoàn kết\nThành công, thành công, đại thành công!\" được trích từ tác phẩm nào của Hồ Chí Minh?", "options": {"A": "Bài nói chuyện trong buổi lễ bế mạc Đại hội thành lập Mặt trận Tổ quốc Việt Nam", "B": "Bài nói chuyện tại lớp bồi dưỡng cán bộ về công tác Mặt trận", "C": "Bài nói chuyện tại Hội nghị mở rộng Ủy ban Trung ương Mặt trận Tổ quốc Việt Nam", "D": "Bài nói chuyện tại Đại hội đại biểu Mặt trận Tổ quốc Việt Nam lần thứ II"}, "answer": "A"}, {"id": 235, "de": "3", "q": "Để có chủ trương xây dựng chính sách đại đoán kết dân tộc đúng đắn, sáng tạo chúng ta cần:", "options": {"A": "Bám sát mục tiêu, yêu cầu cách mạng", "B": "Bám sát tình hình thực tiễn", "C": "Bám sát tình hình thế giới", "D": "Tất cả đều đúng"}, "answer": "B"}, {"id": 236, "de": "3", "q": "Cách mạng là công việc chung của quần chúng chứ không phải của một số ít người", "options": {"A": "Võ Nguyên Giáp", "B": "Nguyễn Xuân Phúc", "C": "Hồ Chí Minh", "D": "Trường Chinh"}, "answer": "C"}, {"id": 237, "de": "3", "q": "Câu nói :“Đoàn kết, đoàn kết, đại đoàn kết. Thành công, thành công đại thành công”, là của ai?", "options": {"A": "Hồ Chí Minh", "C": "Mác", "D": "Ph.Ăngghen", "E": "Lênin"}, "answer": "A"}, {"id": 238, "de": "3", "q": "Điền vào chỗ trống để hoàn thiện câu sau: Lợi dụng công nghệ thông tin, nhất là mạng internet và việc nước ta đang đẩy mạnh hội nhập quốc tế, các thế lực thù địch vẫn tiếp tục dùng...., gây xung đột xã hội, làm mất ổn định chính trị.", "options": {"A": "Diễn biến hòa bình", "B": "Chiến tranh lạnh", "C": "Toàn cầu hóa", "D": "Hỗ trợ, cho vay vốn"}, "answer": "A"}, {"id": 239, "de": "3", "q": "Theo tư tưởng Hồ Chí Minh: phương pháp thực hiện đại đoàn kết là gì?", "options": {"A": "Thu hút đông đảo nhân dân tham gia vào khối đại đoàn kết", "B": "Tuyên truyền giáo dục, vận động quần chúng", "C": "Đảm bảo lợi ích tối thiểu của các dân tộc", "D": "Phải kế thừa truyền thống yêu nước của dân tộc"}, "answer": "B"}, {"id": 240, "de": "3", "q": "Vai trò của Đảng trong khối đại đoàn kết toàn dân tộc ?", "options": {"A": "Đảng là trung tâm", "B": "Đảng là nòng cốt", "C": "Đảng là hạt nhân lãnh đạo", "D": "Đảng là cơ sở"}, "answer": "C"}, {"id": 241, "de": "3", "q": "Theo quan điểm, đại đoàn kết toàn dân tộc lấy mục tiêu nào làm điểm tương đồng, xoá bỏ mặc cảm, định kiến, phân biệt đối xử về quá khứ, thành phần, giai cấp, xây dựng tinh thần cởi mở, tin cậy lẫn nhau, cùng hướng tới tương lai?", "options": {"A": "Vì hạnh phúc nhân loại", "B": "Vì sự công bằng của xã hội", "C": "Giữ vững độc lập, thống nhất của Tổ quốc, vì dân giàu, nước mạnh, xã hội công bằng, dân chủ, văn minh", "D": "Sự phát triển của quốc gia"}, "answer": "C"}, {"id": 242, "de": "3", "q": "\"Ta đoàn kết để đấu tranh cho thống nhất và độc lập của Tổ quốc; ta còn phải đoàn kết để xây dựng nước nhà. Ai có tài, có đức, có sức, có lòng phụng sự Tổ quốc và phục vụ nhân dân thì ta đoàn kết với họ\" Câu nói trên của ai?", "options": {"A": "Chủ tịch Hồ Chí Minh", "B": "Thủ tướng Phạm Văn Đồng", "C": "Đại tướng Võ Nguyên Giáp", "D": "Chủ tịch nước Trân Đại Quang"}, "answer": "A"}, {"id": 243, "de": "3", "q": "Đảng ta quan điểm điều gì là hạt nhân, là cơ sở vững chắc để xây dựng khối đại đoàn kết toàn dân tộc ?", "options": {"A": "Truyền thống dân tộc", "B": "Sự ủng hộ của nhân dân", "C": "Lòng tin của nhân dân", "D": "Đoàn kết trong Đảng"}, "answer": "C"}, {"id": 244, "de": "3", "q": "Đại đoàn kết dân tộc có vai trò như thế nào trong sự nghiệp xây dựng và bảo vệ tổ quốc", "options": {"A": "Đường lối chiến lược", "B": "Nguồn sức mạnh", "C": "Động lực chủ yếu", "D": "Tất cả đều đúng"}, "answer": "D"}, {"id": 245, "de": "3", "q": "Nguồn sức mạnh, động lực chủ yếu và nhân tố có ý nghĩa quyết định đảm bảo thắng lợi bền vững của sự nghiệp xây dựng và bảo vệ tổ quốc là:", "options": {"A": "Nhà nước quàn lý", "B": "Nhân dân làm chủ", "C": "Đảng lãnh đạo", "D": "Đoàn kết dân tộc"}, "answer": "D"}, {"id": 246, "de": "3", "q": ": Theo tư tưởng Hồ Chí Minh, mục tiêu nhiệm vụ hàng đầu của cách mạng là:", "options": {"A": "Đại đoàn kết dân tộc", "B": "Chăm lo bồi dưỡng thế hệ cách mạng cho đời sau", "C": "Độc lập dân tộc gắn liền với CNXH", "D": "Kết hợp sức mạnh dân tộc với sức mạnh thời đại"}, "answer": "C"}, {"id": 247, "de": "4", "q": "Hiến pháp năm 2013 quy định: Đạo luật cơ bản của nước Cộng hòa xã hội chủ nghĩa Việt Nam, có hiệu lực pháp lý cao nhất là:", "options": {"A": "Pháp luật", "B": "Hiến pháp", "C": "Quyết định của Chủ tịch nước", "D": "Quyết định của Thủ tướng chính phủ"}, "answer": "B"}, {"id": 248, "de": "4", "q": "Theo quan điểm của Đảng ta, chủ thể tối cao của quyền lực nhà nước là?", "options": {"A": "Nhân dân", "B": "Công nhân", "C": "Cán bộ, công chức Nhà nước", "D": "Tất cả các dân tộc trên lãnh thổ Việt Nam"}, "answer": "A"}, {"id": 249, "de": "4", "q": "Hiến pháp năm 2013 quy định: Cơ quan xét xử của nước Cộng hoà xã hội chủ nghĩa Việt Nam, thực hiện quyền tư pháp là cơ quan nào?", "options": {"A": "Chính phủ", "B": "Quốc hội", "C": "Tòa án nhân dân", "D": "Viện kiểm sát nhân dân"}, "answer": "C"}, {"id": 250, "de": "4", "q": "Hiến pháp năm 2013 quy định: Cơ quan hành chính nhà nước cao nhất của nước Cộng hoà xã hội chủ nghĩa Việt Nam là cơ quan nào?", "options": {"A": "Quốc hội", "B": "Chính phủ", "C": "Viện kiểm sát", "D": "Toàn án"}, "answer": "B"}, {"id": 251, "de": "4", "q": "\"Quyền lực nhà nước là thống nhất, có sự phân công, phối hợp, kiểm soát giữa các cơ quan nhà nước trong việc thực hiện các quyền lập pháp, hành pháp, tư pháp\". Nội dung trên được thể hiện trong bản Hiến pháp năm nào của nước Cộng hòa xã hội chủ nghĩa Việt Nam?", "options": {"A": "1959", "B": "1980", "C": "1992", "D": "2013"}, "answer": "D"}, {"id": 252, "de": "4", "q": "Thuật ngữ \"Nhà nước pháp quyền\" lần đầu tiên được đề cập tại Đại hội lần thứ mấy của Đảng ta?", "options": {"A": "V", "B": "VI", "C": "VII", "D": "VIII"}, "answer": "C"}, {"id": 253, "de": "4", "q": "Chọn cụm từ điền vào chỗ trống đúng với nội dung của Hiến pháp 2013: Nhà nước được tổ chức và hoạt động theo........, quản lý xã hội bằng......., thực hiện nguyên tắc tập trung dân chủ.", "options": {"A": "Hiến pháp và pháp luật", "B": "quyết định của Chủ tịch nước", "C": "hiến pháp", "D": "pháp luật"}, "answer": "A"}, {"id": 254, "de": "4", "q": "Cơ quan quyền lực nhà nước địa phương ở Thành phố Hồ Chí Minh hiện nay là:", "options": {"A": "Ủy ban nhân dân Thành phố Hồ Chí Minh", "B": "Mặt trận tổ quốc Thành phố Hồ Chí Minh", "C": "Hội đồng nhân dân Thành phố Hồ Chí Minh", "D": "Tòa án nhân dân Thành phố Hồ Chí Minh"}, "answer": "C"}, {"id": 255, "de": "4", "q": "Nhà nước Việt Nam thống nhất ba quyền lập pháp, hành pháp, tư pháp trong Hiến pháp nào?", "options": {"A": "1990", "B": "1992", "C": "1993", "D": "1991"}, "answer": "B"}, {"id": 256, "de": "4", "q": "Trong hệ thống chính trị, cơ quan nào vừa là lãnh đạo, vừa là bộ phận?", "options": {"A": "Mặt trận Tổ quốc Việt Nam", "B": "Đảng Cộng sản Việt Nam", "C": "Hội liên hiệp Phụ nữ", "D": "Liên đoàn Lao động"}, "answer": "B"}, {"id": 257, "de": "4", "q": "Hành vi nào dưới đây không thể hiện trách nhiệm của công dân trong việc tham gia xây dựng Nhà nước pháp quyền xã hội chủ nghĩa Việt Nam?", "options": {"A": "Anh G không vi phạm pháp luật", "B": "Anh C không tố giác tội phạm", "C": "Chị H tham gia vào đội dân quân tự vệ của phường", "D": "Bác D tuyên truyền và vận động mọi người trong khu phố thực hiện tốt pháp luật"}, "answer": "B"}, {"id": 258, "de": "4", "q": "Cách thức để Hiến Pháp năm 2013 đi vào cuộc sống của người dân?", "options": {"A": "Tuyên truyền sâu rộng nội dung của Hiến pháp đến từng người dân.", "B": "Để người dân tự nghiên cứu.", "C": "Trong các thư viện để thật nhiều Hiến pháp.", "D": "Tự ý thức của từng người dân."}, "answer": "A"}, {"id": 259, "de": "4", "q": "Đặc trưng cơ bản của Nhà nước pháp quyền xã hội chủ nghĩa Việt Nam là gì?", "options": {"A": "Nhà nước của dân, do dân và vì dân.", "B": "Nhà nước pháp quyền của dân, do dân và vì dân.", "C": "Nhà nước của nhân dân lao động.", "D": "Nhà nước do nhân dân làm chủ."}, "answer": "B"}, {"id": 260, "de": "4", "q": "Hệ thống chính trị nước ta vận hành theo cơ chế nào?", "options": {"A": "Nhà nước lãnh đạo, Đảng quản lý, nhân dân làm chủ.", "B": "Nhà nước làm chủ, Đảng lãnh đạo, nhân dân quản lý.", "C": "Đảng lãnh đạo, nhà nước quản lý, nhân dân làm chủ.", "D": "Đảng và Nhà nước lãnh đạo, quản lý, nhân dân làm chủ."}, "answer": "C"}, {"id": 261, "de": "4", "q": "Bản chất của nhà nước pháp quyền xã hội chủ nghĩa Việt Nam là gì?", "options": {"A": "Mang bản chất của giai cấp công nhân.", "B": "Mang bản chất của đa số nhân dân lao động.", "C": "Mang bản chất của giai cấp công nhân, tính nhân dân rộng rãi và tính dân tộc sâu sắc.", "D": "Mang bản chất của toàn thể dân tộc."}, "answer": "C"}, {"id": 262, "de": "4", "q": "Điền từ còn thiếu vào chỗ trống: Nhà nước xã hội chủ nghĩa Việt Nam vừa có bản chất giai cấp công nhân, vừa có tính nhân dân rộng rãi và tính ……..sâu sắc.", "options": {"A": "giai cấp", "B": "nhân đạo", "C": "dân tộc", "D": "cộng đồng"}, "answer": "C"}, {"id": 263, "de": "4", "q": "Nhà nước Pháp quyền xã hội chủ nghĩa Việt Nam quản lí xã hội bằng:", "options": {"A": "Hiến pháp", "B": "Pháp luật", "C": "Hiến pháp và Pháp luật", "D": "Luật lệ"}, "answer": "C"}, {"id": 264, "de": "4", "q": "Bản chất giai cấp công nhân, tính dân tộc và tính nhân dân của nhà nước Cộng hoà xã hội chủ nghĩa Việt Nam thể hiện ở nội dung nào?", "options": {"A": "Tất cả đều đúng", "B": "Trên mọi lĩnh vực", "C": "Mọi tổ chức", "D": "Mọi hoạt động của nhà nước"}, "answer": "D"}, {"id": 265, "de": "4", "q": "Tính đến nay trong lịch sử lập hiến của nước ta có bao nhiêu bản Hiến pháp đã được ban hành?", "options": {"A": "6", "B": "3", "C": "4", "D": "5"}, "answer": "D"}, {"id": 266, "de": "4", "q": "Nhận định sau đây được khẳng định trong văn bản Hiến Pháp nào? “Nhà nước Cộng hòa xã hội chủ nghĩa Việt Nam là nhà nước pháp quyền xã hội chủ nghĩa của Nhân dân, do Nhân dân, vì Nhân dân.", "options": {"A": "Hiến pháp 1946", "B": "Hiến pháp 1959", "C": "Hiến pháp 1992", "D": "Hiến pháp 2013"}, "answer": "D"}, {"id": 267, "de": "4", "q": "Nhà nước pháp quyền xã hội chủ nghĩa Việt Nam do tổ chức nào dưới đây lãnh đạo?", "options": {"A": "Mặt trận Tổ quốc Việt nam", "B": "Đảng Cộng sản Việt Nam", "C": "Hội liên hiệp Phụ nữ Việt Nam", "D": "Liên đoàn Lao động Việt Nam"}, "answer": "B"}, {"id": 268, "de": "4", "q": "Bản chất giai cấp công nhân, tính dân tộc và tính nhân dân của Nhà nước ta được quán triệt, cụ thể hóa, thể chế hóa và thực hiện trên lĩnh vực nào?", "options": {"A": "Kinh tế", "B": "Chính trị", "C": "Văn hóa", "D": "Mọi lĩnh vực, mọi tổ chức, hoạt động của Nhà nước"}, "answer": "D"}, {"id": 269, "de": "4", "q": "Sự lãnh đạo của Đảng Cộng sản Việt Nam đối với sự nghiệp xây dựng nhà nước pháp quyền xã hội chủ nghĩa của dân, do dân, vì dân như thế nào?", "options": {"A": "Là một tất yếu lịch sử", "B": "Là một tất yếu khách quan", "C": "Là một tất yếu lịch sử và tất yếu khách quan", "D": "Rất quan trọng"}, "answer": "C"}, {"id": 270, "de": "4", "q": "Sinh viên trường Cao Đẳng Lý Tự Trọng thường xuyên nêu cao tinh thần cảnh giác trước những âm mưu, thủ đoạn của kẻ thù khi đọc những thông tin trên mạng nói xấu Đảng, Nhà nước ta. Học sinh - sinh viên trường Cao Đẳng Lý Tự Trọng đã thể hiện điều nào dưới đây trong việc tham gia xây dựng Nhà nước pháp quyền?", "options": {"A": "Trách nhiệm của công dân", "B": "Nghĩa vụ của công dân", "C": "Lí tưởng của công dân", "D": "Trí tuệ của công dân"}, "answer": "A"}, {"id": 271, "de": "4", "q": "Bản Hiến pháp nào của nước ta đã khẳng định: \"Nhà nước Cộng hòa xã hội chủ nghĩa Việt Nam là nhà nước pháp quyền xã hội chủ nghĩa của Nhân dân, do Nhân dân, vì Nhân dân\"?", "options": {"A": "Hiến pháp năm 1946", "B": "Hiến pháp năm 1959", "C": "Hiến pháp năm 1980", "D": "Hiến pháp năm 2013"}, "answer": "D"}, {"id": 272, "de": "4", "q": "Để giữ vững bản chất giai cấp công nhân, đảm bảo quyền lực thuộc về nhân dân, sự lãnh đạo của Đảng đối với Nhà nước như thế nào?", "options": {"A": "là một tất yếu chủ quan", "B": "là một tất yếu khách quan", "C": "là một chiến lược", "D": "là một sách lược"}, "answer": "B"}, {"id": 273, "de": "4", "q": "Điền cụm từ vào chỗ trống cho đúng với điều 4 Hiến pháp 2013: “Sự lãnh đạo của Đảng đối với Nhà là …... để giữ vững được bản chất giai cấp công nhân, đảm bảo quyền lực thuộc về nhân dân”.", "options": {"A": "tất yếu khách quan", "B": "tất yếu", "C": "tất yếu chủ quan", "D": "quan trọng"}, "answer": "A"}, {"id": 274, "de": "4", "q": "Chọn đáp án đúng điền vào chỗ trống. Hiến pháp được coi là……của Nhà nước", "options": {"A": "Đạo luật", "B": "Đạo luật cần thiết", "C": "Đạo luật cơ bản", "D": "Đạo luật đầu tiên"}, "answer": "C"}, {"id": 275, "de": "4", "q": "Cơ quan quyền lực cao nhất của Nhà nước ta hiện nay là cơ quan nào?", "options": {"A": "Quốc hội", "B": "Chính phủ", "C": "Viện Kiểm sát", "D": "Tòa án"}, "answer": "A"}, {"id": 276, "de": "4", "q": "Hiến pháp năm 1946 do ai chủ trì soạn thảo?", "options": {"A": "Hồ Chí Minh", "B": "Võ Nguyên Giáp", "C": "Phạm Văn Đồng", "D": "Lê Hồng Phong"}, "answer": "A"}, {"id": 277, "de": "4", "q": "Hiến pháp năm 2013 được thông qua vào ngày, tháng, năm nào?", "options": {"A": "28/11/ 2013", "B": "1/1/2014", "C": "28/1/2013", "D": "1/11/2013"}, "answer": "A"}, {"id": 278, "de": "4", "q": "Hiến pháp năm 1946 được Quốc hội khóa I thông qua vào ngày, tháng, năm nào?", "options": {"A": "Ngày 6 tháng 1 năm 1946", "B": "Ngày 6 tháng 11 năm 1946", "C": "Ngày 9 tháng 1 năm 1946", "D": "Ngày 9 tháng 11 năm 1946"}, "answer": "D"}, {"id": 279, "de": "4", "q": "Theo Hiến pháp năm 2013, cơ quan nào tại Việt Nam có nhiệm vụ bảo vệ công lý, bảo vệ quyền con người, quyền công dân, bảo vệ chế độ xã hội chủ nghĩa, bảo vệ lợi ích của Nhà nước, quyền và lợi ích hợp pháp của tổ chức, cá nhân?", "options": {"A": "Quốc hội", "B": "Chính phủ", "C": "Đảng Cộng sản", "D": "Tòa án nhân dân"}, "answer": "D"}, {"id": 280, "de": "4", "q": "Theo Cương lĩnh xây dựng đất nước trong thời kỳ quá độ lên chủ nghĩa xã hội (bổ sung, phát triển 2011), nguyên tắc tổ chức và hoạt động của bộ máy nhà nước là:", "options": {"A": "Tất cả các đáp án của câu này đều đúng", "B": "Có sự phân công, phân cấp", "C": "Bảo đảm sự chỉ đạo thống nhất của Trung ương", "D": "Tập trung dân chủ"}, "answer": "D"}, {"id": 281, "de": "4", "q": "\" Sau Cách mạng Tháng tám 1945, một nhà nước kiểu mới, nhà nước công- nông đầu tiên ở Đông Nam Á ra đời là nhà nước nào?", "options": {"A": "Việt Nam Cộng hòa", "B": "Nhà nước Việt Nam Dân chủ Cộng hòa", "C": "Nhà nước Cộng hòa xã hội chủ nghĩa Việt Nam", "D": "Nhà nước Cộng hòa Miền Nam Việt Nam"}, "answer": "B"}, {"id": 282, "de": "4", "q": "Theo quan điểm của Chủ nghĩa Mác- Lênin, xã hội đầu tiên trong lịch sử tồn tại nhà nước là xã hội nào?", "options": {"A": "Công xã nguyên thủy", "B": "Chiếm hữu nô lệ", "C": "Phong kiến", "D": "Tư bản chủ nghĩa"}, "answer": "B"}, {"id": 283, "de": "4", "q": "Theo quan điểm của Đảng ta, Nhà nước pháp quyền xã hội chủ nghĩa Việt Nam thực hiện ý chí, nguyện vọng và phục vụ lợi ích của ai?", "options": {"A": "Công nhân", "B": "Nhân dân lao động", "C": "Tất cả các đáp án của câu này đều đúng", "D": "Cả dân tộc"}, "answer": "C"}, {"id": 284, "de": "4", "q": "\"Ở nước Cộng hòa xã hội chủ nghĩa Việt Nam, các quyền con người, quyền công dân về chính trị, dân sự, kinh tế, văn hóa, xã hội được công nhận, tôn trọng, bảo vệ, bảo đảm theo Hiến pháp và pháp luật\". Nội dung trên được khẳng định trong bản Hiến pháp năm bao nhiêu?", "options": {"A": "1959", "B": "1982", "C": "1992", "D": "2013"}, "answer": "D"}, {"id": 285, "de": "4", "q": "Chọn đáp án đúng điền vaò chỗ trống: Để giữ vững được bản chất giai cấp công nhân, đảm bảo quyền lực thuộc vễ nhân dân thì sự lãnh đạo của Đảng đối với nhà nước là...", "options": {"A": "tất yếu khách quan", "B": "tất yếu lịch sử", "C": "rất cần thiết", "D": "không thể thiếu"}, "answer": "A"}, {"id": 286, "de": "4", "q": "Theo Hiến pháp năm 2013, tổ chức nào đóng vai trò là đội tiên phong của giai cấp công nhân, đồng thời là đội tiên phong của nhân dân lao động và của dân tộc Việt Nam, đại biểu trung thành lợi ích của giai cấp công nhân, nhân dân lao động và của cả dân tộc?", "options": {"A": "Nhà nước", "B": "Mặt trận tổ quốc", "C": "Đảng Cộng sản Việt Nam", "D": "Quốc hội"}, "answer": "C"}, {"id": 287, "de": "4", "q": "Chọn cụm từ đúng điền vào chỗ trống: \"Nhà nước pháp quyền xã hội chủ nghĩa Việt Nam tổ chức và hoạt động trên cơ sở Hiến pháp, ...... Hiến pháp\"", "options": {"A": "Tôn trọng và bảo vệ", "B": "Tôn trọng", "C": "Bảo vệ.", "D": "Bảo vệ và tôn trọng"}, "answer": "A"}, {"id": 288, "de": "4", "q": "Cơ quan nào trong hệ thống chính trị thực hiện quyền lập hiến và lập pháp?", "options": {"A": "Quốc hội", "B": "Viện kiểm sát", "C": "Tòa án", "D": "Chính phủ"}, "answer": "A"}, {"id": 289, "de": "4", "q": "Cơ quan nào trong hệ thống chính trị ở nước ta thực hiện quyền hành pháp?", "options": {"A": "Quốc hội", "B": "Viện kiểm sát", "C": "Tòa án Nhân dân", "D": "Chính phủ"}, "answer": "D"}, {"id": 290, "de": "4", "q": "Cơ quan nào trong hệ thống chính trị ở nước ta thực hiện quyền tư pháp?", "options": {"A": "Quốc hội", "B": "Viện kiểm sát", "C": "Tòa án Nhân dân", "D": "Chính phủ"}, "answer": "C"}, {"id": 291, "de": "4", "q": "Nhân dân thực hiện quyền dân chủ qua những hình thức nào?", "options": {"A": "dân chủ công khai và không công khai", "B": "dân chủ xã hội chủ nghĩa vả tư sản", "C": "dân chủ trực tiếp và đại diện", "D": "dân chủ chủ nô và tư sản"}, "answer": "C"}, {"id": 292, "de": "4", "q": "Nhà nước pháp quyền xã hội chủ nghĩa Việt Nam mang bản chất của giai cấp nào?", "options": {"A": "Giai cấp nông dân", "B": "Giai cấp công nông", "C": "Giai cấp công nhân", "D": "Giai cấp trí thức"}, "answer": "C"}, {"id": 293, "de": "4", "q": "Chọn cụm từ thích hợp điền vào chỗ trống: Hiến pháp năm 2013 đã khẳng định:\"Quyền lực nhà nước là thống nhất, có sự phân công, phối hợp, kiểm soát giữa các cơ quan nhà nước trong việc thực hiện các quyền …...\".", "options": {"A": "lập pháp, hành pháp, tư pháp.", "B": "làm chủ của nhân dân", "C": "lập pháp, hành pháp và tư pháp", "D": "lập pháp, hành pháp"}, "answer": "A"}, {"id": 294, "de": "5", "q": "Chọn đáp án điền vào chỗ trống đúng với quan đểm của Đảng ta về đường lối quốc phòng, an ninh: Kết hợp sức mạnh dân tộc với sức mạnh thời đại, tranh thủ sự ủng hộ của.....", "options": {"A": "các nước trong khu vực Đông Nam Á", "B": "nhân dân yêu chuộng hòa bình trên thế giới", "C": "người Việt Nam ở nước ngoài", "D": "bạn bè quốc tế"}, "answer": "B"}, {"id": 295, "de": "5", "q": "Ai là Bộ trưởng Bộ ngoại giao đầu tiên của Việt Nam?", "options": {"A": "Hồ Chí Minh", "B": "Trần Phú", "C": "Lê Hồng Phong", "D": "Võ Nguyên Giáp"}, "answer": "A"}, {"id": 296, "de": "5", "q": "Điền vào chỗ trống cho đúng với quan điểm chỉ đạo hội nhập quốc tế của Đảng ta, hội nhập........ là trọng tâm, hội nhập trong các lĩnh vực khác phải tạo thuận lợi cho hội nhập kinh tế và góp phần tích cực vào phát triển kinh tế.", "options": {"A": "Kinh tế", "B": "Chính trị", "C": "Văn hóa", "D": "Xã hội"}, "answer": "A"}, {"id": 297, "de": "5", "q": "Định hướng chiến lược lớn của Đảng nhằm thực hiện thắng lợi nhiệm vụ xây dựng và bảo vệ Tổ quốc Việt Nam xã hội chủ nghĩa là:", "options": {"A": "Chủ động và tích cực hội nhập quốc tế", "B": "Tăng cường quốc phòng, giữ vững an ninh quốc gia, trật tự an toàn xã hội", "C": "Phát triển kinh tế gắn với đảm bảo quốc phòng, an ninh", "D": "Thực hiện nhất quán đường lối đối ngoại độc lập, tự chủ, hòa bình, hợp tác và phát triển"}, "answer": "A"}, {"id": 298, "de": "5", "q": "Phương châm đối ngoại: “Việt Nam muốn là bạn với các nước trong cộng đồng thế giới phấn đấu vì hòa bình, độc lập và phát triển” được Đảng Cộng sản Việt Nam đưa ra tại đại hội Đảng lần thứ mấy?", "options": {"A": "Đại hội V (1982)", "B": "Đại hội VI (1986)", "C": "Đại hội VII (1991)", "D": "Đại hội VIII (1996)"}, "answer": "C"}, {"id": 299, "de": "5", "q": "Mục đích chính trong hoạt động đối ngoại của Việt Nam thời kỳ trước đổi mới (trước năm 1986) là?", "options": {"A": "Thu hút vốn đầu tư nước ngoài.", "B": "Nâng cao vị thế Việt Nam trên trường quốc tế.", "C": "Hàn gắn vết thương chiến tranh, khôi phục và phát triển kinh tế.", "D": "Thể hiện trách nhiệm của Việt Nam với cộng đồng thế giới."}, "answer": "C"}, {"id": 300, "de": "5", "q": "Quan điểm: \"Tăng cường quốc phòng, giữ vững an ninh quốc gia, ổn định chính trị, trật tự, an toàn xã hội\" có nhiệm vụ như thế nào của Đảng?", "options": {"A": "Then chốt", "B": "Trọng yếu, thường xuyên", "C": "Trọng tâm", "D": "Nền tảng"}, "answer": "B"}, {"id": 301, "de": "5", "q": "Những hạn chế về đối ngoại của Việt Nam giai đoạn 1975 - 1986 xuất phát từ nguyên nhân cơ bản nào?", "options": {"A": "Bệnh chủ quan, duy ý chí.", "B": "Lối suy nghĩ và hành động giản đơn.", "C": "Nóng vội chạy theo nguyện vọng chủ quan.", "D": "Tất cả các đáp án đều đúng."}, "answer": "D"}, {"id": 302, "de": "5", "q": "Điền vào chỗ trống cho đúng với báo cáo chính trị Đại hội XIII của Đảng (năm 2021): “Toàn cầu hóa và hội nhập quốc tế tiếp tục tiến triển nhưng đang phải đối mặt với sự trỗi dậy của...”", "options": {"A": "chủ nghĩa quốc tế", "B": "chủ nghĩa dân tộc", "C": "chủ nghĩa cực đoan", "D": "các nước tư bản"}, "answer": "B"}, {"id": 303, "de": "5", "q": "Chủ trương: “Chủ động và tích cực hội nhập quốc tế” được xác định từ Đại hội nào của Đảng?", "options": {"A": "Đại hội VII (1991)", "B": "Đại hội X (2006)", "C": "Đại hội XI (2011)", "D": "Đại hội XII (2016)"}, "answer": "C"}, {"id": 304, "de": "5", "q": "Một trong những nhiệm vụ chủ yếu của quốc phòng, an ninh mà Đảng ta đề ra hiện nay là:", "options": {"A": "Tăng cường tiềm lực quốc phòng và an ninh; xây dựng thế trận quốc phòng toàn dân, thế trận an ninh nhân dân vững chắc.", "B": "Chủ động đấu tranh làm thất bại mọi âm mưu, hoạt động chống phá của các thế lực thù địch;", "C": "Sẵn sàng ứng phó với các mối đe dọa an ninh truyền thống và phi truyền thống; bảo đảm an ninh, an toàn thông tin, an ninh mạng...", "D": "Tất cả các đáp án đều đúng"}, "answer": "D"}, {"id": 305, "de": "5", "q": "Phương hướng, nhiệm vụ trọng yếu theo quan điểm của Đảng về đường lối quốc phòng an ninh trong giai đoạn hiện nay là gì?", "options": {"A": "Củng cố quốc phòng, giữ vững an ninh quốc gia, ổn định chính trị, trật tự, an toàn xã hội.", "B": "Phát huy mạnh mẽ sức mạnh tổng hợp của toàn dân tộc, của cả hệ thống chính trị, tranh thủ tối đa sự đồng tình, ủng hộ của cộng đồng quốc tế để bảo vệ Tổ quốc.", "C": "Kiên quyết, kiên trì đấu tranh bảo vệ vững chắc Tổ quốc Việt Nam xã hội chủ nghĩa.", "D": "Tăng cường sự lãnh đạo tuyệt đối, trực tiếp về mọi mặt của Đảng, sự quản lý tập trung thống nhất của Nhà nước đối với Quân đội nhân dân và Công an nhân dân và sự nghiệp quốc phòng, an ninh."}, "answer": "D"}, {"id": 306, "de": "5", "q": "Việc làm nào dưới đây không thực hiện đúng nghĩa vụ bảo vệ Tổ quốc?", "options": {"A": "Đăng kí nghĩa vụ khi đến tuổi", "B": "Không chấp hành lệnh gọi nhập ngũ", "C": "Tham gia tập luyện quân sự ở trường học", "D": "Tham gia tuần tra ban đêm ở địa bàn dân cư"}, "answer": "B"}, {"id": 307, "de": "5", "q": "Chọn đáp án đúng: \"Nhà nước cộng hoà xã hội chủ nghĩa Việt Nam là nhà nước pháp quyền xã hội chủ nghĩa của ..., do...., vì..", "options": {"A": "công dân", "B": "giai cấp công nhân", "C": "nhân dân lao động", "D": "nhân dân"}, "answer": "D"}, {"id": 308, "de": "5", "q": "Một trong những quan điểm về tăng cường quốc phòng an ninh của Đảng ta đó là.", "options": {"A": "Hợp tác bình đằng cùng có lợi với tất cả các nước", "B": "Xây dựng và bảo vệ Tổ quốc", "C": "Đưa nước ta hội nhập với thế giới", "D": "Phát huy cao nhất sức mạnh tổng hợp của đất nước, nhất là vai trò của nhân đối với sự nghiệp bảo vệ Tổ quốc"}, "answer": "D"}, {"id": 309, "de": "5", "q": "Nhận định của Đảng ta về xu thế lớn của thế giới hiện nay là gì?", "options": {"A": "Hòa bình, độc lập dân tộc", "B": "Dân chủ", "C": "Hợp tác và phát triển", "D": "Tất cả các đáp án của câu này đều đúng"}, "answer": "D"}, {"id": 310, "de": "5", "q": "Theo nhận định của Đảng ta, cục diện thế giới hiện nay diễn ra theo xu hướng nào?", "options": {"A": "Đa cực, đa trung tâm", "B": "Đa chiều", "C": "Một cực duy nhất", "D": "Một trung tâm"}, "answer": "A"}, {"id": 311, "de": "5", "q": "Đại hội đại biểu toàn quốc lần thứ XIII của Đảng khẳng định, nhiệm vụ trọng yếu, thường xuyên của Đảng, Nhà nước, của cả hệ thống chính trị và toàn dân là nhiệm vụ nào?", "options": {"A": "Củng cố quốc phòng, giữ vững an ninh quốc gia", "B": "Củng cố quốc phòng, giữ vững an ninh quốc gia, ổn định chính trị, trật tự, an toàn xã hội", "C": "Củng cố quốc phòng, ổn định chính trị, trật tự, an toàn xã hội", "D": "Giữ vững an ninh quốc gia, ổn định chính trị, an toàn xã hội"}, "answer": "B"}, {"id": 312, "de": "5", "q": "Trong những phương hướng, nhiệm vụ quốc phòng, an ninh hiện nay được khẳng định trong Đại hội đại biểu toàn quốc lần thứ XIII của Đảng (2021), Đảng ta chủ trương giải quyết những bất đồng, tranh chấp bằng giải pháp nào?", "options": {"A": "Hòa bình trên cơ sở tôn trọng luật pháp quốc tế", "B": "Kiên quyết đấu tranh", "C": "Không khoan nhượng", "D": "Thương lượng"}, "answer": "A"}, {"id": 313, "de": "5", "q": "Trong quan điểm chỉ đạo hội nhập quốc tế hiện nay của Đảng, Đảng ta xác định hội nhập quốc tế là sự nghiệp của ai?", "options": {"A": "Toàn dân và cả hệ thống chính trị", "B": "Nhà nước", "C": "Toàn dân", "D": "Đảng"}, "answer": "A"}, {"id": 314, "de": "5", "q": "Việt Nam kí kết quan hệ ngoại giao với Nam Sudan vào ngày tháng năm nào?", "options": {"A": "21/2/2019", "B": "21/12/2019", "C": "12/2/2019", "D": "12/12/2019"}, "answer": "A"}, {"id": 315, "de": "5", "q": "Bộ chính trị đã phê duyệt \"Chiến lược Quốc phòng Việt Nam\" vào năm nào?", "options": {"A": "Năm 2017", "B": "Năm 2018", "C": "Năm 2019", "D": "Năm 2020"}, "answer": "B"}, {"id": 316, "de": "5", "q": "Nhiệm vụ trọng yếu, thường xuyên của Đảng, Nhà nước, của cả hệ thống chính trị và toàn dân được Đại hội đại biểu toàn quốc lần thứ XIII của Đảng khẳng định trong phương hướng, nhiệm vụ quốc phòng, an ninh hiện nay là gì?", "options": {"A": "Củng cố quốc phòng", "B": "Giữ vững anh ninh quốc gia", "C": "Ổn định chính trị, trật tự, an toàn xã hội", "D": "Tất cả các đáp án của câu này đều đúng"}, "answer": "D"}, {"id": 317, "de": "5", "q": "Lực lượng nào giữ vai trò nòng cốt trong việc củng cố quốc phòng, giữ vững an ninh quốc gia, ổn định chính trị, trật tự, an toàn xã hội ở nước ta?", "options": {"A": "Đảng Cộng sản", "B": "Quốc hội", "C": "Mặt trận tổ quốc", "D": "Quân đội nhân dân và công an nhân dân"}, "answer": "D"}, {"id": 318, "de": "5", "q": "\" Hợp tác bình đẳng, cùng có lợi với tất cả các nước trên cơ sở những nguyên tắc cơ bản của Hiến chương Liên hợp quốc và luật pháp quốc tế\". Quan điểm trên của Đảng ta thuộc lĩnh vực nào?", "options": {"A": "Kinh tế", "B": "Chính trị", "C": "Đối ngoại", "D": "Văn hóa"}, "answer": "C"}, {"id": 319, "de": "5", "q": "\"Quân đội ta trung với Đảng, hiếu với dân, sẵn sàng chiến đấu hy sinh vì độc lập, tự do của Tổ quốc, vì chủ nghĩa xã hội, nhiệm vụ nào cũng hoàn thành, khó khăn nào cũng vượt qua, kẻ thù nào cũng đáng thắng\". Câu nói trên của ai?", "options": {"A": "Hồ Chí Minh", "B": "Võ Nguyên Giáp", "C": "Nguyễn Phú Trọng", "D": "Nguyễn Xuân Phúc"}, "answer": "A"}, {"id": 320, "de": "5", "q": "Chọn cụm từ điền vào chỗ trống đúng với quan điểm của Đảng ta về đường lối đối ngoại: Hợp tác bình đẳng, cùng có lợi với tất cả các nước trên cơ sở những nguyên tắc cơ bản của Hiến chương Liên hợp quốc và …..", "options": {"A": "luật pháp Việt Nam", "B": "bình đẳng các bên cùng có lợi", "C": "không can thiệp vào công việc nội bộ của nhau", "D": "luật pháp quốc tế"}, "answer": "D"}, {"id": 321, "de": "5", "q": "Việt Nam gia nhập Liên Hợp Quốc vào ngày tháng năm nào?", "options": {"A": "20/09/1975", "B": "20/09/1976", "C": "20/09/1978", "D": "20/09/1977"}, "answer": "D"}, {"id": 322, "de": "5", "q": "Khu vực nào được xem là khu vực có nền kinh tế phát triển năng động nhất hiện nay?", "options": {"A": "Khu vực Châu Á - Thái Bình Dương", "B": "Khu vực Nam Á", "C": "Khu vực Trung Đông", "D": "Khu vực Bắc Phi"}, "answer": "A"}, {"id": 323, "de": "5", "q": "Nền quốc phòng và an ninh nước ta được gọi như thế nào?", "options": {"A": "Nền quốc phòng toàn dân và an ninh nhân dân", "B": "Nền quốc phòng toàn dân vững mạnh", "C": "Nền quốc phòng và an ninh nhân dân", "D": "Nền quốc phòng khu vực"}, "answer": "A"}, {"id": 324, "de": "5", "q": "Việt Nam tích cực tham gia vào các diễn đàn và hoạt động của nhân dân thế giới là thể hiện nội dung nào?", "options": {"A": "Tăng cường quan hệ với các đảng phái, tổ chức chính trị thế giới", "B": "Mở rộng quan hệ đối ngoại", "C": "Phát triển công tác đối ngoại nhân dân", "D": "Chủ động tham gia vào tiến trình hợp tác quốc tế và khu vực"}, "answer": "C"}, {"id": 325, "de": "5", "q": "Tăng cường quốc phòng, giữ vững an ninh quốc gia, trật tự, an toàn xã hội là nhiệm vụ trọng yếu, thường xuyên của Đảng, Nhà nước và toàn dân, trong đó lực lương nào giữ vai trò là lực lượng nòng cốt?", "options": {"A": "Giai cấp công nhân", "B": "Giai cấp nông dân", "C": "Tầng lớp trí thức", "D": "Quân đội nhân dân và công an nhân dân"}, "answer": "D"}, {"id": 326, "de": "5", "q": "Hội nhập quốc tế là sự nghiệp của ai?", "options": {"A": "Toàn dân và của cả hệ thống chính trị", "B": "Đảng và Nhà nước", "C": "Giai cấp công nhân", "D": "Bộ ngoại giao"}, "answer": "A"}, {"id": 327, "de": "5", "q": "Khu vực nào của Châu Á - Thái Bình Dương được xem là trung tâm phát triển năng động, có vị trí địa kinh tế - chính trị chiến lược ngày càng quan trọng trên thế giới ?", "options": {"A": "Khu vực Đông Nam Á", "B": "Khu vực Tây Nam Á", "C": "Khu vực Đông Bắc Á", "D": "Khu vực Tây Bắc Á"}, "answer": "A"}, {"id": 328, "de": "5", "q": "Việt Nam là thành viên tích cực của tổ chức quốc tế nào sau đây ?", "options": {"A": "OPEC", "B": "ASEAN", "C": "EU", "D": "NATO"}, "answer": "B"}, {"id": 329, "de": "5", "q": "Hoạt động chủ yếu của các thế lực thù địch nhằm chống phá nước ta trong giai đoạn hiện nay đó là ?", "options": {"A": "Khủng bố", "B": "Chiến tranh", "C": "Diễn biến hòa bình", "D": "Cấm vận"}, "answer": "C"}, {"id": 330, "de": "5", "q": "Một trong bốn nguy cơ mà Đảng chỉ ra đối với cách mạng nước ta đó là", "options": {"A": "Bùng nổ dân số ở nước ta", "B": "Biến đổi khí hậu", "C": "Tụt hậu xa hơn về kinh tế", "D": "Năng suất lao động thấp"}, "answer": "C"}, {"id": 331, "de": "5", "q": "\"Củng cố quốc phòng, giữ vững an ninh quốc gia, ổn định chính trị, trật tự, an toàn xã hội là .........., thường xuyên của Đảng, Nhà nước, của cả hệ thống chính trị và toàn dân, trong đó Quân đội nhân dân và Công an nhân dân là nòng cốt\"", "options": {"A": "Nhiệm vụ chiến lược", "B": "Nhiệm vụ quan trọng", "C": "Nhiệm vụ cấp bách", "D": "Nhiệm vụ trọng yếu"}, "answer": "D"}, {"id": 332, "de": "5", "q": "Đại hội Đảng lần thứ XII xác định, đối với nhiệm vụ quốc phòng, an ninh và sự nghiệp bảo vệ Tổ quốc Đảng cộng sản Việt Nam đóng vai trò gì ?", "options": {"A": "Lãnh đạo và quản lý về mọi mặt", "B": "Lãnh đạo và quản lý", "C": "Lãnh đạo tuyệt đối, trực tiếp về mọi mặt", "D": "Chỉ đạo trực tiếp và quản lý mọi mặt"}, "answer": "C"}, {"id": 333, "de": "5", "q": "Nội dung nào phù hợp với quan điểm về đường lối đối ngoại của Đảng ta được Đại hội Đảng lần thứ XII xác định ?", "options": {"A": "Đường lối đối ngoại tự chủ, hòa bình, hợp tác và phát triển kinh tế", "B": "Đường lối đối ngoại độc lập, tự do, dân chủ, hợp tác và phát triển bền vững", "C": "Đường lối đối ngoại độc lập, hòa bình, hợp tác và phát triển", "D": "Đường lối đối ngoại độc lập, tự chủ, hòa bình, hợp tác và phát triển"}, "answer": "D"}, {"id": 334, "de": "5", "q": "Để thực hiện được các mục tiêu và nhiệm vụ đối ngoại, Đại hội Đảng lần thứ XIII xác định trong hội nhập quốc tế Việt Nam cần phải", "options": {"A": "Biết tranh thủ thời cơ", "B": "Nhanh chóng, kịp thời", "C": "Chủ động và tích cực hội nhập quốc tế", "D": "Mềm dẻo và linh hoạt"}, "answer": "C"}, {"id": 335, "de": "5", "q": "Trong quan điểm đối ngoại của mình Đảng xác định Việt Nam là gì trong quan hệ với cộng đồng quốc tế ?", "options": {"A": "Là bạn", "B": "Là đối tác tin cậy", "C": "Là thành viên có trách nhiệm", "D": "Là bạn, là đối tác tin cậy và thành viên có trách nhiệm"}, "answer": "D"}, {"id": 336, "de": "5", "q": "Đối ngoại giữ vai trò như thế nào trong việc tạo dựng và gìn giữ môi trường hòa bình, ổn định huy động các nguồn lực                  \nChâu Á- Thái bình dương trong đó khu vực……tiếp tục là trung tâm phát triển năng động,có vị trí địa kinh tế- chính tri chiến lược ngày càng quan trọng trên thế giới.", "options": {"A": "Quan trọng", "B": "Tiên phong", "C": "Chủ yếu", "D": "Trọng yếu"}, "answer": "A"}, {"id": 337, "de": "5", "q": "Phương hướng, nhiệm vụ của quốc phòng, an ninh là", "options": {"A": "Kiên quyết kiên trì đấu tranh bảo vệ chủ quyền", "B": "Tăng cường tiềm lực QPAN", "C": "Tăng cường sự lãnh đạo trực tiếp mọi mặt của Đảng", "D": "Tất cả đều đúng"}, "answer": "D"}, {"id": 338, "de": "5", "q": "Chủ động hội nhập kinh tế quốc tế trong quan hệ đối ngoại được hiểu là:", "options": {"A": "Hoàn toàn chủ động quyết định đường lối, chính sách hội nhập kinh tế quốc tế", "B": "Là việc thực hiện đối ngoại với nhiều bên cùng một lúc.", "C": "Có quan hệ với tất cả các nước", "D": "Chủ động quyết định đường lối đối ngoại"}, "answer": "A"}, {"id": 339, "de": "5", "q": "Hiện nay, tổ chức nào giữ vai trò quản lý hoạt động đối ngoại ở nước ta?", "options": {"A": "Đảng Cộng sản Việt Nam", "B": "Chính phủ", "C": "Quốc hội", "D": "Nhà nước"}, "answer": "B"}, {"id": 340, "de": "5", "q": "Chọn đáp án đúng nhất", "options": {"A": "Bảo đảm an ninh trên các lĩnh vực, kiềm chế gia tăng tội phạm, tạo sự chuyển biến rõ rệt về trật tự xã hội", "B": "Bảo đảm an ninh trên các lĩnh vực, tạo sự chuyển biến rõ rệt về trật tự xã hội", "C": "Bảo đảm an ninh trên các lĩnh vực, kiềm chế gia tăng tội phạm", "D": "Kiềm chế gia tăng tội phạm, tạo sự chuyển biến rõ rệt về trật tự xã hội"}, "answer": "A"}, {"id": 341, "de": "5", "q": "“Kiên quyết, kiên trì đấu tranh bảo vệ độc lập, chủ quyền, thống nhất và toàn vẹn lãnh thổ, bảo vệ vững chắc biên giới và chủ quyền biển, đảo, vùng trời của Tổ quốc; đồng thời giữ vững môi trường hòa bình, ổn định để phát triển bền vững đất nước\" Nội dung này thể hiện trong văn hiện nào của Đảng?", "options": {"A": "Văn kiện Đại hội Đảng toàn quốc lần thứ VII", "B": "Văn kiện Đại hội Đảng toàn quốc lần thứ VIII", "C": "Văn kiện Đại hội Đảng toàn quốc lần thứ IX", "D": "Văn kiện Đại hội Đảng toàn quốc lần thứ XII"}, "answer": "D"}, {"id": 342, "de": "5", "q": "Việt Nam trở thành thanh viên của diễn đàn kinh tế Châu Á- TBD vào thời gian nào?", "options": {"A": "14/11/1998", "B": "11/11/1998", "C": "14/11/1999", "D": "11.11.1999"}, "answer": "A"}, {"id": 343, "de": "5", "q": "Nội dung nào sau đây thể hiện là nhiệm vụ chủ yếu của quốc phòng, an ninh?\na. Chiến thắng vẻ vang, lực lượng cách mạng", "options": {"A": "Chủ động đấu tranh làm thất bại mọi âm mưu, hoạt động chống phá của các thế lực thù địch; ngăn chặn, phản bác những thông tin, luận điệu sai trái, đẩy lùi các loại tội phạm và tệ nạn xã hội.", "B": "Tập trung xây dựng và phát triển con người Việt Nam, con người là trung tâm của chiến lược phát triển, đồng thời là chủ thể phát triển.", "C": "Phát huy mạnh mẽ sức mạnh tổng hợp của toàn dân tộc, của cả hệ thống chính trị, tranh thủ tối đa sự đồng tình, ủng hộ của cộng đồng quốc tế để bảo vệ Tổ quốc."}, "answer": "A"}, {"id": 344, "de": "5", "q": "Trong bối cảnh mở rộng quan hệ đối ngoại và hội nhập quốc tế hiện nay, Việt Nam đang đối mặt với những khó khăn, thách thức nào?", "options": {"A": "Kinh tế vĩ mô ổn định chưa vững chắc", "B": "Nợ công tăng nhanh", "C": "Sức cạnh tranh kinh tế thấp.", "D": "Tất cả các đáp án của câu này đều đúng"}, "answer": "D"}, {"id": 345, "de": "5", "q": "Trong bối cảnh mở rộng quan hệ đối ngoại và hội nhập quốc tế hiện nay, Việt Nam đang đối mặt với những khó khăn, thách thức nào?", "options": {"A": "Kinh tế vĩ mô ổn định chưa vững chắc", "B": "Nợ công tăng nhanh", "C": "Sức cạnh tranh kinh tế thấp.", "D": "Tất cả các đáp án của câu này đều đúng"}, "answer": "D"}, {"id": 346, "de": "5", "q": "Củng cố quốc phòng, giữ vững an ninh quốc gia, ổn định chính trị, trật tự, an toàn xã hội là nhiệm vụ trọng yếu, thường xuyên của Đảng, Nhà nước, của cả hệ thống chính trị và toàn dân, trong đó …... là nòng cốt", "options": {"A": "Quân đội nhân dân", "B": "Công an nhân dân", "C": "Lực lượng dân quân", "D": "Quân đội nhân dân và Công an nhân dân"}, "answer": "D"}, {"id": 347, "de": "5", "q": "Theo quan điểm chỉ đạo hội nhập quốc tế của Đảng ta, hội nhập quốc tế nhằm:", "options": {"A": "Củng cố môi trường hòa bình, tranh thủ tối đa các điều kiện quốc tế thuận lợi để phát triển đất nước", "B": "Quảng bá hình ảnh Việt Nam, bảo tồn và phát huy bản sắc dân tộc", "C": "Góp phần tích cực vào sự nghiệp hòa bình, độc lập dân tộc, dân chủ và tiến bộ xã hội trên thế giới", "D": "Tất cả các đáp án đều đúng"}, "answer": "D"}, {"id": 348, "de": "5", "q": "Việt Nam chính thức gia nhập ASEAN vào ngày tháng năm nào?", "options": {"A": "28/07/1995", "B": "27/08/1995", "C": "28/07/1994", "D": "27/08/1994"}, "answer": "A"}, {"id": 349, "de": "5", "q": "Việt Nam chính thức trở thành thành viên của tổ chức thương mại thế giới (WTO )vào thời gian nào?", "options": {"A": "11/01/2007", "B": "01/11/2007", "C": "11/01/2008", "D": "01/11/2008"}, "answer": "A"}, {"id": 350, "de": "5", "q": "Đại hội XII của Đảng tiếp tục khẳng định một trong những định hướng lớn trong quan hệ đối ngoại của Đảng là:", "options": {"A": "Đa dạng hóa, đa phương hóa trong quan hệ đối ngoại", "B": "Chủ động và tích cực hội nhập quốc tế", "C": "Là bạn, là đối tác tin cậy và thành viên có trách nhiệm của cộng đồng quốc tế", "D": "Đa dạng hóa, đa phương hóa trong quan hệ đối ngoại; chủ động và tích cực hội nhập quốc tế; là bạn, là đối tác tin cậy và thành viên có trách nhiệm của cộng đồng quốc tế"}, "answer": "D"}, {"id": 351, "de": "5", "q": "Văn kiện nào xác định nhiệm vụ chủ yếu đường lối đối ngoại của Đảng là: \"Giữ vững môi trường hòa bình, thuận lợi cho đẩy mạnh công nghiệp hóa, hiện đại hóa, bảo vệ vững chắc độc lập, chủ quyền, thống nhất và toàn vẹn lãnh thổ; nâng cao vị thế của đất nước; góp phần tích cực vào cuộc đấu tranh vì hòa bình, độc lập dân tộc, dân chủ và tiến bộ xã hội trên thế giới\"?", "options": {"A": "Văn kiện Đại hội lần IX", "B": "Văn kiện Đại hội lần X", "C": "Văn kiện Đại hội lần XI", "D": "Văn kiện Đại hội lần XII"}, "answer": "C"}, {"id": 352, "de": "5", "q": "Chọn đáp án đúng điền vào chỗ trống cho đúng với định hướng lớn về quốc phòng an ninh của Đảng ta hiện nay:Tăng cường quốc phòng, giữ vững an ninh quốc gia, trật tự, an toàn xã hội là nhiệm vụ trọng yếu, thường xuyên của Đảng, Nhà nước và toàn dân, trong đó Quân đội nhân dân và công an nhân dân là lực lượng ....... Chủ động, tăng cường hợp tác quốc tế về quốc phòng, an ninh.", "options": {"A": "Quan trọng", "B": "Quyết định", "C": "Quan trọng và quyết định", "D": "Nòng cốt"}, "answer": "D"}, {"id": 353, "de": "6", "q": "Nhà nước của nhân dân, do nhân dân, vì nhân dân quản lí mọi mặt của đời sống xã hội bằng pháp luật, do Đảng cộng sản Việt Nam lãnh đạo được gọi là nhà nước gì?", "options": {"A": "Nhà nước dân chủ cộng hòa", "B": "Nhà nước pháp quyền", "C": "Nhà nước pháp quyền xã hội chủ nghĩa", "D": "Nhà nước pháp quyền xã hội chủ nghĩa Việt Nam"}, "answer": "C"}, {"id": 354, "de": "6", "q": "Các mục tiêu dân giàu, nước mạnh, xã hội dân chủ, công bằng, văn minh có quan hệ với nhau như thế nào?", "options": {"A": "Tách rời nhau", "B": "Bổ sung cho nhau", "C": "Thống nhất với nhau", "D": "Tất cả các đáp án của câu này đều sai"}, "answer": "C"}, {"id": 355, "de": "6", "q": "Chủ trương “ hòa nhập nhưng không hoà tan” trong tiến trình hội nhập với văn hóa thế giới thể hiện đặc trưng cơ bản nào dưới đây của chủ nghĩa xã hội ở nước ta?", "options": {"A": "Là một xã hộ dân giàu, nước mạnh, dân chủ, công bằng, văn minh", "B": "Do nhân dân làm chủ", "C": "Có quan hệ hữu nghị và hợp tác với nhân dân các nước trên thế giới", "D": "Có nền văn hóa tiên tiến, đậm đà bản sắc dân tộc"}, "answer": "D"}, {"id": 356, "de": "6", "q": "Có nền kinh tế phát triển cao dựa trên lực lượng sản xuất hiện đại và quan hệ sản xuất tiến bộ phù hợp là thể hiện nội dung nào sau đây của chủ nghĩa xã hội mà nước ta đang xây dựng?", "options": {"A": "Đặc trưng", "B": "Tính chất", "C": "Nội dung", "D": "Ý nghĩa"}, "answer": "A"}, {"id": 357, "de": "6", "q": "Một trong những đặc trưng cơ bản của chủ nghĩa xã hội ở Việt Nam là gì?", "options": {"A": "Do nhân dân làm chủ", "B": "Do tầng lớp trí thức làm chủ", "C": "Do công đoàn làm chủ", "D": "Do cán bộ là chủ"}, "answer": "A"}, {"id": 358, "de": "6", "q": "Theo quan điểm của Đảng Cộng sản Việt Nam, Nhà nước pháp quyền xã hội chủ nghĩa là nhà nước quản lý, điều hành đất nước và xã hội bằng pháp luật nhằm thể hiện?", "options": {"A": "Quyền dân chủ trực tiếp và gián tiếp của nhân dân", "B": "Quyền lực của nhân dân", "C": "Quyền làm chủ của nhân dân", "D": "Quyền lợi và ý chí của nhân dân"}, "answer": "C"}, {"id": 359, "de": "6", "q": "Theo quan điểm của Đảng Cộng sản Việt Nam tại Đại hội đại biểu toàn quốc lần thứ XII, đại đoàn kết toàn dân tộc là?", "options": {"A": "Đường lối chiến lược của cách mạng nước ta.", "B": "Động lực trong xây dựng vả bảo vệ Tổ quốc", "C": "Nguồn lực to lớn trong xây dựng và bảo vệ Tổ quốc", "D": "Tất cả các đáp án đều đúng"}, "answer": "D"}, {"id": 360, "de": "6", "q": "Mục tiêu chiến lược, lâu dài mà Đảng và nhân dân ta quyết tâm thực hiện là gì?", "options": {"A": "Việt Nam là nước công nghiệp phát triển, thu nhập cao", "B": "Các dân tộc trong cộng đồng Việt Nam bình đẳng, đoàn kết, tôn trọng và giúp đỡ nhau cùng phát triển", "C": "Dân giàu, nước mạnh, dân chủ, công bằng, văn minh", "D": "Con người có cuộc sống ấm no, tự do, hạnh phúc, có điều kiện phát triển toàn diện"}, "answer": "C"}, {"id": 361, "de": "6", "q": "xây dựng đất nước trong thời kỳ quá độ lên chủ nghĩa xã hội ( bổ sung, triển năm 2011) bổ sung thêm đặc trưng nào của chủ nghĩa xã hội ở Việt Nam trong các đặc trưng sau so với Cương lĩnh năm 1991?", "options": {"A": "Có quan hệ hữu nghị và hợp tác với các nước trên thế giới", "B": "Các cộng đồng trong dân tộc Việt Nam bình đẳng, đoàn kết, tôn trọng và giúp đỡ nhau cùng phát triển.", "C": "Có Nhà nước pháp quyền xã hội chủ nghĩa Việt Nam của nhân dân, do nhân dân, vì nhân dân do Đảng Cộng sản lãnh đạo.", "D": "Có nền văn hóa tiên tiến, đậm đà bản sắc dân tộc"}, "answer": "C"}, {"id": 362, "de": "6", "q": "\"Nước Việt Nam là một, dân tộc Việt Nam là một. Sông có thể cạn, núi có thể mòn nhưng chân lý ấy không bao giờ thay đổi\". Câu nói trên của Chủ tịch Hồ Chí Minh nói tới lần đầu tiên vào năm nào?", "options": {"A": "1958", "B": "1959", "C": "1960", "D": "1961"}, "answer": "A"}, {"id": 363, "de": "6", "q": "Con đường quá độ lên chủ nghĩa xã hội ở Việt Nam được Đảng ta xác định từ khi nào?", "options": {"A": "Từ khi Đảng ta ra đời năm 1930", "B": "Từ năm 1945", "C": "Từ năm 1954", "D": "Từ năm 1975"}, "answer": "A"}, {"id": 364, "de": "6", "q": "Cương lĩnh xây dựng đất nước trong thời kỳ quá độ lên chủ nghĩa xã hội được Đảng ta nêu ra tại Đại hội Đảng toàn quốc lần thứ mấy?", "options": {"A": "Đại hội IV (1976).", "B": "Đại hội VI (1986).", "C": "Đại hội VII (1991).", "D": "Đại hội VIII (1996)."}, "answer": "C"}, {"id": 365, "de": "6", "q": "Muốn xây dựng chủ nghĩa xã hội phải có những con người xã hội chủ nghĩa. Câu nói trên của ai?", "options": {"A": "C Mác", "B": "Ph Ăngghen", "C": "Hồ Chí Minh", "D": "V I Lênin"}, "answer": "C"}, {"id": 366, "de": "6", "q": "Theo quan điểm của Đảng ta tại Đại hội đại biểu toàn quốc lần thứ XI, Nhà nước pháp quyền xã hội chủ nghĩa là:", "options": {"A": "Nhà nước của dân, do dân, vì dân, thể hiện quyền làm chủ của nhân dân; tổ chức và hoạt động trên cơ sở Hiến pháp, tôn trọng và bảo vệ Hiến pháp", "B": "Nhà nước tổ chức và hoạt động trên cơ sở Hiến pháp, tôn trọng và bảo vệ Hiến pháp", "C": "Nhà nước của nhân dân thể hiện quyền làm chủ của nhân dân; tổ chức và hoạt động trên cơ sở Hiến pháp, tôn trọng và bảo vệ Hiến", "D": "Nhà nước của nhân dân, thể hiện quyền làm chủ của nhân"}, "answer": "A"}, {"id": 367, "de": "6", "q": "Theo Cương lĩnh xây dựng đất nước trong thời kỳ quá độ lên chủ nghĩa xã hội (bổ sung, phát triển năm 2011) của Đảng ta, đặc trưng nào là mục tiêu chiến lược, lâu dài mà Đảng và nhân dân ta quyết tâm thực hiện?", "options": {"A": "Dân giàu, nước mạnh, dân chủ, công bằng, văn minh", "B": "Do nhân dân làm chủ", "C": "Có nền kinh tế tiên tiến đậm đà bản sắc dân tộc", "D": "Các dân tộc trong cộng đồng Việt Nam bình đẳng, đoàn kết, tôn trọng và giúp đỡ nhau cùng phát triển"}, "answer": "A"}, {"id": 368, "de": "6", "q": "Cương lĩnh xây dựng đất nước trong thời kỳ quá độ lên chủ nghĩa xã hội (bổ sung, phát triển năm 2011) của Đảng ta tại Đại hội đại biểu toàn quốc lần thứ XI chỉ ra mấy đặc trưng cơ bản của Chủ nghĩa xã hội?", "options": {"A": "6", "B": "7", "C": "8", "D": "9"}, "answer": "C"}, {"id": 369, "de": "6", "q": "Theo quan điểm của Đảng tại Đại hội đại biểu toàn quốc lần thứ XI, Nhà nước pháp quyền xã hội chủ nghĩa là nhà nước thể hiện quyền làm chủ của ai?", "options": {"A": "Nhân dân", "B": "Công - nông", "C": "Công - nông- trí thức", "D": "Tất cả mọi người"}, "answer": "A"}, {"id": 370, "de": "6", "q": "Cương lĩnh xây dựng đất nước trong thời kỳ quá độ lên chủ nghĩa xã hội được thông qua tại Đại hội VII (1991), Đảng ta xác định mô hình xã hội xã hội chủ nghĩa ở Việt Nam gồm mấy đặc trưng cơ bản?", "options": {"A": "5", "B": "6", "C": "7", "D": "8"}, "answer": "B"}, {"id": 371, "de": "6", "q": "Trong Cương lĩnh xây dựng đất nước trong thời kỳ quá độ lên chủ nghĩa xã hội (bổ sung, phát triển năm 2011), tại đặc trưng thứ mấy của chủ nghĩa xã hội ở Việt Nam, Đảng ta coi việc tiếp tục xây dựng, hoàn thiện Nhà nước pháp quyền xã hội chủ nghĩa do Đảng lãnh đạo là nhiệm vụ trọng tâm của đổi mới hệ thống chính trị?", "options": {"A": "5", "B": "6", "C": "7", "D": "8"}, "answer": "C"}, {"id": 372, "de": "6", "q": "Theo quan điểm của Đảng ta trong Cương lĩnh xây dựng đất nước trong thời kỳ quá độ lên chủ nghĩa xã hội (bổ sung, phát triển năm 2011), để xây dựng lực lượng sản xuất hiện đại ta cần phải làm gì?", "options": {"A": "Phát triển khoa học và công nghệ", "B": "Phát triển kinh tế tri thức", "C": "Đào tạo nguồn nhân lực chất lượng cao", "D": "Phát triển khoa học và công nghệ, phát triển kinh tế tri thức gắn với đào tạo nguồn nhân lực chất lượng cao, có kỹ thuật, có kỷ luật, có năng suất cao đảm bảo cho sự phát triển kinh tế bền vững"}, "answer": "D"}, {"id": 373, "de": "6", "q": "Điền vào chổ còn trống: Đảng lãnh đạo hệ thống chính trị, đồng thời là… của hệ thống ấy.", "options": {"A": "bộ phận", "B": "thành viên", "C": "tổ chức", "D": "cơ quan"}, "answer": "A"}, {"id": 374, "de": "6", "q": "Chọn đáp án đúng điền vào chổ trống: Mục tiêu chiến lược, lâu dài mà Đảng và nhân dân ta quyết tâm thực hiện là \" Dân giàu, nước mạnh,……, công bằng, văn minh\"", "options": {"A": "độc lập", "B": "hạnh phúc", "C": "tự do", "D": "dân chủ"}, "answer": "D"}, {"id": 375, "de": "6", "q": ": Theo tinh thần Đại hội lần thứ XI của Đảng (1-2011), trong đổi mới hệ thống chính trị, việc tiếp tục xây dựng, hoàn thiện Nhà nước pháp quyền xã hội chủ nghĩa do Đảng lãnh đạo là nhiệm vụ như thế nào?", "options": {"A": "Trọng tâm", "B": "Then chốt", "C": "Thường xuyên", "D": "Quan trọng"}, "answer": "A"}, {"id": 376, "de": "6", "q": ": Nhà nước ta là Nhà nước pháp quyền xã hội chủ nghĩa của nhân dân, do nhân dân, vì nhân dân. Tất cả quyền lực Nhà nước thuộc về nhân dân mà nền tảng là liên minh giữa những giai cấp nào sau đây?", "options": {"A": "Giai cấp công nhân với giai cấp nông dân và đội ngũ trí thức", "B": "Giai cấp công nhân với giai cấp nông dân", "C": "Giai cấp tư sản với giai cấp nông dân", "D": "Giai cấp công nhân với đội ngũ trí thức"}, "answer": "A"}, {"id": 377, "de": "6", "q": "Cương lĩnh xây dựng đất nước trong thời kỳ quá độ lên chủ nghĩa xã hội (bổ sung, phát triển năm 2011) do Đại hội lần thứ XI của Đảng (1-2011) thông qua khẳng định: Đi lên chủ nghĩa xã hội là:", "options": {"A": "Khát vọng của nhân dân ta", "B": "Sự lựa chọn đúng đắn của Đảng Cộng sản Việt Nam và Chủ tịch Hồ Chí Minh", "C": "Phù hợp với xu thế phát triển của lịch sử", "D": "Tất cả các đáp án của câu này đều đúng"}, "answer": "D"}, {"id": 378, "de": "6", "q": "Lần đầu tiên Đảng ta sử dụng thuật ngữ \" Nhà nước pháp quyền xã hội chủ nghĩa\" trong Hội nghị đại biểu toàn quốc lần thứ mấy?", "options": {"A": "Hội nghị trung ương 7 khóa VII", "B": "Hội nghị trung ương 7 khóa X", "C": "Hội nghị đại biểu toàn quốc giữa nhiệm kỳ khóa 7 (1994)", "D": "Hội nghị trung ương 6 khóa XI"}, "answer": "C"}, {"id": 379, "de": "6", "q": ": Yếu tố nào sau đây vừa là bản chất của chế độ ta, vừa là mục tiêu vừa là động lực của sự phát triển đất nước?", "options": {"A": "Dân chủ xã hội chủ nghĩa", "B": "Công bằng xã hội", "C": "Bình đẳng xã hội", "D": "Dân giàu, nước mạnh"}, "answer": "A"}, {"id": 380, "de": "6", "q": "Câu nói: “Sự phát triển tự do của mỗi người là điều kiện cho sự phát triển tự do của tất cả mọi người” được C.Mác và Ph.Ăng-ghen nêu ra trong tác phẩm nào?", "options": {"A": "Tuyên ngôn của Đảng cộng sản", "B": "Hệ tư tưởng Đức", "C": "Bản thảo kinh tế - triết học", "D": "Luận cương về Phoiơbắc"}, "answer": "A"}, {"id": 381, "de": "6", "q": "Kinh tế thị trường định hướng xã hội chủ nghĩa được xác định là mô hình kinh tế như thế nào trong suốt thời kỳ quá độ lên chủ nghĩa xã hội?", "options": {"A": "Mô hình kinh tế tổng quát", "B": "Mô hình kinh tế lâu dài", "C": "Mô hình kinh tế xuyên suốt", "D": "Mô hình kinh tế nổi bật"}, "answer": "A"}, {"id": 382, "de": "6", "q": "Cương lĩnh xây dựng đấy nước trong thời kỳ quá độ lên chủ nghĩa xã hội (bổ sung, phát triển năm 2011) của Đảng tại Đại hội đại biểu toàn quốc lần thứ mấy đã điều chỉnh, chuẩn hóa một số nội dung và cô đọng hóa một số đặc trưng của chủ nghĩa xã hội ở Việt Nam?", "options": {"A": "Đại hội đại biểu toàn quốc lần thứ VIII", "B": "Đại hội đại biểu toàn quốc lần thứ IX", "C": "Đại hội đại biểu toàn quốc lần thứ X", "D": "Đại hội đại biểu toàn quốc lần thứ XI"}, "answer": "D"}, {"id": 383, "de": "6", "q": "Chọn cụm từ thích hợp điền vào chỗ trống: Đảng là nhân tố quyết định thắng lợi của sự nghiệp cách mạng nước ta. Trong điều kiện hiện nay, nâng cao năng lực lãnh đạo và sức chiến đấu của Đảng là\".............\", có ý nghĩa sống còn đối với Đảng và sự nghiệp cách mạng của nhân dân ta. Thường xuyên tự đổi mới, tự chỉnh đốn phải dược coi là quy luật tồn tại và phát triển của Đảng", "options": {"A": "Nhiệm vụ thường xuyên", "B": "Nhiệm vụ lâu dài", "C": "Nhiệm vụ then chốt", "D": "Nhiệm vụ xuyên suốt"}, "answer": "C"}, {"id": 384, "de": "6", "q": "Theo Hồ Chí Minh, mục tiêu cao nhất của Chủ nghĩa xã hội là gì?", "options": {"A": "Xây dựng xã hội dân chủ.", "B": "Đáp ứng đầy đủ nhu cầu vật chất và tinh thần của nhân dân.", "C": "Không ngừng nâng cao đời sống của nhân dân.", "D": "Giải phóng giai cấp công nhân và nhân dân lao động."}, "answer": "C"}, {"id": 385, "de": "6", "q": "Nước ta quá độ lên chủ nghĩa xã hội theo hình thức nào dưới đây:", "options": {"A": "Quá độ trực tiếp", "B": "Quá độ gián tiếp", "C": "Quá độ nhảy vọt", "D": "Quá độ nửa trực tiếp"}, "answer": "B"}, {"id": 386, "de": "6", "q": "Tính đúng đắn của sự quá độ lên chủ nghĩa xã hội, bỏ qua chế độ tư bản chủ nghĩa ở nước ta được căn cứ vào cơ sở nào sau đây?", "options": {"A": "Phù hợp với điều kiện, hoàn cảnh của lịch sử dân tộc.", "B": "Chủ nghĩa tư bản có nhiều hạn chế.", "C": "Từ kinh nghiệm của các nước đi trước", "D": "Phù hợp với mong muốn của Đảng Cộng sản"}, "answer": "A"}, {"id": 387, "de": "6", "q": "Chiến lược nào nằm trong nội dung chiến lược phát triển bền vững của Đảng trong quá trình tiến hành công nghiệp hóa, hiện đại hóa gắn với phát triển kinh tế tri thức?", "options": {"A": "Bảo vệ môi trường", "B": "Tăng trưởng kinh tế nhanh", "C": "Thiết lập từng bước quan hệ sản xuất xã hội chủ nghĩa", "D": "Phát huy quyền làm chủ xã hội của nhân dân."}, "answer": "A"}, {"id": 388, "de": "6", "q": "Tính dân tộc của Nhà nước ta được thể hiện như thế nào dưới đây?", "options": {"A": "Nhà nước ta là Nhà nước của các dân tộc", "B": "Nhà nước chăm lo lợi ích mọi mặt cho các dân tộc ở Việt Nam", "C": "Mỗi dân tộc có bản sắc riêng của mình", "D": "Dân tộc nào cũng có chữ viết riêng"}, "answer": "C"}, {"id": 389, "de": "6", "q": "Tính nhân dân của Nhà nước ta thể hiện ở việc", "options": {"A": "Nhà nước ta là Nhà nước của nhân dân, do nhân dân, vì nhân dân", "B": "Nhà nước ta là Nhà nước của đại gia đình các dân tộc Việt Nam", "C": "Đời sống nhân dân ngày càng tốt hơn", "D": "Nhân dân tích cực lao động vì đất nước"}, "answer": "A"}, {"id": 390, "de": "6", "q": "Mục tiêu của chủ nghĩa xã hội ở Việt Nam là:", "options": {"A": "Dân giàu, nước mạnh", "B": "Dân chủ, công bằng", "C": "Văn minh", "D": "Tất cả các câu đều đúng"}, "answer": "D"}, {"id": 391, "de": "6", "q": "Đặc trưng \"Dân giàu, nước mạnh, dân chủ, công bằng, văn minh\" thể hiện sự khác nhau, sự tiến bộ hơn hẳn của chế độ Xã hội chủ nghĩa so với:", "options": {"A": "Chế độ xã hội Chiếm hữu nô lệ", "B": "Chế độ xã hội Phong kiến", "C": "Chế độ xã hội Tư bản chủ nghĩa", "D": "Tất cả đều đúng"}, "answer": "D"}, {"id": 392, "de": "6", "q": "Vì sao Việt Nam có mối quan hệ hữu nghị và hợp tác với tất cả các nước trên thế giới?", "options": {"A": "Đó là bản chất hòa hảo, thiện chí của dân tộc ta", "B": "Để tạo điều kiện cho việc hội nhập và tiếp thu các thành quả lẫn nhau", "C": "Tích lũy kinh nghiệm và rút ngắn quá trình phát triển của mỗi nước", "D": "Tất cả các câu đều đúng"}, "answer": "D"}, {"id": 393, "de": "6", "q": "Trong nền sản xuất nói chung cũng như nền sản xuất xã hội xã hội chủ nghĩa, lực lượng sản xuất quyết định:", "options": {"A": "Năng suất", "B": "Năng lực", "C": "Hiệu quả", "D": "Tất cả đều đúng"}, "answer": "A"}, {"id": 394, "de": "6", "q": "Điền vào chỗ trống: tiến bộ, khoa học và nhân văn là bản chất của xã hội…...", "options": {"A": "Tư bản chủ nghĩa", "B": "Con người đang xây dựng", "C": "Xã hội chủ nghĩa", "D": "Mà nhân loại đang hướng đến"}, "answer": "D"}, {"id": 395, "de": "6", "q": "Điền vào chỗ trống: nền kinh tế thị trường định hướng xã hội chủ nghĩa Việt Nam là nền kinh tế vận hành đầy đủ, đồng bộ theo các ... của kinh tế thị trường, đồng thời bảo đảm định hướng xã hội chủ nghĩa phù hợp với từng giai đoạn phát triển của đất nước. Chọn cụm từ đúng điền vào chỗ trống", "options": {"A": "Định hướng", "B": "Cơ chế", "C": "Quy luật", "D": "Xu hướng"}, "answer": "C"}, {"id": 396, "de": "6", "q": "Phát triển nền kinh tế thị trường hiện đại và hội nhập quốc tế, có sự quản lý của Nhà nước pháp quyền xã hội chủ nghĩa, do Đảng cộng sản Việt Nam lãnh đạo nhằm mục tiêu:", "options": {"A": "Dân giàu, nước mạnh, dân chủ, công bằng", "B": "Dân giàu, nước mạnh, dân chủ, công bằng, văn minh", "C": "Dân giàu, nước mạnh, xã hội, dân chủ, công bằng, văn minh", "D": "Dân giàu, nước mạnh, xã hội, công bằng, văn minh"}, "answer": "C"}, {"id": 397, "de": "6", "q": "Nền kinh tế thị trường định hướng xã hội chủ nghĩa ở Việt Nam là nền kinh tế như thế nào ?", "options": {"A": "Nền kinh tế quản lý theo kiểu tập trung, quan liêu bao cấp", "B": "Nền kinh tế hiện vật", "C": "Về thực chất là nền kinh tế thị trường tư bản chủ nghĩa", "D": "Nền kinh tế vận hành đầy đủ, đồng bộ theo các quy luật của kinh tế thị trường, đồng thời bảo đảm định hướng xã hội chủ nghĩa."}, "answer": "D"}, {"id": 398, "de": "6", "q": "Đặc trưng nào có tính tổng quát nhất, chi phối các đặc trưng khác bởi nó thể hiện mục tiêu của chủ nghĩa xã hội ở Việt Nam?", "options": {"A": "Con người có cuộc sống ấm no, tự do, hạnh phúc, có điều kiện phát triển toàn diện", "B": "Có nền kinh tế phát triển cao dựa trên lực lượng sản xuất hiện đại và quan hệ sản xuất tiến bộ phù hợp.", "C": "Do nhân dân làm chủ", "D": "Dân giàu, nước mạnh, dân chủ, công bằng, văn minh"}, "answer": "D"}, {"id": 399, "de": "6", "q": "Để thực hiện được đặc trưng có quan hệ hữu nghị và hợp tác với nhân dân các nước trên thế giới, Đảng ta vạch ra đường lối đối ngoại như thế nào?", "options": {"A": "Độc lập, tự chủ, hòa bình, hợp tác và phát triển;", "B": "Đa phương hóa, đa dạng hóa quan hệ, chủ động và tích cực hội nhập quốc tế;", "C": "Là bạn, đối tác tin cậy và thành viên có trách nhiệm trong cộng đồng quốc tế, vì lợi ích quốc gia, dân tộc, vì một nước Việt Nam xã hội chủ nghĩa giàu mạnh, văn minh.", "D": "Tất cả các đáp án của câu này đều đúng"}, "answer": "D"}, {"id": 400, "de": "6", "q": "Chủ trư Có sự phân công phan cấp", "C": "Đảm bảo sự chỉ đạo thống nhất của trung ương", "D": "Tất cả các đáp án của câu trên đều đúng"}, "answer": "A"}, {"id": 405, "de": "6", "q": "Những đặc trưng về chủ nghĩa xã hội mà nhân dân ta đang xây dựng được nêu trong văn kiện nào của Đảng lần đầu tiên?", "options": {"A": "Cương lĩnh xây dựng đất nước trơng thời kỳ quá độ lên chủ nghĩa xã hội 1991", "B": "Cương lĩnh xây dựng đất nước trong thời kỳ quá độ lên chủ nghĩa xã hội (bổ sung, phát triển năm 2011)", "C": "Cương lĩnh Chính trị đầu tiên của Đảng 1930", "D": "Chính cương Đảng Lao Động Việt Nam 1951"}, "answer": "A"}, {"id": 406, "de": "6", "q": "Theo Cương lĩnh xây dựng đất nước trong thời kỳ quá độ lên chủ nghĩa xã hội (bổ sung, phát triển năm 2011), Xây dựng chủ nghĩa xã hội ở nước ta nhằm mang đến cho con người điều gì ?", "options": {"A": "Cuộc sống giàu sang, phú quý", "B": "Cuộc sống ấm no, tự do, hạnh phúc, có điều kiện phát triển toàn diện", "C": "Cuộc sống ấm no, tự do, hạnh phúc", "D": "Cuộc sống như thiên đường"}, "answer": "B"}, {"id": 407, "de": "6", "q": "Điền vào chỗ trống để có nội dung đúng về đặc trưng của chủ nghĩa xã hội ở nước ta: \"Có nền kinh tế phát triển cao dựa trên ...............và quan hệ sản xuất tiến bộ phù hợp\"", "options": {"A": "Lực lượng sản xuất hiện đại", "B": "Kinh tế thị trường hiện đại", "C": "Khoa học kỹ thuật hiện đại", "D": "Lực lượng lao động chất lượng cao"}, "answer": "A"}, {"id": 408, "de": "6", "q": "Theo Cương lĩnh xây dựng đất nước trong thời kỳ quá độ lên chủ nghĩa xã hội (bổ sung, phát triển năm 2011) thì đặc trưng bình đẳng, đoàn kết, tôn trọng và giúp đỡ nhau cùng phát triển là thể hiện mối quan hệ của đối tượng nào ?", "options": {"A": "Người với người", "B": "Các quốc gia với nhau", "C": "Bạn bè với nhau", "D": "Các dân tộc trong cộng đồng Việt Nam"}, "answer": "D"}, {"id": 409, "de": "6", "q": "Điền vào chỗ trống để có nội dung đúng với một trong 8 đặc trưng về chủ nghĩa xã hội ở Việt Nam: \"Có Nhà nước........ xã hội chủ nghĩa của nhân dân, do nhân dân, vì nhân dân do Đảng Cộng sản lãnh đạo\"", "options": {"A": "Pháp quyền", "B": "Dân chủ", "C": "Cộng hòa", "D": "Quản lý"}, "answer": "A"}, {"id": 410, "de": "6", "q": "Theo Cương lĩnh xây dựng đất nước trong thời kỳ quá độ lên chủ nghĩa xã hội (bổ sung, phát triển năm 2011) Quan hệ giữa nước ta và các nước trên thế giới được xác định như thế nào ?", "options": {"A": "Quan hệ đoàn kết và hữu nghị", "B": "Quan hệ hữu nghị và hợp tác", "C": "Quan hệ đối tác hữu nghị, hợp tác toàn diện", "D": "Quan hệ bình đẳng, đoàn kết, tương trợ lẫn nhau"}, "answer": "B"}, {"id": 411, "de": "6", "q": "Trong phương hướng xây dựng xã hội xã hội chủ nghĩa ở Việt Nam, Đảng ta xác định đẩy mạnh công nghiệp hóa, hiện đại hóa đất nước gắn với yếu tố gì ?", "options": {"A": "Nhà nước pháp quyền xã hội chủ nghĩa", "B": "Phát triển kinh tế, bảo vệ tài nguyên, môi trường", "C": "Phát triển kinh tế tri thức, bảo vệ tài nguyên, môi trường", "D": "Thực hiện tiến bộ và công bằng xã hội"}, "answer": "C"}, {"id": 412, "de": "6", "q": "Đại hội Đảng lần thứ XII xác định, để nâng cao năng lực lãnh đạo và sức chiến đấu của Đảng thì nhiệm vụ nào phải đặt lên hàng đầu ?", "options": {"A": "Xây dựng đoàn kết trong Đảng", "B": "Xây dựng đạo đức trong Đảng", "C": "Đảng phải tự chỉnh đốn", "D": "Xây dựng Đảng trong sạch, vững mạnh"}, "answer": "D"}];</script>
<script>
/* ---------------- App logic ---------------- */

const DE_NAMES = {
  '1':'Đề 1 · Triết học / KTCT / CNXHKH',
  '2':'Đề 2 · Tư tưởng Hồ Chí Minh',
  '3':'Đề 3 · Đại đoàn kết dân tộc & LSĐ',
  '4':'Đề 4 · Pháp luật đại cương',
  '5':'Đề 5 · Quốc phòng An ninh & Ngoại giao',
  '6':'Đề 6 · CNXHKH - Đường lối phát triển'
};

let selectedCount = 50;
let selectedDes = new Set(Object.keys(DE_NAMES)); // all by default
let currentQuiz = []; // array of {id, q, options(shuffled array of [letter,text]), answer, userAnswer, de}

function shuffle(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]]=[a[j],a[i]];
  }
  return a;
}

function buildStatsAndOptions(){
  // stats
  const total = QUIZ_DATA.length;
  const desCount = new Set(QUIZ_DATA.map(q=>q.de)).size;
  const statsBox = document.getElementById('stats-boxes');
  statsBox.innerHTML = `
    <div class="stat-box"><div class="num">${total}</div><div class="lbl">Tổng số câu</div></div>
    <div class="stat-box"><div class="num">${desCount}</div><div class="lbl">Chuyên đề</div></div>
    <div class="stat-box"><div class="num">50</div><div class="lbl">Mặc định / lượt</div></div>
  `;

  // count options
  const counts = [20,30,50,100];
  const countBox = document.getElementById('count-options');
  countBox.innerHTML = '';
  counts.forEach(c=>{
    const chip = document.createElement('div');
    chip.className = 'chip' + (c===50?' active':'');
    chip.textContent = c + ' câu';
    chip.onclick = ()=>{
      selectedCount = c;
      document.querySelectorAll('#count-options .chip').forEach(el=>el.classList.remove('active'));
      chip.classList.add('active');
    };
    countBox.appendChild(chip);
  });

  // de options (multi-select toggle, all selected by default)
  const deBox = document.getElementById('de-options');
  deBox.innerHTML = '';
  Object.keys(DE_NAMES).forEach(k=>{
    const chip = document.createElement('div');
    chip.className = 'chip active';
    chip.textContent = DE_NAMES[k];
    chip.onclick = ()=>{
      if(selectedDes.has(k)){
        if(selectedDes.size>1){ // don't allow zero selection
          selectedDes.delete(k);
          chip.classList.remove('active');
        }
      } else {
        selectedDes.add(k);
        chip.classList.add('active');
      }
    };
    deBox.appendChild(chip);
  });
}

function startQuiz(){
  const pool = QUIZ_DATA.filter(q=>selectedDes.has(q.de));
  const n = Math.min(selectedCount, pool.length);
  const picked = shuffle(pool).slice(0, n);

  currentQuiz = picked.map(item=>{
    const optEntries = shuffle(Object.entries(item.options)); // [ [letter,text], ... ]
    return {
      id: item.id,
      de: item.de,
      q: item.q,
      answerLetter: item.answer,
      answerText: item.options[item.answer],
      options: optEntries,
      userLetter: null
    };
  });

  renderQuiz();
  document.getElementById('start-screen').style.display='none';
  document.getElementById('quiz-screen').style.display='block';
  window.scrollTo({top:0,behavior:'smooth'});
}

function renderQuiz(){
  const container = document.getElementById('questions-container');
  container.innerHTML = '';
  currentQuiz.forEach((item, idx)=>{
    const card = document.createElement('div');
    card.className = 'q-card';
    card.id = 'qcard-'+idx;

    const head = document.createElement('div');
    head.className = 'q-head';
    head.innerHTML = `<span class="q-num">Câu ${idx+1}/${currentQuiz.length}</span><span class="q-tag">${DE_NAMES[item.de].split('·')[0].trim()}</span>`;
    card.appendChild(head);

    const qtext = document.createElement('div');
    qtext.className = 'q-text';
    qtext.textContent = item.q;
    card.appendChild(qtext);

    item.options.forEach(([letter, text])=>{
      const optDiv = document.createElement('div');
      optDiv.className = 'option';
      optDiv.dataset.letter = letter;
      optDiv.innerHTML = `<span class="letter">${letter}</span><span>${text}</span>`;
      optDiv.onclick = ()=> selectOption(idx, letter);
      card.appendChild(optDiv);
    });

    container.appendChild(card);
  });
  updateProgress();
}

function selectOption(qIdx, letter){
  currentQuiz[qIdx].userLetter = letter;
  const card = document.getElementById('qcard-'+qIdx);
  card.querySelectorAll('.option').forEach(el=>{
    el.classList.toggle('selected', el.dataset.letter===letter);
  });
  updateProgress();
}

function updateProgress(){
  const answered = currentQuiz.filter(q=>q.userLetter!==null).length;
  const total = currentQuiz.length;
  const pct = Math.round((answered/total)*100);
  document.getElementById('progress-text').textContent = `Đã trả lời ${answered}/${total}`;
  document.getElementById('progress-pct').textContent = pct+'%';
  document.getElementById('progress-bar').style.width = pct+'%';
}

function submitQuiz(){
  const unanswered = currentQuiz.filter(q=>q.userLetter===null).length;
  if(unanswered>0){
    if(!confirm(`Bạn còn ${unanswered} câu chưa trả lời. Vẫn muốn nộp bài?`)) return;
  }

  // lock & grade UI
  currentQuiz.forEach((item, idx)=>{
    const card = document.getElementById('qcard-'+idx);
    card.querySelectorAll('.option').forEach(el=>{
      el.classList.add('disabled');
      el.onclick = null;
      const letter = el.dataset.letter;
      if(letter === item.answerLetter){
        el.classList.add('correct');
      } else if(letter === item.userLetter && item.userLetter !== item.answerLetter){
        el.classList.add('wrong');
      }
    });
  });
  document.getElementById('submit-bar').style.display='none';

  showResult();
}

function showResult(){
  const total = currentQuiz.length;
  const correct = currentQuiz.filter(q=>q.userLetter===q.answerLetter).length;
  const pct = Math.round((correct/total)*100);

  document.getElementById('score-big').textContent = `${correct}/${total}`;
  const circle = document.getElementById('score-circle');
  let color = '#dc2626';
  if(pct>=80) color = '#16a34a';
  else if(pct>=50) color = '#d97706';
  circle.style.borderColor = color;
  circle.style.color = color;

  let msg, sub;
  if(pct>=90){ msg='🏆 Xuất sắc!'; sub='Bạn nắm rất chắc kiến thức rồi đó.'; }
  else if(pct>=70){ msg='👍 Khá tốt!'; sub='Ôn thêm chút nữa là chắc kèo.'; }
  else if(pct>=50){ msg='📖 Cần cố gắng thêm'; sub='Xem lại phần sai để nắm chắc hơn nhé.'; }
  else { msg='💪 Cần ôn tập kỹ hơn'; sub='Đừng nản, xem lại đáp án và làm lại nha.'; }
  document.getElementById('result-msg').textContent = msg;
  document.getElementById('result-sub').textContent = `${correct}/${total} câu đúng (${pct}%) — ${sub}`;

  // breakdown by de
  const byDe = {};
  currentQuiz.forEach(q=>{
    if(!byDe[q.de]) byDe[q.de] = {correct:0, total:0};
    byDe[q.de].total++;
    if(q.userLetter===q.answerLetter) byDe[q.de].correct++;
  });
  const breakdownEl = document.getElementById('breakdown');
  breakdownEl.innerHTML = '';
  Object.keys(byDe).sort().forEach(k=>{
    const row = document.createElement('div');
    row.className = 'row';
    row.innerHTML = `<span>${DE_NAMES[k].split('·')[0].trim()}</span><b>${byDe[k].correct}/${byDe[k].total}</b>`;
    breakdownEl.appendChild(row);
  });

  // review section (built now, shown on toggle)
  const reviewEl = document.getElementById('review-section');
  reviewEl.innerHTML = '<h3 style="margin-bottom:10px;">Chi tiết từng câu</h3>';
  currentQuiz.forEach((item, idx)=>{
    const isCorrect = item.userLetter === item.answerLetter;
    const div = document.createElement('div');
    div.className = 'review-item ' + (isCorrect?'right-item':'wrong-item');
    let userLine = item.userLetter
      ? `<div class="ra ${isCorrect?'correct-ans':'wrong-ans'}">Bạn chọn: ${item.userLetter}. ${dict(item.options,item.userLetter)}</div>`
      : `<div class="ra wrong-ans">Bạn chưa chọn đáp án</div>`;
    let correctLine = isCorrect ? '' : `<div class="ra correct-ans">Đáp án đúng: ${item.answerLetter}. ${item.answerText}</div>`;
    div.innerHTML = `<div class="rq">Câu ${idx+1}: ${item.q}</div>${userLine}${correctLine}`;
    reviewEl.appendChild(div);
  });

  document.getElementById('quiz-screen').style.display='none';
  document.getElementById('result-screen').style.display='block';
  window.scrollTo({top:0,behavior:'smooth'});
}

function dict(entries, letter){
  const found = entries.find(([l,t])=>l===letter);
  return found ? found[1] : '';
}

function toggleReview(){
  const el = document.getElementById('review-section');
  el.style.display = el.style.display==='none' ? 'block' : 'none';
}

buildStatsAndOptions();
</script>
