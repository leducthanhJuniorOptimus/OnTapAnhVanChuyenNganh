<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<title>Trắc nghiệm Anh Văn Chuyên Ngành Của Các Chú Khỉ 25C1_LTM1</title>
<style>
  :root{
    --bg:#0f172a;
    --card:#111c34;
    --ink:#eef2ff;
    --muted:#93a0c2;
    --accent:#5eead4;
    --accent2:#f0a868;
    --correct:#4ade80;
    --wrong:#f87171;
    --border:#243356;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--ink);
    font-family:'Segoe UI',Tahoma,Arial,sans-serif;
    padding:32px 16px 80px;
  }
  .wrap{max-width:760px;margin:0 auto;}
  header{text-align:center;margin-bottom:20px;}
  header h1{font-size:1.6rem;margin:0 0 6px;letter-spacing:.3px;}
  header p{color:var(--muted);margin:0;font-size:.95rem;}
  .progress-bar{
    height:6px;background:var(--border);border-radius:99px;overflow:hidden;margin:18px 0 6px;
    position:sticky;top:0;z-index:5;
  }
  .progress-fill{
    height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));width:0%;
    transition:width .3s ease;
  }
  .progress-label{text-align:center;color:var(--muted);font-size:.8rem;margin-bottom:22px;}
  .unit-tag{
    display:inline-block;font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;
    color:var(--bg);background:var(--accent);padding:3px 10px;border-radius:99px;margin:24px 0 10px;
    font-weight:700;
  }
  .card{
    background:var(--card);border:1px solid var(--border);border-radius:14px;
    padding:22px 22px 18px;margin-bottom:18px;
  }
  .qnum{color:var(--muted);font-size:.85rem;margin-bottom:4px;}
  .qtext{font-size:1.05rem;margin:0 0 14px;line-height:1.5;}
  .opt{
    display:flex;align-items:center;gap:10px;
    border:1px solid var(--border);border-radius:10px;padding:10px 14px;margin-bottom:8px;
    cursor:pointer;transition:.15s;
  }
  .opt:hover{border-color:var(--accent);}
  .opt input{accent-color:var(--accent);}
  .opt.correct{border-color:var(--correct);background:rgba(74,222,128,.08);}
  .opt.wrong{border-color:var(--wrong);background:rgba(248,113,113,.08);}
  .explain{
    display:none;margin-top:10px;font-size:.88rem;color:var(--muted);
    border-left:3px solid var(--accent);padding:8px 12px;background:#0b1428;border-radius:0 8px 8px 0;
  }
  .explain.show{display:block;}
  .submitbar{
    position:sticky;bottom:0;background:linear-gradient(180deg,rgba(15,23,42,0),var(--bg) 30%);
    padding:20px 0 4px;text-align:center;
  }
  button{
    background:var(--accent);color:#08251f;border:none;border-radius:10px;
    padding:13px 32px;font-size:1rem;font-weight:700;cursor:pointer;
  }
  button:hover{filter:brightness(1.08);}
  #result{
    text-align:center;background:var(--card);border:1px solid var(--border);
    border-radius:14px;padding:26px;margin-top:10px;display:none;
  }
  #result h2{margin:0 0 6px;font-size:2rem;}
  #result p{color:var(--muted);margin:4px 0 0;}
  #result.show{display:block;}
  .unit-score{text-align:left;margin-top:16px;font-size:.85rem;color:var(--muted);border-top:1px solid var(--border);padding-top:14px;}
  .unit-score div{display:flex;justify-content:space-between;padding:3px 0;}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Infotech: English for Computer Users Rest In Peach</h1>
    <p>Trắc nghiệm Anh Văn Chuyên Ngành Của Các Chú Khỉ 25C1_LTM1</p>
  </header>
  <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
  <div class="progress-label" id="progressLabel">Đã trả lời 0 / 0 câu</div>
  <form id="quizForm"></form>
  <div class="submitbar"><button id="submitBtn" type="button">Nộp bài</button></div>
  <div id="result"></div>
</div>

<script>

{unit:"Unit 2 — Computer essentials", q:"Which of the following is an input device?", opts:["Printer","Monitor","Keyboard","Hard drive"], a:2, ex:"Keyboard đưa dữ liệu vào máy; printer/monitor là output, hard drive là storage."},
{unit:"Unit 2 — Computer essentials", q:"'It is the brain of the computer' refers to the...", opts:["CPU","RAM","modem","scanner"], a:0, ex:"CPU được ví như 'bộ não' của máy tính."},

{unit:"Unit 2 — Computer essentials", q:"On a tablet PC, you can write directly onto the screen using a...", opts:["mouse","stylus","joystick","trackpad"], a:1, ex:"Stylus dùng để viết trực tiếp lên màn hình tablet PC."},
{unit:"Unit 2 — Computer essentials", q:"A Personal Digital Assistant (PDA) is small enough to fit into...", opts:["a briefcase","a backpack","the palm of your hand","a desk drawer"], a:2, ex:"PDA nhỏ gọn, vừa lòng bàn tay."},
{unit:"Unit 2 — Computer essentials", q:"Storage devices (hard drives, DVD drives, flash drives) provide...", opts:["temporary processing power","a permanent storage of data and programs","a way to display output","network connectivity only"], a:1, ex:"Storage devices lưu trữ lâu dài dữ liệu và chương trình."},
{unit:"Unit 2 — Computer essentials", q:"What is a 'peripheral'?", opts:["A physical unit attached to the computer","A type of software program","The main circuit board","A unit of memory"], a:0, ex:"Peripheral là thiết bị ngoại vi gắn với máy tính (input/output/storage)."},
{unit:"Unit 2 — Computer essentials", q:"What are the three basic hardware sections of a computer mentioned in the text?", opts:["CPU, main memory, and peripherals","Monitor, keyboard, and mouse","Software, firmware, and hardware","Input, output, and Wi-Fi"], a:0, ex:"3 phần cơ bản: CPU, bộ nhớ chính và các thiết bị ngoại vi."},
{unit:"Unit 2 — Computer essentials", q:"The main memory is described as a collection of...", opts:["hard disks","RAM chips","ROM chips","optical discs"], a:1, ex:"Main memory là tập hợp các chip RAM."},
{unit:"Unit 2 — Computer essentials", q:"Ports on a computer allow you to plug in...", opts:["peripherals such as a modem, digital camera, or scanner","only the power cable","only USB flash drives","nothing; ports are decorative"], a:0, ex:"Cổng (ports) cho phép kết nối các thiết bị ngoại vi."},
{unit:"Unit 2 — Computer essentials", q:"'___ enable data to go into the computer's memory.'", opts:["Output devices","Input devices","Storage devices","Peripheral ports"], a:1, ex:"Input devices đưa dữ liệu vào bộ nhớ máy tính."},
{unit:"Unit 2 — Computer essentials", q:"In a peer-to-peer network architecture...", opts:["all computers have the same capabilities","one computer controls all the others","only servers can store data","there is no data sharing"], a:0, ex:"Peer-to-peer: tất cả máy tính có vai trò ngang nhau."},
{unit:"Unit 2 — Computer essentials", q:"In a client-server network, what do servers do?", opts:["Only display graphics","Store and distribute data","Only print documents","Act as input devices"], a:1, ex:"Server lưu trữ và phân phối dữ liệu cho các client."},
{unit:"Unit 2 — Computer essentials", q:"According to the text, 'software' is defined as...", opts:["any electronic or mechanical part you can see or touch","a set of instructions, called a program, that tells the computer what to do","a type of storage device","the physical casing of a computer"], a:1, ex:"Software là tập hợp các lệnh (chương trình) điều khiển máy tính."},
{unit:"Unit 2 — Computer essentials", q:"Which of these is an example of an output device?", opts:["Keyboard","Mouse","Monitor","Scanner"], a:2, ex:"Monitor hiển thị kết quả — là thiết bị xuất (output)."},

{unit:"Unit 3 — Inside the system", q:"An integrated circuit is best described as...", opts:["a complex electrical circuit built on a small piece of silicon","a type of printer","a unit of memory","a type of software license"], a:0, ex:"Integrated circuit (chip) là mạch điện tử phức tạp trên miếng silicon nhỏ."},
{unit:"Unit 3 — Inside the system", q:"The channel that carries data from the CPU to other devices is called the...", opts:["front side bus","clipboard","dock","desktop"], a:0, ex:"Front side bus truyền dữ liệu từ CPU đến các thiết bị khác."},
{unit:"Unit 3 — Inside the system", q:"What does 'bus width' determine?", opts:["The colour of the monitor","How much data can be transmitted at once","The speed of the mouse","The size of the hard drive"], a:1, ex:"Bus width quyết định lượng dữ liệu truyền được cùng lúc."},

{unit:"Unit 3 — Inside the system", q:"ASCII is used for...", opts:["the standard binary representation of characters","measuring clock speed","cooling the processor","connecting peripherals"], a:0, ex:"ASCII mã hóa ký tự thành dạng nhị phân chuẩn."},

{unit:"Unit 3 — Inside the system", q:"1,024 megabytes (MB) equals one...", opts:["kilobyte","byte","gigabyte (GB)","bit"], a:2, ex:"1,024 MB = 1 GB."},

{unit:"Unit 7 — Display screens & ergonomics", q:"What does LCD stand for?", opts:["Liquid Crystal Display","Linear Colour Display","Light Contrast Device","Long Cathode Display"], a:0, ex:"LCD = Liquid Crystal Display."},

{unit:"Unit 7 — Display screens & ergonomics", q:"Ergonomics is the study of...", opts:["how computers process data","how people interact safely and efficiently with machines and work conditions","how printers produce images","how networks transmit data"], a:1, ex:"Ergonomics nghiên cứu tương tác an toàn giữa người và máy."},

const form = document.getElementById('quizForm');
let lastUnit = "";
QUIZ.forEach((item,i)=>{
  const card = document.createElement('div');
  card.className = 'card';
  let tagHtml = '';
  if(item.unit !== lastUnit){
    tagHtml = `<div class="unit-tag">${item.unit}</div>`;
    lastUnit = item.unit;
  }
  let optsHtml = item.opts.map((o,j)=>`
    <label class="opt" data-q="${i}" data-o="${j}">
      <input type="radio" name="q${i}" value="${j}"> <span>${o}</span>
    </label>`).join('');
  card.innerHTML = `${tagHtml}<div class="qnum">Câu ${i+1}/${QUIZ.length}</div>
    <p class="qtext">${item.q}</p>
    ${optsHtml}
    <div class="explain" id="ex${i}">${item.ex}</div>`;
  form.appendChild(card);
});

function updateProgress(){
  let answered = 0;
  QUIZ.forEach((_,i)=>{ if(form.querySelector(`input[name="q${i}"]:checked`)) answered++; });
  document.getElementById('progressFill').style.width = (answered/QUIZ.length*100)+'%';
  document.getElementById('progressLabel').textContent = `Đã trả lời ${answered} / ${QUIZ.length} câu`;
}
form.addEventListener('change', updateProgress);
updateProgress();

document.getElementById('submitBtn').addEventListener('click', ()=>{
  let score = 0;
  let unanswered = [];
  const unitStats = {};
  QUIZ.forEach((item,i)=>{
    const checked = form.querySelector(`input[name="q${i}"]:checked`);
    const opts = form.querySelectorAll(`.opt[data-q="${i}"]`);
    if(!checked){ unanswered.push(i+1); }
    opts.forEach(opt=>{
      const o = parseInt(opt.dataset.o);
      opt.classList.remove('correct','wrong');
      if(o === item.a) opt.classList.add('correct');
      else if(checked && parseInt(checked.value)===o) opt.classList.add('wrong');
    });
    if(!unitStats[item.unit]) unitStats[item.unit] = {correct:0,total:0};
    unitStats[item.unit].total++;
    if(checked && parseInt(checked.value)===item.a){ score++; unitStats[item.unit].correct++; }
    document.getElementById('ex'+i).classList.add('show');
  });
  document.getElementById('progressFill').style.width = '100%';
  document.getElementById('progressLabel').textContent = `Đã trả lời ${QUIZ.length} / ${QUIZ.length} câu`;
  const result = document.getElementById('result');
  const pct = Math.round(score/QUIZ.length*100);
  let unitHtml = Object.entries(unitStats).map(([u,s])=>`<div><span>${u}</span><span>${s.correct}/${s.total}</span></div>`).join('');
  result.innerHTML = `<h2>${score} / ${QUIZ.length} câu đúng (${pct}%)</h2>
    <p>${pct>=80?'Xuất sắc! Bạn nắm rất vững các unit này.':pct>=60?'Khá tốt — xem lại phần giải thích ở các câu sai nhé.':'Nên ôn lại nội dung các unit rồi làm lại bài trắc nghiệm.'}</p>
    ${unanswered.length? `<p style="color:var(--wrong)">Chưa trả lời câu: ${unanswered.join(', ')}</p>`:''}
    <div class="unit-score">${unitHtml}</div>`;
  result.classList.add('show');
  result.scrollIntoView({behavior:'smooth'});
  document.getElementById('submitBtn').textContent = 'Đã nộp bài ✓';
  document.getElementById('submitBtn').disabled = true;
});
</script>
